            <p class="muted">Gear for Galloping Lexicon. Prices are steep. Earn them with accuracy and smart bets.</p>
          </section>
          <section class="panel">
            <h2>Power-ups</h2>
            <div class="shop-list">
              <article class="shop-item">
                <span class="shop-icon" aria-hidden="true">🧪</span>
                <div class="shop-info"><b>${STABLE.elixir.name}</b><span>Refill Focus to 100% right now. You have ${focusBar(fst().focus, false)}</span></div>
                ${btn("elixir", STABLE.elixir.price, { disabled: fst().focus >= RULES.focusMax ? "Focus full" : "" })}
              </article>
              <article class="shop-item">
                <span class="shop-icon" aria-hidden="true">💨</span>
                <div class="shop-info"><b>${STABLE.burst.name}</b><span>Start a race 1 step ahead. Owned: ${st.bursts}</span></div>
                ${btn("burst", STABLE.burst.price)}
              </article>
            </div>
          </section>
          <section class="panel">
            <h2>Jockey silks</h2>
            <div class="shop-list">
              ${[{ id: null, name: "Classic Blue", price: 0 }, ...STABLE.silks].map((s) => `
                <article class="shop-item silk-${s.id || HORSE.lexicon.silk}">
                  <span class="silk-dot big" aria-hidden="true">1</span>
                  <div class="shop-info"><b>${esc(s.name)}</b><span>${s.id ? "Jockey silks" : "Default"}</span></div>
                  ${btn(`silk:${s.id || ""}`, s.price, { owned: !s.id || st.silks.includes(s.id), equipped: st.silk === s.id })}
                </article>`).join("")}
            </div>
          </section>
          <section class="panel">
            <h2>Mounts</h2>
            <div class="shop-list">
              ${[{ id: null, name: "Thoroughbred", emoji: "🏇", price: 0 }, ...STABLE.mounts].map((m) => `
                <article class="shop-item">
                  <span class="shop-icon mount" aria-hidden="true">${m.emoji}</span>
                  <div class="shop-info"><b>${esc(m.name)}</b><span>${m.id ? "Races in your lane" : "Default"}</span></div>
                  ${btn(`mount:${m.id || ""}`, m.price, { owned: !m.id || st.mounts.includes(m.id), equipped: st.mount === m.id })}
                </article>`).join("")}
            </div>
          </section>
        </div>`;
      container.querySelector("#stable-back").addEventListener("click", () => go(back));
      container.querySelectorAll("[data-buy]").forEach((b) => b.addEventListener("click", () => buy(b.dataset.buy)));
      container.querySelectorAll("[data-equip]").forEach((b) => b.addEventListener("click", () => equip(b.dataset.equip)));
    }

    // Two taps: the first arms the button, the second buys.
    function buy(key) {
      if (armed !== key) { armed = key; ctx.sfx.play("tap"); return renderStable(); }
      if (!buyItem(stats(), S(), key, fst()).ok) return;
      armed = null;
      touch();
      ctx.save();
      ctx.renderHud(["sparks"]);
      ctx.sfx.play("combo");
      ctx.toast(key === "elixir" ? "🧪 Focus refilled!" : key === "burst" ? "💨 Starting Burst added" : "New gear equipped!");
      renderStable();
    }

    function equip(key) {
      const [kind, id] = key.split(":");
      const st = stats();
      if (kind === "silk") st.silk = id || null;
      else st.mount = id || null;
      touch();
      ctx.save();
      ctx.sfx.play("tap");
      renderStable();
    }

    function exit() {
      stopClock();
      screen = null;
      race = null;
      ctx.onExit();
    }

    // A–D or 1–4 answer; works while the Vocab tab is showing.
    document.addEventListener("keydown", (e) => {
      if (screen !== "race" || !race || race.picked !== null || container.hidden) return;
      if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest("input, select, textarea") || document.querySelector('[aria-modal="true"]')) return;
      const k = e.key.toLowerCase();
      const i = "abcd".includes(k) && k.length === 1 ? "abcd".indexOf(k) : "1234".indexOf(e.key);
      if (i >= 0) { e.preventDefault(); answer(i); }
    });

    return {
      open,
      openStable: () => { back = "intro"; go("stable"); },
      render,
      active: () => screen !== null,
      racing: () => screen === "race",
      sync: () => loop(), // repaint the live race at once (e.g. when its tab is shown again)
    };
  }

  SW.derby = { RULES, MODES, HORSES, PROFILES, CPU, PENALTY, TACTICS, STABLE, newRace, tick, playerAnswer, lockFor, tacticFor, makeQuestion, related, emptyStats, mergeStats, priceOf, buyItem, mount };
})();

</script>
<script>
/* ===== js/fishing.js ===== */
// SatWizz Vocab Fishing: a Vault game where you hook the fish carrying the
// right definition.
//
//   • A round is 8 casts. Each cast shows a word (part of speech and its
//     context sentence) and sends a school of 4 fish swimming across the
//     water, each carrying a definition. Tap (or press 1–4) the fish with the
//     right one before the 20s line timer runs out.
//   • Hook the right fish: +5 ⚡ and the word's review flag clears. Hook a wrong
//     one, or let the timer run out, and the school scatters: the word is
//     flagged 🔁 for review. A perfect round pays +20 ⚡.
//   • Rods give small perks and spots set the scenery and the word pool. Both
//     are sold in the Shop (500 ⚡ each); the Bamboo Rod and Village Pond are free.
//
// Exposes SatWizz.fishing = { RULES, RODS, SPOTS, emptyStats, mergeStats,
// buyItem, poolFor, makeCast, mount }.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});

  const RULES = Object.freeze({
    casts: 8,
    fish: 4,
    lineSeconds: 20,
    catchSparks: 5,
    perfectSparks: 20,
    swimSeconds: [7, 10], // one crossing of the water, per fish
  });

  // Rods: small perks. Spots: scenery + which words bite.
  const RODS = [
    { id: "bamboo", name: "Bamboo Rod", emoji: "🎋", price: 0, perk: "No perk. A classic." },
    { id: "graphite", name: "Steady Graphite", emoji: "🎣", price: 500, perk: "Fish swim 25% slower.", slow: 1.25 },
    { id: "reel", name: "Second-Chance Reel", emoji: "🧵", price: 500, perk: "Your first wrong hook each round doesn't scare the school off.", secondChance: true },
    { id: "golden", name: "Golden Lure", emoji: "✨", price: 500, perk: "+2 ⚡ on every catch.", bonus: 2 },
  ];
  const SPOTS = [
    { id: "pond", name: "Village Pond", emoji: "🪷", price: 0, desc: "Core high-frequency words.", pool: "core" },
    { id: "lake", name: "Misty Lake", emoji: "🌫️", price: 500, desc: "Advanced words only.", pool: "advanced" },
    { id: "reef", name: "Coral Reef", emoji: "🪸", price: 500, desc: "All 55 Vocab Vault words.", pool: "all" },
    { id: "bay", name: "Moonlit Bay", emoji: "🌙", price: 500, desc: "Words you flagged for review bite first.", pool: "review" },
  ];
  const rodById = (id) => RODS.find((r) => r.id === id) || RODS[0];
  const spotById = (id) => SPOTS.find((s) => s.id === id) || SPOTS[0];
  const FISH = ["🐟", "🐠", "🐡", "🦈"];

  const rnd = Math.random;
  const shuffle = (arr, rand = rnd) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // ---------- Stats (kept in the Vault progress as vocab.fishing) ----------
  const emptyStats = () => ({ rounds: 0, catches: 0, perfect: 0, best: 0, rods: [], spots: [], rod: "bamboo", spot: "pond", at: 0 });
  function mergeStats(a, b) {
    const x = { ...emptyStats(), ...(a || {}) };
    const y = { ...emptyStats(), ...(b || {}) };
    const newer = (y.at || 0) > (x.at || 0) ? y : x;
    const rods = [...new Set([...x.rods, ...y.rods])].filter((id) => RODS.some((r) => r.id === id && r.price));
    const spots = [...new Set([...x.spots, ...y.spots])].filter((id) => SPOTS.some((s) => s.id === id && s.price));
    const owns = (list, id, cat) => !cat.find((c) => c.id === id)?.price || list.includes(id);
    return {
      rounds: Math.max(x.rounds, y.rounds),
      catches: Math.max(x.catches, y.catches),
      perfect: Math.max(x.perfect, y.perfect),
      best: Math.max(x.best, y.best),
      rods,
      spots,
      rod: owns(rods, newer.rod, RODS) ? newer.rod : "bamboo",
      spot: owns(spots, newer.spot, SPOTS) ? newer.spot : "pond",
      at: Math.max(x.at || 0, y.at || 0),
    };
  }

  // key: "rod:<id>" | "spot:<id>". Spends state.sparks, owns + equips the item.
  function buyItem(st, state, key) {
    const [kind, id] = key.split(":");
    const item = (kind === "rod" ? RODS : kind === "spot" ? SPOTS : []).find((x) => x.id === id);
    if (!item || !item.price) return { ok: false, reason: "unknown" };
    const list = kind === "rod" ? st.rods : st.spots;
    if (list.includes(id)) return { ok: false, reason: "owned" };
    if ((state.sparks || 0) < item.price) return { ok: false, reason: "short", need: item.price - (state.sparks || 0) };
    state.sparks -= item.price;
    list.push(id);
    if (kind === "rod") st.rod = id; else st.spot = id;
    st.at = Date.now();
    return { ok: true, spent: item.price, item };
  }

  // ---------- Rounds (pure) ----------
  // Words for a round at a spot. `progress` is the Vault progress (review flags).
  function poolFor(spotId, progress, words = SW.vocab.WORDS, rand = rnd) {
    const spot = spotById(spotId);
    if (spot.pool === "core") return shuffle(words.filter((w) => w.level !== "advanced"), rand);
    if (spot.pool === "advanced") return shuffle(words.filter((w) => w.level === "advanced"), rand);
    if (spot.pool === "review") {
      const flagged = (w) => Boolean(progress && progress.words && progress.words[w.id] && progress.words[w.id].review);
      return [...shuffle(words.filter(flagged), rand), ...shuffle(words.filter((w) => !flagged(w)), rand)];
    }
    return shuffle(words, rand);
  }

  // One cast: the word plus 4 fish (definitions), one of them right. Words
  // close in meaning (SatWizz.derby.related) never swim together.
  function makeCast(w, words = SW.vocab.WORDS, rand = rnd) {
    const others = shuffle(words.filter((x) => !SW.derby.related(w, x)), rand).slice(0, RULES.fish - 1);
    const fish = shuffle([w, ...others], rand).map((x, i) => ({ wordId: x.id, def: x.definition, right: x.id === w.id, kind: FISH[i % FISH.length] }));
    return { wordId: w.id, fish, answer: fish.findIndex((f) => f.right) };
  }

  // ---------- View ----------
  // ctx: { container, getState, save, esc, fill, sfx, toast, celebrate, earn,
  //        recordAnswer, renderHud, onExit, openShop }
  function mount(ctx) {
    const { container, esc } = ctx;
    let screen = null; // null | "dock" | "cast" | "result"
    let round = null; // { words, i, cast, results: [], earned, saved (reel used), timer, left, done }
    const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
    const S = () => ctx.getState();
    // Kept in the Vault progress (S.vocab.fishing), so it syncs with an account.
    const st = () => {
      const p = S().vocab;
      p.fishing = Object.assign(p.fishing || {}, mergeStats(p.fishing, null));
      return p.fishing;
    };
    const touch = () => { st().at = Date.now(); };
    const W = () => SW.vocab.WORDS;
    const word = (id) => W().find((w) => w.id === id);
    const fmt = (n) => Number(n || 0).toLocaleString("en-US");
    const banner = "=== 🎣 SATWIZZ VOCAB FISHING 🎣 ===";

    function go(next) {
      screen = next;
      render();
      container.scrollTop = 0;
    }
    function render() {
      if (screen === "dock") return renderDock();
      if (screen === "cast") return renderCast();
      if (screen === "result") return renderResult();
    }

    // ---------- Dock: rules, gear, start ----------
    function renderDock() {
      const s = st();
      const rod = rodById(s.rod);
      const spot = spotById(s.spot);
      const ownsRod = (r) => !r.price || s.rods.includes(r.id);
      const ownsSpot = (x) => !x.price || s.spots.includes(x.id);
      container.innerHTML = `
        <div class="stack vault fishing spot-${spot.id}">
          <div class="sprint-top">
            <button class="linkbtn" type="button" id="fish-exit">✕ Back to the Vocab Vault</button>
            <span class="pill-sm">⚡ ${fmt(S().sparks)}</span>
          </div>
          <section class="panel fish-intro">
            <pre class="derby-banner fish-banner" aria-label="SatWizz Vocab Fishing">${banner}</pre>
            <p class="muted center">Hook the fish that carries the right definition.</p>
            <ol class="rule-list">
              <li><b>${RULES.casts} casts a round.</b> Each cast shows a word and sends ${RULES.fish} fish across the water, each carrying a definition.</li>
              <li><b>Tap the right fish</b> (or press 1–${RULES.fish}) before the ${RULES.lineSeconds}s line runs out: +${RULES.catchSparks} ⚡${rod.bonus ? ` (+${rod.bonus} with your ${esc(rod.name)})` : ""}.</li>
              <li><b>Wrong fish or no bite?</b> The school scatters, and the word is flagged 🔁 for review.</li>
              <li><b>Perfect round</b> (${RULES.casts}/${RULES.casts}): +${RULES.perfectSparks} ⚡ bonus.</li>
            </ol>
            <button class="btn wide start-btn" type="button" id="fish-start">Cast off at ${esc(spot.name)} ${spot.emoji}</button>
          </section>
          <section class="panel">
            <h2>Your rod</h2>
            <div class="gear-list" role="radiogroup" aria-label="Rod">
              ${RODS.map((r) => `
                <button class="gear${s.rod === r.id ? " on" : ""}" type="button" role="radio" aria-checked="${s.rod === r.id}" data-rod="${r.id}" ${ownsRod(r) ? "" : "disabled"}>
                  <span class="gear-ico" aria-hidden="true">${r.emoji}</span>
                  <span class="gear-info"><b>${esc(r.name)}</b><small>${ownsRod(r) ? esc(r.perk) : `🔒 ${fmt(r.price)} ⚡ in the Shop · ${esc(r.perk)}`}</small></span>
                </button>`).join("")}
            </div>
            <h2>Your spot</h2>
            <div class="gear-list" role="radiogroup" aria-label="Fishing spot">
              ${SPOTS.map((x) => `
                <button class="gear${s.spot === x.id ? " on" : ""}" type="button" role="radio" aria-checked="${s.spot === x.id}" data-spot="${x.id}" ${ownsSpot(x) ? "" : "disabled"}>
                  <span class="gear-ico" aria-hidden="true">${x.emoji}</span>
                  <span class="gear-info"><b>${esc(x.name)}</b><small>${ownsSpot(x) ? esc(x.desc) : `🔒 ${fmt(x.price)} ⚡ in the Shop · ${esc(x.desc)}`}</small></span>
                </button>`).join("")}
            </div>
            ${ctx.openShop ? '<button class="btn ghost wide" type="button" id="fish-shop">🛍️ More rods and spots in the Shop</button>' : ""}
          </section>
          <section class="panel derby-stats">
            <div><b>${fmt(s.rounds)}</b><span>Rounds</span></div>
            <div><b>${fmt(s.catches)}</b><span>Catches</span></div>
            <div><b>${s.best}/${RULES.casts}</b><span>Best round</span></div>
            <div><b>${fmt(s.perfect)}</b><span>Perfect</span></div>
          </section>
        </div>`;
      container.querySelector("#fish-exit").addEventListener("click", exit);
      container.querySelector("#fish-start").addEventListener("click", start);
      container.querySelector("#fish-shop")?.addEventListener("click", () => ctx.openShop());
      container.querySelectorAll("[data-rod]:not(:disabled)").forEach((b) => b.addEventListener("click", () => { st().rod = b.dataset.rod; touch(); ctx.save(); ctx.sfx.play("tap"); renderDock(); }));
      container.querySelectorAll("[data-spot]:not(:disabled)").forEach((b) => b.addEventListener("click", () => { st().spot = b.dataset.spot; touch(); ctx.save(); ctx.sfx.play("tap"); renderDock(); }));
      container.querySelector("#fish-start").focus({ preventScroll: true });
    }

    // ---------- A round ----------
    function start() {
      ctx.sfx.play("tap");
      const words = poolFor(st().spot, S().vocab).slice(0, RULES.casts);
      round = { words, i: 0, results: [], earned: 0, saved: false };
      nextCast();
      go("cast");
    }

    function nextCast() {
      round.cast = makeCast(round.words[round.i]);
      round.left = RULES.lineSeconds;
      round.done = false;
      round.scared = new Set(); // fish that swam off after a Second-Chance miss
      round.picked = null;
      clearInterval(round.timer);
      round.timer = setInterval(tickLine, 250);
    }

    function tickLine() {
      if (!round || round.done) return;
      if (container.hidden) return; // paused while another tab is showing
      round.left = Math.max(0, round.left - 0.25);
      const bar = container.querySelector("#line-left");
      if (bar) bar.style.width = `${(round.left / RULES.lineSeconds) * 100}%`;
      const t = container.querySelector("#line-secs");
      if (t) t.textContent = `${Math.ceil(round.left)}s`;
      if (round.left <= 0) finishCast(null);
    }

    function renderCast() {
      const c = round.cast;
      const w = word(c.wordId);
      const rod = rodById(st().rod);
      const spot = spotById(st().spot);
      const swim = (i) => {
        const [a, b] = RULES.swimSeconds;
        const base = a + ((i * 7919 + round.i * 104729) % 1000) / 1000 * (b - a);
        return (base * (rod.slow || 1)).toFixed(2);
      };
      container.innerHTML = `
        <div class="stack vault fishing spot-${spot.id}">
          <div class="sprint-top">
            <button class="linkbtn" type="button" id="fish-quit">✕ Reel in</button>
            <span class="muted small" aria-live="polite">Cast ${round.i + 1} of ${round.words.length} · ${round.results.filter((r) => r.caught).length} caught</span>
          </div>
          <section class="card-inner bb fish-word">
            <div class="bb-top"><span class="bb-num">${round.i + 1}</span><span class="bb-meta">Hook the definition of</span><span class="q-timer" aria-hidden="true">🎣 <span id="line-secs">${Math.ceil(round.left)}s</span></span></div>

            <p class="fish-context">${ctx.fill(w.text).replace("______", `<b class="fc-hl">${esc(w.word)}</b>`).replace(SW.UNDERLINE_RE, '<b class="fc-hl">$1</b>')}</p>
            <div class="line-bar" aria-hidden="true"><i id="line-left" style="width:${(round.left / RULES.lineSeconds) * 100}%"></i></div>
          </section>
          <section class="water${reducedMotion() ? " still" : ""}" id="water" aria-label="Fish">
            ${c.fish.map((f, i) => `
              <div class="lane-water">
                <button class="fish${i % 2 ? " rtl" : ""}" type="button" data-fish="${i}" style="--swim:${swim(i)}s;--delay:-${(i * 1.7).toFixed(1)}s" aria-label="Fish ${i + 1}: ${esc(f.def)}">
                  <span class="fish-body" aria-hidden="true">${f.kind}</span><span class="fish-def"><b>${i + 1}</b> ${esc(f.def)}</span>
                </button>
              </div>`).join("")}
          </section>
          <div id="fish-feedback" aria-live="polite"></div>
        </div>`;
      container.querySelector("#fish-quit").addEventListener("click", quit);
      container.querySelectorAll("[data-fish]").forEach((b) => b.addEventListener("click", () => hook(Number(b.dataset.fish))));
      paintCast();
    }

    // Marks fish after a hook / scatter and shows the feedback + Next button.
    function paintCast() {
      const c = round.cast;
      container.querySelectorAll("[data-fish]").forEach((b) => {
        const i = Number(b.dataset.fish);
        b.classList.toggle("gone", round.scared.has(i));
        if (round.done) {
          b.disabled = true;
          b.classList.toggle("caught", i === c.answer && round.picked === i);
          b.classList.toggle("reveal", i === c.answer && round.picked !== i);
          b.classList.toggle("wrong", i === round.picked && i !== c.answer);
        } else b.disabled = round.scared.has(i);
      });
      container.querySelector("#water")?.classList.toggle("stopped", round.done);
      if (!round.done) return;
      const w = word(c.wordId);
      const r = round.results[round.results.length - 1];

      container.querySelector("#fish-next").focus({ preventScroll: true });
      container.querySelector("#fish-feedback").scrollIntoView({ block: "nearest", behavior: reducedMotion() ? "auto" : "smooth" });

      if (!round || round.done || round.scared.has(i)) return;
      const c = round.cast;
      if (i !== c.answer && rodById(st().rod).secondChance && !round.saved) {
        // Second-Chance Reel: that fish swims off, the rest stay.
        round.saved = true;
        round.scared.add(i);
        ctx.sfx.play("wrong");
        ctx.toast("🧵 Second-Chance Reel: that one swam off. Try again!");
        paintCast();
        return;
      }
      finishCast(i);
    }

    function finishCast(i) {
      const c = round.cast;
      round.done = true;
      round.picked = i;
      clearInterval(round.timer);
      const caught = i === c.answer;
      const p = S().vocab;
      let sparks = 0;
      if (caught) {
        sparks = RULES.catchSparks + (rodById(st().rod).bonus || 0);
        ctx.earn(sparks);
        round.earned += sparks;
        if (p.words[c.wordId]) p.words[c.wordId].review = false;
        ctx.sfx.play("correct");
        ctx.sfx.buzz(50);
      } else {
        SW.vocab.flag(p, c.wordId);
        ctx.sfx.play("wrong");
      }
      round.results.push({ wordId: c.wordId, caught, sparks });
      ctx.recordAnswer(caught);
      touch();
      ctx.save();
      ctx.renderHud(caught ? ["sparks"] : []);
      paintCast();
    }

    function advance() {
      round.i += 1;
      if (round.i >= round.words.length) return finishRound();
      nextCast();
      renderCast();
      container.querySelector("[data-fish]")?.focus({ preventScroll: true });
    }

    function finishRound() {
      const s = st();
      const caught = round.results.filter((r) => r.caught).length;
      const perfect = caught === round.words.length;
      if (perfect) {
        ctx.earn(RULES.perfectSparks);
        round.earned += RULES.perfectSparks;
        s.perfect += 1;
      }
      s.rounds += 1;
      s.catches += caught;
      s.best = Math.max(s.best, caught);
      round.caught = caught;
      round.perfect = perfect;
      touch();
      ctx.save();
      ctx.renderHud(["sparks"]);
      if (perfect) ctx.celebrate("🎣", "Perfect round!", `+${RULES.perfectSparks} ⚡ bonus`);
      go("result");
    }

    function renderResult() {
      const spot = spotById(st().spot);
      container.innerHTML = `
        <div class="stack vault fishing spot-${spot.id}">
          <section class="panel sprint-summary">
            <span class="complete-star" aria-hidden="true">${round.perfect ? "🏆" : "🧺"}</span>

            <p class="derby-payout ok">+${fmt(round.earned)} ⚡${round.perfect ? ` · includes the +${RULES.perfectSparks} perfect bonus` : ""}</p>
            <ul class="sum-list">
              ${round.results.map((r) => {
                const w = word(r.wordId);
                return `<li class="sum-row ${r.caught ? "ok" : "no"}"><span aria-label="${r.caught ? "caught" : "missed"}">${r.caught ? "🐟" : "✗"}</span><b>${esc(w.word)}</b><span class="muted small">${esc(w.definition)}</span></li>`;
              }).join("")}
            </ul>
            ${round.caught < round.words.length ? '<p class="muted small">Missed words are flagged 🔁. They lead your next flashcard deck and sprint.</p>' : ""}
          </section>
          <div class="stack">
            <button class="btn wide" type="button" id="fish-again">🎣 Fish again</button>
            <button class="btn ghost wide" type="button" id="fish-dock">Change rod or spot</button>
            <button class="btn ghost wide" type="button" id="fish-exit">Back to the Vocab Vault</button>
          </div>
        </div>`;
      round = null;
      container.querySelector("#fish-again").addEventListener("click", start);
      container.querySelector("#fish-dock").addEventListener("click", () => go("dock"));
      container.querySelector("#fish-exit").addEventListener("click", exit);
    }

    function quit() {
      if (round) clearInterval(round.timer);
      round = null;
      go("dock");
    }
    function exit() {
      if (round) clearInterval(round.timer);
      round = null;
      screen = null;
      ctx.onExit();
    }

    // 1–4 hooks a fish while a cast is open.
    document.addEventListener("keydown", (e) => {
      if (screen !== "cast" || !round || round.done || container.hidden) return;
      if (e.altKey || e.ctrlKey || e.metaKey || e.target.closest("input, select, textarea") || document.querySelector('[aria-modal="true"]')) return;
      const i = "1234".indexOf(e.key);
      if (i >= 0) { e.preventDefault(); hook(i); }
    });

    return {
      open: () => { ctx.sfx.play("tap"); go("dock"); },
      render,
      active: () => screen !== null,
      playing: () => screen === "cast",
    };
  }

  SW.fishing = { RULES, RODS, SPOTS, rodById, spotById, emptyStats, mergeStats, buyItem, poolFor, makeCast, mount };
})();

</script>

  const BY_ID = Object.fromEntries(WORDS.map((w) => [w.id, w]));

  // ---------- Pronunciation (Web Speech API) ----------
  // The 🔊 button only shows where the browser can speak. Any [data-say]
  // button speaks its word; it never flips a card or opens a word.
  const speech = {
    supported: () => typeof window !== "undefined" && "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function",
    speak(text) {
      if (!speech.supported() || !text) return false;
      try {
        window.speechSynthesis.cancel();
        const u = new window.SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
        return true;
      } catch (e) {
        return false;
      }
    },
    button: (word, esc, cls = "") => (speech.supported()
      ? `<button type="button" class="say-btn${cls ? ` ${cls}` : ""}" data-say="${esc(word)}" aria-label="Pronounce ${esc(word)}" title="Hear it">🔊</button>`
      : ""),
    // One listener per container handles every [data-say] button inside it.
    wire(container) {
      container.addEventListener("click", (e) => {
        const b = e.target.closest("[data-say]");
        if (!b || !container.contains(b)) return;
        e.preventDefault();
        e.stopPropagation();
        speech.speak(b.dataset.say);
      }, true);
    },
  };
  SW.speech = speech;

  // ---------- Progress (pure) ----------
  // progress = { words: { [id]: { tier, seen, correct, wrong, lastAt, lastDay,
  //              advancedDay, mastered, review, cards, cardDay } }, sprintDay, sprints }
  //   seen/correct/wrong/lastDay count sprint answers; cards/cardDay count flashcard
  //   reviews; lastAt is the last activity of either kind (used for merging).
  const emptyProgress = () => ({ words: {}, sprintDay: null, sprints: 0, derby: SW.derby.emptyStats(), fishing: SW.fishing.emptyStats() });

  function wordState(p, id) {
    return { tier: 1, seen: 0, correct: 0, wrong: 0, lastAt: 0, lastDay: null, advancedDay: null, mastered: false, review: false, cards: 0, cardDay: null, ...p.words[id] };
  }

  const shuffle = (arr, rand) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // Picks the day's words: words still being learned come first (lowest tier,
  // least recently seen), then new words, then anything else.
  function drawSprint(p, today, rand = Math.random) {
    const n = RULES.sprintSize;
    const states = WORDS.map((w) => ({ id: w.id, s: wordState(p, w.id) }));
    const byAge = (a, b) => a.s.tier - b.s.tier || a.s.lastAt - b.s.lastAt;
    const flagged = states.filter((x) => x.s.review && x.s.lastDay !== today).sort(byAge);
    const learning = states.filter((x) => x.s.seen && x.s.tier < 3 && x.s.lastDay !== today).sort(byAge);
    const adv = (x) => (BY_ID[x.id].level === "advanced" ? 1 : 0);
    const fresh = shuffle(states.filter((x) => !x.s.seen), rand).sort((a, b) => adv(a) - adv(b)); // core words first
    const seenToday = states.filter((x) => x.s.seen && x.s.tier < 3 && x.s.lastDay === today).sort(byAge);
    const mastered = states.filter((x) => x.s.tier === 3).sort(byAge);
    const pick = [];
    const take = (list, max) => { for (const x of list) { if (pick.length >= n || max <= 0) break; if (!pick.includes(x.id)) { pick.push(x.id); max--; } } };
    take(flagged, 3); // words you asked to review
    take(learning, 3); // reviews
    take(fresh, n); // new words
    take(learning, n);
    take(seenToday, n);
    take(mastered, n);
    return shuffle(pick, rand);
  }

  // Flashcard deck: flagged words first, then words still being learned
  // (lowest tier first), then new words, then mastered words.
  function drawDeck(p, rand = Math.random) {
    const states = shuffle(WORDS, rand).map((w) => ({ id: w.id, s: wordState(p, w.id) }));
    const rank = (s) => (s.review ? 0 : s.seen && s.tier < 3 ? 1 : !s.seen ? 2 : 3);
    return states
      .sort((a, b) => rank(a.s) - rank(b.s) || (rank(a.s) === 1 ? a.s.tier - b.s.tier : 0)
        || (BY_ID[a.id].level === "advanced") - (BY_ID[b.id].level === "advanced"))
      .slice(0, RULES.deckSize)
      .map((x) => x.id);
  }

  // Records a flashcard review. "Mastered" pays once per word per day and
  // clears the review flag; "Needs Review" sets it. Tiers don't change.
  function reviewCard(p, id, gotIt, today, now = Date.now()) {
    const s = wordState(p, id);
    s.cards += 1;
    s.lastAt = now;
    let sparks = 0;
    if (gotIt) {
      s.review = false;
      if (s.cardDay !== today) {
        s.cardDay = today;
        sparks = RULES.flashcardSparks;
      }
    } else {
      s.review = true;
    }
    p.words[id] = s;
    return { sparks };
  }

  // Flags a word for review after a miss outside the sprint (e.g. the Derby).
  function flag(p, id, now = Date.now()) {
    if (!BY_ID[id]) return;
    const s = wordState(p, id);
    s.review = true;
    s.lastAt = now;
    p.words[id] = s;
  }

  // Records an answer. Returns what changed and the Sparks earned.
  function grade(p, id, correct, today, now = Date.now()) {
    const s = wordState(p, id);
    const tierBefore = s.tier;
    let sparks = 0;
    let masteredNow = false;
    s.seen += 1;
    s.lastAt = now;
    s.lastDay = today;
    if (correct) {
      s.correct += 1;
      s.review = false;
      sparks += RULES.sparksPerCorrect;
      if (s.tier < 3 && s.advancedDay !== today) {
        s.tier += 1;
        s.advancedDay = today;
        if (s.tier === 3 && !s.mastered) {
          s.mastered = true; // the +25 bonus is paid once per word
          masteredNow = true;
          sparks += RULES.masterySparks;
        }
      }
    } else {
      s.wrong += 1;
      s.tier = 1;
      s.review = true;
    }
    p.words[id] = s;
    return { tierBefore, tierAfter: s.tier, masteredNow, sparks, spacedOut: correct && tierBefore < 3 && s.tier === tierBefore };
  }

  // Call when a sprint ends. First sprint of the day earns the bonus.
  function finishSprint(p, today) {
    p.sprints = (p.sprints || 0) + 1;
    if (p.sprintDay === today) return 0;
    p.sprintDay = today;
    return RULES.sprintSparks;
  }

  function summary(p) {
    const out = { 1: 0, 2: 0, 3: 0, seen: 0, total: WORDS.length };
    for (const w of WORDS) {
      const s = p.words[w.id];
      if (!s || !(s.seen || s.cards)) continue;
      out.seen++;
      out[s.tier || 1]++;
    }
    return out;
  }

  // Cloud merge: per word, the most recently answered side wins.
  function mergeProgress(local, cloud) {
    const a = local && local.words ? local : emptyProgress();
    const b = cloud && cloud.words ? cloud : emptyProgress();
    const words = {};
    for (const id of new Set([...Object.keys(a.words), ...Object.keys(b.words)])) {
      if (!BY_ID[id]) continue;
      const x = a.words[id];
      const y = b.words[id];
      const pick = !x ? y : !y ? x : (y.lastAt || 0) > (x.lastAt || 0) ? y : x;
      words[id] = {
        ...pick,
        tier: Math.min(3, Math.max(1, Number(pick.tier) || 1)),
        mastered: Boolean((x && x.mastered) || (y && y.mastered)),
        // A flashcard Sparks payout on either device counts for that day.
        cardDay: [x && x.cardDay, y && y.cardDay].filter(Boolean).sort().pop() || null,
      };
    }
    return {
      words,
      sprintDay: [a.sprintDay, b.sprintDay].filter(Boolean).sort().pop() || null,
      sprints: Math.max(a.sprints || 0, b.sprints || 0),
      derby: SW.derby.mergeStats(a.derby, b.derby),
      fishing: SW.fishing.mergeStats(a.fishing, b.fishing),
    };
  }

    // The word in its passage with your cast, highlighted where it belongs.
    function contextSentence(w) {
      return ctx.fill(w.text)
        .replace("______", `<b class="fc-hl">${esc(w.word)}</b>`)
        .replace(/\[\[([^\]]+)\]\]/, '<b class="fc-hl">$1</b>');
    }

    function renderDeck() {
      if (deck.i >= deck.ids.length) return finishDeck();
      const w = BY_ID[deck.ids[deck.i]];
      const st = wordState(P(), w.id);
      const pays = st.cardDay !== ctx.todayKey();
      const list = (xs) => xs.map(esc).join(" · ");
      container.innerHTML = `
        <div class="stack vault deck">
          <div class="sprint-top">
            <button class="linkbtn" type="button" id="deck-quit">✕ End review</button>
            <span class="muted small" aria-live="polite">Card ${deck.i + 1} of ${deck.ids.length}</span>
          </div>
          ${speech.supported() ? `<div class="fc-say">${speech.button(w.word, esc)}<span class="muted small">Hear “${esc(w.word)}”<span class="kbd-hint"> · P</span></span></div>` : ""}
          <div class="fc-stage">
            <div class="fc-drag">
              <span class="fc-stamp got" aria-hidden="true">Mastered ✓</span>
              <span class="fc-stamp later" aria-hidden="true">↺ Review</span>
              <button type="button" class="fc${deck.flipped ? " flipped" : ""}" id="fc"
                aria-label="${esc(w.word)}. ${deck.flipped ? "Showing the definition. Tap to show the word." : "Tap to flip for the definition."}">
                <span class="fc-inner">
                  <span class="fc-face fc-front"${deck.flipped ? ' aria-hidden="true"' : ""}>
                    <span class="fc-top">${tierBadge(st.tier)}${cardChip(st)}</span>
                    <span class="fc-word">${esc(w.word)}</span>
                    <span class="fc-pos">${esc(w.pos)}</span>
                    <span class="fc-context">${contextSentence(w)}</span>
                    <span class="fc-hint" aria-hidden="true">Tap to flip ↻</span>
                  </span>
                  <span class="fc-face fc-back"${deck.flipped ? "" : ' aria-hidden="true"'}>
                    <span class="fc-top"><span class="fc-word sm">${esc(w.word)}</span><span class="fc-pos">${esc(w.pos)}</span></span>
                    <span class="fc-def">${esc(w.definition)}</span>
                    <span class="fc-row"><span class="label-sm">Synonyms</span><span>${list(w.synonyms)}</span></span>
                    <span class="fc-row"><span class="label-sm">Antonyms</span><span>${list(w.antonyms)}</span></span>
                    <span class="fc-row"><span class="label-sm">🌱 Root</span><span>${esc(w.root)}</span></span>
                  </span>
                </span>
              </button>
            </div>
          </div>
          <div class="fc-actions">
            <button class="btn ghost fc-toggle" type="button" id="fc-later" aria-pressed="${cardStatus(st) === "review"}">↺ Needs Review</button>
            <button class="btn fc-toggle" type="button" id="fc-got" aria-pressed="${cardStatus(st) === "mastered"}">✓ Mastered${pays ? ` <small>+${RULES.flashcardSparks} ⚡</small>` : ""}</button>
          </div>
          <p class="muted small fc-help">Swipe → Mastered · ← Needs Review<span class="kbd-hint"> · Space flips</span></p>
        </div>`;
      container.querySelector("#deck-quit").addEventListener("click", () => { deck = null; render(); });
      container.querySelector("#fc-got").addEventListener("click", () => decide(true));
      container.querySelector("#fc-later").addEventListener("click", () => decide(false));
      wireSwipe();
    }

    function flip() {
      if (!deck || deck.busy) return;
      deck.flipped = !deck.flipped;
      const fc = container.querySelector("#fc");
      if (!fc) return;
      const w = BY_ID[deck.ids[deck.i]];
      fc.classList.toggle("flipped", deck.flipped);
      fc.querySelector(".fc-front").toggleAttribute("aria-hidden", deck.flipped);
      fc.querySelector(".fc-back").toggleAttribute("aria-hidden", !deck.flipped);
      fc.setAttribute("aria-label", `${w.word}. ${deck.flipped ? "Showing the definition. Tap to show the word." : "Tap to flip for the definition."}`);
      ctx.sfx.play("tap");
    }

    // Drag the card sideways; past the threshold it flies off and counts as a
    // choice. A short tap flips it instead. Vertical scrolling is left alone.
    function wireSwipe() {
      const drag = container.querySelector(".fc-drag");
      const fc = container.querySelector("#fc");
      const THRESHOLD = 90;
      let startX = 0;
      let startY = 0;
      let dx = 0;
      let active = false;
      let moved = false;
      const paint = () => {
        drag.style.transform = dx ? `translateX(${dx}px) rotate(${dx / 18}deg)` : "";
        drag.style.setProperty("--got", String(Math.max(0, Math.min(1, dx / THRESHOLD))));
        drag.style.setProperty("--later", String(Math.max(0, Math.min(1, -dx / THRESHOLD))));
      };
      fc.addEventListener("click", () => {
        if (moved) { moved = false; return; }
        flip();
      });
      drag.addEventListener("pointerdown", (e) => {
        if (deck.busy || (e.pointerType === "mouse" && e.button !== 0)) return;
        active = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;
        dx = 0;
        drag.classList.add("dragging");
      });
      drag.addEventListener("pointermove", (e) => {
        if (!active) return;
        const mx = e.clientX - startX;
        const my = e.clientY - startY;
        if (!moved && Math.abs(mx) < 8) return;
        if (!moved && Math.abs(my) > Math.abs(mx)) { active = false; drag.classList.remove("dragging"); return; } // a scroll
        if (!moved) drag.setPointerCapture?.(e.pointerId);
        moved = true;
        dx = mx;
        paint();
      });
      const end = () => {
        if (!active) return;
        active = false;
        drag.classList.remove("dragging");
        if (Math.abs(dx) >= THRESHOLD) decide(dx > 0);
        else { dx = 0; paint(); }
      };
      drag.addEventListener("pointerup", end);
      drag.addEventListener("pointercancel", end);
    }

    function decide(gotIt) {
      if (!deck || deck.busy) return;
      deck.busy = true;
      const id = deck.ids[deck.i];
      const res = reviewCard(P(), id, gotIt, ctx.todayKey());
      if (gotIt) deck.got += 1;
      else {
        deck.later += 1;
        // Comes back once at the end of this deck.
        if (!deck.requeued.has(id)) { deck.requeued.add(id); deck.ids.push(id); }
      }
      if (res.sparks) { ctx.earn(res.sparks); deck.earned += res.sparks; }
      ctx.sfx.play(gotIt ? "correct" : "tap");
      if (gotIt) ctx.sfx.buzz(50);
      ctx.save();
      ctx.renderHud(res.sparks ? ["sparks"] : []);
      const advance = () => {
        if (!deck) return;
        deck.i += 1;
        deck.flipped = false;
        deck.busy = false;
        renderDeck();
        container.querySelector("#fc")?.focus({ preventScroll: true });
      };
      const drag = container.querySelector(".fc-drag");
      if (drag && !reducedMotion()) {
        drag.style.transform = "";
        drag.classList.add(gotIt ? "fly-right" : "fly-left");
        setTimeout(advance, 240);
      } else advance();
    }

    function finishDeck() {
      const flagged = WORDS.filter((w) => wordState(P(), w.id).review).length;
      if (deck.earned) ctx.sfx.play("complete");
      container.innerHTML = `
        <div class="stack vault">
          <section class="panel sprint-summary">
            <span class="complete-star" aria-hidden="true">🃏</span>
            <h2>Deck done!</h2>
            <p class="muted">${deck.got} mastered · ${deck.later} need review · +${deck.earned} ⚡ Sparks</p>
            ${flagged ? `<p class="muted small">${flagged} word${flagged === 1 ? " is" : "s are"} flagged 🔁. Your next sprint serves them first.</p>` : ""}
            <div class="stack">
              <button class="btn wide" type="button" id="deck-sprint">Test yourself: Daily Sprint</button>
              <button class="btn ghost wide" type="button" id="deck-again">New deck</button>
              <button class="btn ghost wide" type="button" id="deck-home">Back to the Vocab Vault</button>
            </div>
          </section>
        </div>`;
      deck = null;
      container.querySelector("#deck-sprint").addEventListener("click", startSprint);
      container.querySelector("#deck-again").addEventListener("click", startDeck);
      container.querySelector("#deck-home").addEventListener("click", render);
      container.scrollTop = 0;
    }

    // Arrow keys and Space drive the deck while the Vocab tab is showing.
    document.addEventListener("keydown", (e) => {
      if (!deck || drawer || container.hidden || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.target.closest("input, select, textarea") || document.querySelector('[aria-modal="true"]')) return;
      if (e.key === "ArrowRight") { e.preventDefault(); decide(true); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); decide(false); }
      else if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); flip(); }
      else if (e.key.toLowerCase() === "p") { e.preventDefault(); speech.speak(BY_ID[deck.ids[deck.i]]?.word); }
    });

    function startSprint() {
      ctx.sfx.play("tap");
      deck = null;
      sprint = { ids: drawSprint(P(), ctx.todayKey()), i: 0, results: [], earned: 0, picked: null, order: null };
      render();
      container.scrollTop = 0;
    }

    function renderCard() {
      const id = sprint.ids[sprint.i];
      const w = BY_ID[id];
      const st = wordState(P(), id);
      if (!sprint.order) sprint.order = shuffle([0, 1, 2, 3], Math.random);
      const answered = sprint.picked !== null;
      const passage = ctx.fill(w.text)
        .replace("______", answered ? `<mark class="fill-in">${esc(w.choices[w.answer])}</mark>` : '<span class="blank" role="img" aria-label="blank"></span>')
        .replace(/\[\[([^\]]+)\]\]/, '<u class="target">$1</u>');
      container.innerHTML = `
        <div class="stack vault">
          <div class="sprint-top">
            <button class="linkbtn" type="button" id="sprint-quit">✕ End sprint</button>
            <div class="sprint-dots" aria-label="Word ${sprint.i + 1} of ${sprint.ids.length}">
              ${sprint.ids.map((_, k) => `<i class="${k < sprint.i ? (sprint.results[k].correct ? "ok" : "no") : k === sprint.i ? "now" : ""}"></i>`).join("")}
            </div>
          </div>
          <section class="card-inner bb vocab-card">
            <div class="bb-top">
              <span class="bb-num">${sprint.i + 1}</span>
              <span class="bb-meta">Words in Context</span>
              ${tierBadge(st.tier)}
            </div>
            <div class="bb-passage"><p class="passage">${passage}</p></div>
            <p class="bb-stem">${esc(stemFor(w))}</p>
            <ol class="choices">
              ${sprint.order.map((ci, pos) => {
                let cls = "";
                if (answered) cls = ci === w.answer ? "right" : ci === sprint.picked ? "wrong" : "dim";
                return `<li><button class="choice ${cls}" type="button" data-ci="${ci}" ${answered ? "disabled" : ""}
                  aria-label="(${"ABCD"[pos]}) ${esc(w.choices[ci])}">
                  <span class="letter" aria-hidden="true">${"ABCD"[pos]}</span><span class="txt">${esc(w.choices[ci])}</span>
                </button></li>`;
              }).join("")}
            </ol>
            <div class="fb-slot">${answered ? inlineFeedback(w) : ""}</div>
          </section>
        </div>`;
      container.querySelector("#sprint-quit").addEventListener("click", () => { closeDrawer(); sprint = null; render(); });
      container.querySelectorAll(".choice:not(:disabled)").forEach((b) => {
        b.addEventListener("pointerdown", () => ctx.sfx.play("tap"));
        b.addEventListener("click", () => answer(Number(b.dataset.ci)));
      });
      container.querySelector("#vocab-next")?.addEventListener("click", next);
      container.querySelector("#vocab-why")?.addEventListener("click", () => openDrawer(w, sprint.results[sprint.i]));
    }

    function inlineFeedback(w) {
      const r = sprint.results[sprint.i];
      const move = r.tierBefore !== r.tierAfter ? ` · ${TIERS[r.tierBefore].icon}→${TIERS[r.tierAfter].icon}` : "";
      return `
        <div class="feedback ${r.correct ? "ok" : "no"}">
          <h3>${r.correct ? "Correct!" : "Not quite"}<small>${r.correct ? `+${r.sparks} ⚡${move}` : `Back to ${TIERS[1].icon} Novice`}</small></h3>
          ${r.correct && r.spacedOut ? `<p class="muted small">Already moved up today. Come back tomorrow to advance “${esc(w.word)}.”</p>` : ""}
          <button class="linkbtn why-btn" type="button" id="vocab-why">🔎 Word breakdown</button>
        </div>
        <button class="btn wide next-row" type="button" id="vocab-next">${sprint.i + 1 < sprint.ids.length ? "Next word →" : "Finish sprint"}</button>`;
    }

    function answer(ci) {
      if (sprint.picked !== null) return;
      const id = sprint.ids[sprint.i];
      const w = BY_ID[id];
      const correct = ci === w.answer;
      const res = grade(P(), id, correct, ctx.todayKey());
      sprint.picked = ci;
      sprint.results[sprint.i] = { id, correct, ...res };
      sprint.earned += res.sparks;
      if (res.sparks) ctx.earn(res.sparks);
      ctx.sfx.play(correct ? "correct" : "wrong");
      if (correct) ctx.sfx.buzz(50);
      ctx.recordAnswer(correct);
      ctx.save();
      ctx.renderHud(res.sparks ? ["sparks"] : []);
      renderCard();
      if (res.masteredNow) {
        ctx.sfx.play("combo");
        ctx.celebrate("👑", `“${w.word}” mastered!`, `+${RULES.masterySparks} ⚡ Sparks`);
      }
      if (!correct) openDrawer(w, sprint.results[sprint.i]);
      else container.querySelector("#vocab-next")?.focus({ preventScroll: true });
    }

    function next() {
      closeDrawer();
      if (sprint.i + 1 < sprint.ids.length) {
        sprint.i += 1;
        sprint.picked = null;
        sprint.order = null;
        renderCard();
        container.scrollTop = 0;
        return;
      }
      finish();
    }

    function finish() {
      const bonus = finishSprint(P(), ctx.todayKey());
      if (bonus) ctx.earn(bonus);
      sprint.earned += bonus;
      ctx.save();
      ctx.renderHud(bonus ? ["sparks"] : []);
      const right = sprint.results.filter((r) => r.correct).length;
      if (bonus) {
        ctx.sfx.play("complete");
        ctx.celebrate("📚", "Sprint complete!", `+${bonus} ⚡ daily sprint bonus`);
      }
      const rows = sprint.results.map((r) => {
        const w = BY_ID[r.id];
        return `<li class="sum-row ${r.correct ? "ok" : "no"}">
          <span aria-hidden="true">${r.correct ? "✓" : "✗"}</span>
          <b>${esc(w.word)}</b>
          <span class="muted small">${TIERS[r.tierBefore].icon} → ${TIERS[r.tierAfter].icon} ${TIERS[r.tierAfter].name}</span>
        </li>`;
      }).join("");
      container.innerHTML = `
        <div class="stack vault">
          <section class="panel sprint-summary">
            <span class="complete-star" aria-hidden="true">${right === sprint.ids.length ? "🏆" : "📚"}</span>
            <h2>${right} of ${sprint.ids.length} correct</h2>
            <p class="muted">+${sprint.earned} ⚡ Sparks this sprint${bonus ? ` (including the +${bonus} daily bonus)` : ""}</p>
            <ul class="sum-list">${rows}</ul>
            <div class="stack">
              <button class="btn wide" type="button" id="sprint-again">Another sprint</button>
              <button class="btn ghost wide" type="button" id="sprint-home">Back to the Vocab Vault</button>
            </div>
          </section>
        </div>`;
      sprint = null;
      container.querySelector("#sprint-again").addEventListener("click", startSprint);
      container.querySelector("#sprint-home").addEventListener("click", render);
      container.scrollTop = 0;
    }

    // Slide-up breakdown: root, definition, context clue, every choice explained.
    function openDrawer(w, result) {
      closeDrawer();
      const correct = result && result.correct;
      drawer = document.createElement("div");
      drawer.className = "sheet-backdrop explain-backdrop";
      drawer.innerHTML = `
        <div class="sheet explain vocab-explain ${correct ? "ok" : "no"}" role="dialog" aria-modal="true" aria-labelledby="vx-title">
          <div class="grabber" aria-hidden="true"></div>
          <div class="explain-head">
            <span class="verdict-icon" aria-hidden="true">${correct ? "✓" : "✗"}</span>
            <div><h2 id="vx-title">${esc(w.word)}</h2><small>${esc(w.pos)}${correct ? "" : ` · back to ${TIERS[1].icon} Novice`}</small></div>
            <button class="linkbtn" type="button" data-close>Close</button>
          </div>
          <p class="vx-def">${esc(w.definition)}</p>
          <div class="vx-grid">
            <div class="vx-box"><span class="label-sm">🌱 Root</span><p>${esc(w.root)}</p></div>
            <div class="vx-box"><span class="label-sm">🔎 Context clue</span><p>${ctx.fill(w.clue, undefined, false)}</p></div>
          </div>
          <ol class="why-list">
            ${sprint && sprint.order ? sprint.order.map((ci, pos) => ({ ci, pos, rank: ci === w.answer ? 0 : ci === sprint.picked ? 1 : 2 }))
              .sort((a, b) => a.rank - b.rank || a.pos - b.pos)
              .map(({ ci, pos }) => `
                <li class="why-row ${ci === w.answer ? "right" : ci === sprint.picked ? "wrong" : "other"}">
                  <span class="letter" aria-hidden="true">${"ABCD"[pos]}</span>
                  <div class="why-body"><b>${esc(w.choices[ci])}</b>
                    ${ci === w.answer ? '<span class="why-tag">Correct answer</span>' : ci === sprint.picked ? '<span class="why-tag">Your answer</span>' : ""}
                    <p>${ctx.fill(w.notes[ci], undefined, false)}</p></div>
                </li>`).join("") : ""}
          </ol>
          <button class="btn wide" type="button" data-next>${sprint && sprint.i + 1 < sprint.ids.length ? "Next word →" : "Finish sprint"}</button>
        </div>`;
      document.body.append(drawer);
      drawer.addEventListener("mousedown", (e) => { if (e.target === drawer) closeDrawer(); });
      drawer.querySelector("[data-close]").addEventListener("click", closeDrawer);
      drawer.querySelector("[data-next]").addEventListener("click", next);
      document.addEventListener("keydown", drawerKeys, true);
      drawer.querySelector("[data-next]").focus({ preventScroll: true });
    }

    function closeDrawer() {
      if (!drawer) return;
      document.removeEventListener("keydown", drawerKeys, true);
      drawer.remove();
      drawer = null;
    }

    function drawerKeys(e) {
      if (!drawer) return;
      if (e.key === "Escape") { e.preventDefault(); closeDrawer(); }
      else if (e.key === "Tab") {
        const items = [...drawer.querySelectorAll("button")];
        const first = items[0];
        const last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      e.stopPropagation();
    }

    // busy: a sprint or deck is in progress, so background re-renders should wait.
    return {
      render,
      isOpen: () => Boolean(drawer),
      busy: () => Boolean(sprint || deck || fishing.playing()),
      openFishing: () => { sprint = null; deck = null; fishing.open(); },
    };
  }

  SW.vocab = { WORDS, TIERS, RULES, emptyProgress, drawSprint, drawDeck, grade, reviewCard, flag, finishSprint, summary, mergeProgress, mount };
})();

</script>
<script>
/* ===== js/rewards.js ===== */
// SatWizz rewards: Sparks economy, Shop, Focus Elixir, Aura Shields,
// the Double-Spark Wager and achievement titles.
// Pure state logic with no DOM. Each function takes the app state, changes it,
// and returns what happened so the UI can react.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});

  const RULES = Object.freeze({
    sparksPerCorrect: 10,
    comboBonus: 5, // paid on every 3rd answer in a row (3, 6, 9...)
    comboEvery: 3,
    dailyGoalSparks: 50,
    chapterSparks: 50, // first completion of each chapter
    startSparks: 2500, // new players' bankroll (Derby wagers, Shop)
    maxAura: 5,
    auraPrice: 50,
    auraBundleSize: 3,
    auraBundlePrice: 120,
    elixirPrice: 500, // Focus Elixir: Focus back to 100% (js/focus.js)
    comboSaverPrice: 40,
    maxComboSavers: 3,
    comboSaverMin: 3, // only protects combos of 3 or more
    auraEarnEvery: 7, // streak days per free Aura Shield
    wagerStake: 50,
    wagerPayout: 100,
    wagerDays: 5,
    fastRunLength: 5,
    fastRunMs: 60 * 1000,
  });

  const fail = (reason, extra = {}) => ({ ok: false, reason, ...extra });

  // ---------- Sparks ----------
  // `combo` is the combo count after this correct answer.
  function sparksForCorrect(combo) {
    const bonus = combo > 0 && combo % RULES.comboEvery === 0 ? RULES.comboBonus : 0;
    return { base: RULES.sparksPerCorrect, bonus, total: RULES.sparksPerCorrect + bonus };
  }

  function earn(state, amount) {
    state.sparks = (state.sparks || 0) + amount;
    return amount;
  }

  // ---------- Themes ----------
  const themeById = (id) => SW.themes.find((t) => t.id === id);

  function isThemeUnlocked(state, id) {
    if (id === "custom") return true;
    const t = themeById(id);
    if (!t) return false;
    return !t.price || state.unlockedThemes.includes(id);
  }

  function buyTheme(state, id) {
    const t = themeById(id);
    if (!t || !t.price) return fail("not-for-sale");
    if (isThemeUnlocked(state, id)) return fail("owned");
    if (state.sparks < t.price) return fail("short", { need: t.price - state.sparks });
    state.sparks -= t.price;
    state.unlockedThemes.push(id);
    return { ok: true, spent: t.price, theme: t };
  }

  // ---------- Aura Shields (protect a missed day) ----------
  function buyAura(state) {
    if (state.freezes >= RULES.maxAura) return fail("full");
    if (state.sparks < RULES.auraPrice) return fail("short", { need: RULES.auraPrice - state.sparks });
    state.sparks -= RULES.auraPrice;
    state.freezes += 1;
    return { ok: true, spent: RULES.auraPrice };
  }

  function buyAuraBundle(state) {
    const room = RULES.maxAura - state.freezes;
    if (room < RULES.auraBundleSize) return fail("room", { room });
    if (state.sparks < RULES.auraBundlePrice) return fail("short", { need: RULES.auraBundlePrice - state.sparks });
    state.sparks -= RULES.auraBundlePrice;
    state.freezes += RULES.auraBundleSize;
    return { ok: true, spent: RULES.auraBundlePrice };
  }

  // Free shield for every 7 streak days, if there's room.
  function earnAuraForStreak(state) {
    if (state.streak % RULES.auraEarnEvery !== 0 || state.freezes >= RULES.maxAura) return false;
    state.freezes += 1;
    return true;
  }

  // ---------- Double-Spark Wager ----------
  // Stake 50 now; if the streak grows by 5 more days, collect 100.
  // Today counts as day 1 if today's goal isn't done yet.
  function placeWager(state, todayKey) {
    if (state.wager) return fail("active");
    if (state.sparks < RULES.wagerStake) return fail("short", { need: RULES.wagerStake - state.sparks });
    state.sparks -= RULES.wagerStake;
    state.wager = {
      stake: RULES.wagerStake,
      startStreak: state.streak,
      target: state.streak + RULES.wagerDays,
      placedOn: todayKey,
    };
    return { ok: true, spent: RULES.wagerStake };
  }

  function wagerProgress(state) {
    const w = state.wager;
    if (!w) return null;
    const days = Math.max(0, Math.min(RULES.wagerDays, state.streak - w.startStreak));
    return { days, of: RULES.wagerDays };
  }

  // Call after the daily goal is met.
  function settleWager(state) {
    const w = state.wager;
    if (!w) return null;
    if (state.streak < w.startStreak) return loseWager(state);
    if (state.streak >= w.target) {
      state.wager = null;
      earn(state, RULES.wagerPayout);
      return { won: true, payout: RULES.wagerPayout };
    }
    return { won: false, ...wagerProgress(state) };
  }

  // Call when the streak breaks.
  function loseWager(state) {
    if (!state.wager) return null;
    const stake = state.wager.stake;
    state.wager = null;
    return { lost: true, stake };
  }

  // ---------- Focus Elixir ----------
  // Refills the Focus Meter (js/focus.js) to 100%.
  function buyElixir(state) {
    if (state.focus >= SW.focus.RULES.max) return fail("full");
    if (state.sparks < RULES.elixirPrice) return fail("short", { need: RULES.elixirPrice - state.sparks });
    state.sparks -= RULES.elixirPrice;
    SW.focus.refill(state);
    return { ok: true, spent: RULES.elixirPrice };
  }

  // ---------- Combo Savers ----------
  function buyComboSaver(state) {
    if (state.comboSavers >= RULES.maxComboSavers) return fail("full");
    if (state.sparks < RULES.comboSaverPrice) return fail("short", { need: RULES.comboSaverPrice - state.sparks });
    state.sparks -= RULES.comboSaverPrice;
    state.comboSavers += 1;
    return { ok: true, spent: RULES.comboSaverPrice };
  }

  // Call on a wrong answer before resetting the combo. True if a saver was spent.
  function useComboSaver(state) {
    if (state.combo < RULES.comboSaverMin || state.comboSavers <= 0) return false;
    state.comboSavers -= 1;
    return true;
  }

  // ---------- Avatars ----------
  const avatarById = (id) => SW.avatars.find((a) => a.id === id);

  function isAvatarUnlocked(state, id) {
    const a = avatarById(id);
    if (!a) return false;
    return !a.price || state.unlockedAvatars.includes(id);
  }

  function buyAvatar(state, id) {
    const a = avatarById(id);
    if (!a || !a.price) return fail("not-for-sale");
    if (isAvatarUnlocked(state, id)) return fail("owned");
    if (state.sparks < a.price) return fail("short", { need: a.price - state.sparks });
    state.sparks -= a.price;
    state.unlockedAvatars.push(id);
    return { ok: true, spent: a.price, avatar: a };
  }

  // ---------- Achievements ----------
  // Keeps timestamps of the current run of correct answers.
  // Returns true when the last 5 in a row took under 60 seconds.
  function trackFastRun(times, correct, now) {
    if (!correct) {
      times.length = 0;
      return false;
    }
    times.push(now);
    while (times.length > RULES.fastRunLength) times.shift();
    return times.length === RULES.fastRunLength && now - times[0] < RULES.fastRunMs;
  }

  const BADGES = [
    {
      id: "spark-starter",
      title: "Spark Starter",
      icon: "✨",
      desc: "Reach a 3-day streak.",
      progress: (s) => ({ value: Math.min(s.bestStreak, 3), of: 3, label: `${Math.min(s.bestStreak, 3)} / 3 days` }),
      check: (s) => s.bestStreak >= 3,
    },
    {
      id: "syntax-warlock",
      title: "Syntax Warlock",
      icon: "🧙",
      desc: "Answer 50 questions correctly.",
      progress: (s) => ({ value: Math.min(s.totalCorrect, 50), of: 50, label: `${Math.min(s.totalCorrect, 50)} / 50 correct` }),
      check: (s) => s.totalCorrect >= 50,
    },
    {
      id: "lightning-fast",
      title: "Lightning Fast",
      icon: "🌩️",
      desc: "Get 5 right in a row in under 60 seconds.",
      progress: (s) => ({ value: s.badges.includes("lightning-fast") ? 1 : 0, of: 1, label: "5 in a row, under a minute" }),
      check: (s, ctx) => Boolean(ctx.fastRun),
    },
  ];

  const badgeById = (id) => BADGES.find((b) => b.id === id);

  // Returns badges unlocked by this check.
  function checkBadges(state, ctx = {}) {
    const fresh = [];
    for (const b of BADGES) {
      if (!state.badges.includes(b.id) && b.check(state, ctx)) {
        state.badges.push(b.id);
        fresh.push(b);
      }
    }
    return fresh;
  }

  SW.rewards = {
    RULES,
    sparksForCorrect,
    earn,
    isThemeUnlocked,
    buyTheme,
    buyAura,
    buyAuraBundle,
    earnAuraForStreak,
    buyElixir,
    buyComboSaver,
    useComboSaver,
    avatarById,
    isAvatarUnlocked,
    buyAvatar,
    placeWager,
    wagerProgress,
    settleWager,
    loseWager,
    trackFastRun,
    BADGES,
    badgeById,
    checkBadges,
  };
})();

</script>
<script>
/* ===== js/sfx.js ===== */
// SatWizz sound effects and haptics.
// Sounds are synthesized with the Web Audio API (no audio files). Browsers only
// allow audio after a user gesture, so the AudioContext is created lazily on
// the first play() call, which always happens inside a tap.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  let ctx = null;
  let muted = false;
  let haptics = true;

  function audio() {
    if (muted) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }

  // One enveloped oscillator note.
  function tone(ac, { freq, start = 0, dur = 0.15, type = "sine", gain = 0.2, slideTo }) {
    const t0 = ac.currentTime + start;
    const osc = ac.createOscillator();
    const amp = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(amp).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  // Short filtered noise burst for the "tap".
  function click(ac) {
    const len = Math.floor(ac.sampleRate * 0.03);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    const src = ac.createBufferSource();
    const filter = ac.createBiquadFilter();
    const amp = ac.createGain();
    src.buffer = buf;
    filter.type = "highpass";
    filter.frequency.value = 1800;
    amp.gain.value = 0.35;
    src.connect(filter).connect(amp).connect(ac.destination);
    src.start();
  }

  const SOUNDS = {
    tap: (ac) => click(ac),
    correct: (ac) => {
      tone(ac, { freq: 880, dur: 0.14, type: "triangle", gain: 0.18 });
      tone(ac, { freq: 1318.5, start: 0.08, dur: 0.28, type: "sine", gain: 0.16 });
    },
    wrong: (ac) => {
      tone(ac, { freq: 150, dur: 0.24, type: "triangle", gain: 0.3, slideTo: 70 });
      tone(ac, { freq: 90, dur: 0.18, type: "sine", gain: 0.22 });
    },
    combo: (ac) => {
      [659.3, 830.6, 987.8, 1318.5].forEach((f, i) => tone(ac, { freq: f, start: i * 0.06, dur: 0.18, type: "triangle", gain: 0.13 }));
    },
    // Starting bell for the Vocab Derby.
    bell: (ac) => {
      tone(ac, { freq: 1568, dur: 0.5, type: "sine", gain: 0.14 });
      tone(ac, { freq: 2093, start: 0.02, dur: 0.6, type: "sine", gain: 0.09 });
    },
    // Four quick hoofbeats.
    gallop: (ac) => {
      [0, 0.09, 0.2, 0.29].forEach((start, i) => tone(ac, { freq: i % 2 ? 110 : 140, start, dur: 0.07, type: "triangle", gain: 0.22 }));
    },
    complete: (ac) => {
      [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(ac, { freq: f, start: i * 0.1, dur: 0.35, type: "triangle", gain: 0.14 }));
    },
  };

  function play(name) {
    const ac = audio();
    const fn = SOUNDS[name];
    if (!ac || !fn) return;
    try { fn(ac); } catch (e) { /* audio is best-effort */ }
  }

  function buzz(ms = 50) {
    if (!haptics || typeof navigator.vibrate !== "function") return;
    try { navigator.vibrate(ms); } catch (e) { /* not allowed here */ }
  }

  SW.sfx = {
    play,
    buzz,
    setMuted: (v) => { muted = Boolean(v); },
    setHaptics: (v) => { haptics = Boolean(v); },
    canVibrate: () => typeof navigator.vibrate === "function",
  };
})();

</script>
<script>
/* ===== js/auth.js ===== */
// SatWizz accounts and cloud sync (Supabase).
// Exposes window.SatWizz.auth. Works without Supabase too: if the SDK or the
// config is missing, available() is false and the app stays in guest mode.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  const cfg = SW.config || {};
  const GOALS = [5, 10, 20];
  const PUSH_DELAY_MS = 1200;

  let client = null;
  let session = null;
  let unavailableReason = "";
  const authListeners = new Set();
  const statusListeners = new Set();
  let status = "idle"; // idle | pending | syncing | synced | error

  // ---------- Setup ----------
  function init() {
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      unavailableReason = "not-configured";
      return false;
    }
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      unavailableReason = "sdk-missing";
      return false;
    }
    client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    client.auth.onAuthStateChange((event, s) => {
      session = s;
      // Supabase warns against awaiting its own calls inside this callback,
      // so listeners run on the next tick.
      setTimeout(() => authListeners.forEach((fn) => fn(event, s)), 0);
    });
    return true;
  }

  const available = () => client !== null;
  const reason = () => unavailableReason;
  const user = () => (session && session.user) || null;

  function onChange(fn) {
    authListeners.add(fn);
    return () => authListeners.delete(fn);
  }

  function requireClient() {
    if (!client) {
      throw new Error(
        unavailableReason === "sdk-missing"
          ? "Couldn't reach the sign-in service. Check your connection and reload."
          : "Cloud accounts aren't set up on this copy of SatWizz yet."
      );
    }
  }

  const redirectUrl = () => location.origin + location.pathname;

  // ---------- Auth methods ----------
  async function signUp(email, password) {
    requireClient();
    const { data, error } = await client.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: redirectUrl() },
    });
    if (error) throw error;
    // With email confirmation on, Supabase returns a user but no session.
    return { needsConfirmation: !data.session };
  }

  async function signIn(email, password) {
    requireClient();
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) throw error;
  }

  async function signInWithGoogle() {
    requireClient();
    if (location.protocol === "file:") {
      throw new Error("Google sign-in needs SatWizz to be served over http(s), not opened as a file.");
    }
    const { error } = await client.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: redirectUrl() },
    });
    if (error) throw error; // on success the browser leaves for Google
  }

  async function signOut() {
    if (!client) return;
    clearTimeout(pushTimer);
    const { error } = await client.auth.signOut();
    if (error) throw error;
    setStatus("idle");
  }

  // ---------- Cloud sync ----------
  function setStatus(next) {
    status = next;
    statusListeners.forEach((fn) => fn(status));
  }
  const getStatus = () => status;
  function onStatus(fn) {
    statusListeners.add(fn);
    return () => statusListeners.delete(fn);
  }

  // App state -> table rows
  function toRows(state, u) {
    const now = new Date().toISOString();
    return {
      profile: {
        user_id: u.id,
        email: u.email,
        current_streak: state.streak,
        best_streak: state.bestStreak,
        total_xp: state.xp,
        streak_freezes: state.freezes,
        last_goal_date: state.lastDone,
        sparks: state.sparks,
        unlocked_chapters: state.unlockedChapters,
        completed_chapters: state.completedChapters,
        unlocked_themes: state.unlockedThemes,
        unlocked_badges: state.badges,
        spark_wager: state.wager,
        unlocked_avatars: state.unlockedAvatars,
        combo_savers: state.comboSavers,
        vocab_progress: state.vocab,
        updated_at: now,
      },
      settings: {
        user_id: u.id,
        selected_theme: state.themeId,
        daily_goal: state.goal,
        custom_names: state.custom,
        avatar: state.avatar,
        updated_at: now,
      },
    };
  }

  async function pull() {
    requireClient();
    const u = user();
    if (!u) return { profile: null, settings: null };
    const [p, s] = await Promise.all([
      client.from("profiles").select("*").eq("user_id", u.id).maybeSingle(),
      client.from("user_settings").select("*").eq("user_id", u.id).maybeSingle(),
    ]);
    if (p.error) throw p.error;
    if (s.error) throw s.error;
    return { profile: p.data, settings: s.data };
  }

  async function push(state) {
    requireClient();
    const u = user();
    if (!u) return;
    const rows = toRows(state, u);
    const [a, b, c] = await Promise.all([
      client.from("profiles").upsert(rows.profile, { onConflict: "user_id" }),
      client.from("user_settings").upsert(rows.settings, { onConflict: "user_id" }),
      client.from("user_public").upsert(publicRow(state, u), { onConflict: "user_id" }),
    ]);
    if (a.error) throw a.error;
    if (b.error) throw b.error;
    if (c.error) throw c.error;
  }

  // The leaderboard card. Username is only sent once it has been claimed, so a
  // sync never overwrites it with an empty value.
  function publicRow(state, u) {
    const row = {
      user_id: u.id,
      display_name: cleanDisplayName(state.displayName) || defaultDisplayName(u),
      avatar: state.avatar,
      total_xp: Math.max(0, Math.round(state.xp || 0)),
      sparks: Math.max(0, Math.round(state.sparks || 0)),
      current_streak: Math.max(0, Math.round(state.streak || 0)),
      updated_at: new Date().toISOString(),
    };
    if (state.username) row.username = state.username;
    return row;
  }

  const cleanDisplayName = (s) => String(s || "").replace(/\s+/g, " ").trim().slice(0, 30);
  const defaultDisplayName = (u) => {
    const local = String((u && u.email) || "").split("@")[0].replace(/[._-]+/g, " ").trim();
    return cleanDisplayName(local ? local.charAt(0).toUpperCase() + local.slice(1) : "SatWizz student");
  };

  // Debounced push; call after every local save.
  let pushTimer;
  function schedulePush(getState) {
    if (!client || !user()) return;
    clearTimeout(pushTimer);
    setStatus("pending");
    pushTimer = setTimeout(async () => {
      setStatus("syncing");
      try {
        await push(getState());
        setStatus("synced");
      } catch (e) {
        console.warn("SatWizz sync failed", e);
        setStatus("error");
      }
    }, PUSH_DELAY_MS);
  }

  const union = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])].filter((x) => typeof x === "string");
  const clampInt = (n, lo, hi) => Math.max(lo, Math.min(hi, Math.round(Number(n) || 0)));
  function cleanWager(w) {
    if (!w || typeof w !== "object") return null;
    const startStreak = clampInt(w.startStreak, 0, 1e6);
    return {
      stake: clampInt(w.stake, 0, 1e6),
      startStreak,
      target: clampInt(w.target, startStreak, 1e6),
      placedOn: typeof w.placedOn === "string" ? w.placedOn : null,
    };
  }

  // Combines this device's state with what the account already has.
  // - XP and best streak keep the higher value; the current streak comes from
  //   whichever side met its daily goal more recently.
  // - Unlocked and completed chapters, themes, badges and avatars are combined.
  // - The Focus Meter (0-100%) stays on this device and is never synced.
  // - Sparks, Combo Savers and the wager are spendable, so taking the max would undo
  //   purchases. If this device last synced with the same account, the newer
  //   side wins. Otherwise (guest progress, another account) keep the higher
  //   balance so nothing earned is lost.
  // - Saved settings win over this device's.
  // Returns only the fields to overwrite.
  function merge(local, cloud, userId) {
    const out = {};
    const p = cloud.profile;
    if (p) {
      out.xp = Math.max(local.xp || 0, p.total_xp || 0);
      const cloudDate = p.last_goal_date || null;
      const cloudStreakNewer =
        (cloudDate && (!local.lastDone || cloudDate > local.lastDone)) ||
        (cloudDate && cloudDate === local.lastDone && (p.current_streak || 0) > local.streak);
      if (cloudStreakNewer) {
        out.streak = p.current_streak || 0;
        out.lastDone = cloudDate;
        out.freezes = p.streak_freezes || 0;
      }
      out.bestStreak = Math.max(local.bestStreak || 0, p.best_streak || 0, out.streak || 0, local.streak || 0);

      const chapterIds = new Set((SW.chapters || []).map((c) => c.id));
      const chapters = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])]
        .filter((id) => chapterIds.has(id)).sort((x, y) => x - y);
      out.unlockedChapters = chapters([1, ...(local.unlockedChapters || [])], p.unlocked_chapters);
      out.completedChapters = chapters(local.completedChapters, p.completed_chapters);
      out.unlockedThemes = union(local.unlockedThemes, p.unlocked_themes);
      out.badges = union(local.badges, p.unlocked_badges);
      // Vocab Vault: per word, the most recently answered side wins.
      if (SW.vocab) out.vocab = SW.vocab.mergeProgress(local.vocab, p.vocab_progress);
      const avatarIds = new Set((SW.avatars || []).map((a) => a.id));
      out.unlockedAvatars = union(local.unlockedAvatars, p.unlocked_avatars).filter((id) => avatarIds.has(id));

      if (typeof p.sparks === "number") {
        const sameAccount = Boolean(userId) && local.syncedUserId === userId;
        const cloudNewer = (Date.parse(p.updated_at) || 0) > (local.updatedAt || 0);
        if (sameAccount) {
          if (cloudNewer) {
            out.sparks = clampInt(p.sparks, 0, 1e9);
            out.wager = cleanWager(p.spark_wager);
            out.comboSavers = clampInt(p.combo_savers, 0, 3);
          }
        } else {
          // A fresh device (nothing played yet, just the 2,500 ⚡ starting
          // bankroll) signing in to an account that has played takes the
          // account's balance, so a new browser can't top an account up.
          const pristine = !(local.xp > 0) && !(local.totalCorrect > 0) && !(local.vocab && local.vocab.derby && local.vocab.derby.races > 0);
          out.sparks = pristine && (p.total_xp || 0) > 0
            ? clampInt(p.sparks, 0, 1e9)
            : Math.max(local.sparks || 0, clampInt(p.sparks, 0, 1e9));
          out.comboSavers = Math.max(local.comboSavers || 0, clampInt(p.combo_savers, 0, 3));
          if (!local.wager) out.wager = cleanWager(p.spark_wager);
        }
      }
    }
    const s = cloud.settings;
    if (s) {
      if (s.selected_theme) out.themeId = s.selected_theme;
      if (GOALS.includes(s.daily_goal)) out.goal = s.daily_goal;
      if (s.avatar && (SW.avatars || []).some((a) => a.id === s.avatar)) out.avatar = s.avatar;
      const c = s.custom_names;
      if (c && Array.isArray(c.people) && c.people.length === 3) {
        out.custom = {
          people: c.people.map((x) => ({
            name: String((x && x.name) || "").slice(0, 24),
            pro: ["he", "she", "they"].includes(x && x.pro) ? x.pro : "they",
          })),
          place: String(c.place || "").slice(0, 40),
          craft: String(c.craft || "").slice(0, 40),
          event: String(c.event || "").slice(0, 40),
        };
      }
      out.castChosen = true;
    }
    return out;
  }

  // ======================================================================
  // Social: usernames, friends, friend streaks, leaderboards, Lock In.
  // All of these need a signed-in user; they throw friendly Errors.
  // ======================================================================
  const USERNAME_RE = /^[a-z0-9_]{3,20}$/;
  const PUBLIC_COLS = "user_id, username, display_name, avatar, total_xp, sparks, current_streak, last_practice_at";
  const FRIENDLY = {
    user_not_found: "No one has that username. Check the spelling.",
    cannot_friend_self: "That's your own username.",
    not_friends: "You can only Lock In friends.",
    already_locked_in: "You already sent a Lock In. Try again in a few hours.",
    request_not_found: "That request is no longer there.",
    not_signed_in: "Sign in first.",
  };

  function friendly(err) {
    const msg = (err && (err.message || err.error)) || String(err || "");
    const code = Object.keys(FRIENDLY).find((k) => msg.includes(k));
    if (code) return new Error(FRIENDLY[code]);
    if (err && err.code === "23505") return new Error("That username is taken.");
    if (/failed to fetch|network/i.test(msg)) return new Error("Couldn't reach the server. Check your connection.");
    return new Error(msg || "Something went wrong. Try again.");
  }

  function me() {
    requireClient();
    const u = user();
    if (!u) throw new Error(FRIENDLY.not_signed_in);
    return u;
  }

  const normalizeUsername = (s) => String(s || "").trim().replace(/^@/, "").toLowerCase();

  // Claim or change your @username. Returns the saved username.
  async function claimUsername(name, state) {
    const u = me();
    const username = normalizeUsername(name);
    if (!USERNAME_RE.test(username)) throw new Error("Use 3–20 lowercase letters, numbers or underscores.");
    const row = { ...publicRow(state, u), username };
    const { error } = await client.from("user_public").upsert(row, { onConflict: "user_id" });
    if (error) throw friendly(error);
    return username;
  }

  // Returns { username, displayName } for the signed-in user, giving a new
  // account a username like "maya_4821" so friends can find it.
  async function ensureUsername(state) {
    const u = me();
    const { data } = await client.from("user_public").select("username, display_name").eq("user_id", u.id).maybeSingle();
    const displayName = (data && data.display_name) || cleanDisplayName(state.displayName) || defaultDisplayName(u);
    if (data && data.username) return { username: data.username, displayName };
    const base = (String(u.email || "").split("@")[0].toLowerCase().replace(/[^a-z0-9_]/g, "") || "wizz").slice(0, 14).padEnd(3, "x");
    for (let i = 0; i < 6; i++) {
      const candidate = `${base}_${Math.floor(1000 + Math.random() * 9000)}`;
      try {
        return { username: await claimUsername(candidate, { ...state, displayName }), displayName };
      } catch (e) {
        if (!/taken/.test(e.message)) throw e;
      }
    }
    throw new Error("Couldn't pick a username. Choose one in Profile.");
  }

  async function searchUsers(query) {
    const u = me();
