          <span class="muted small">${TIERS[r.tierBefore].icon} → ${TIERS[r.tierAfter].icon} ${TIERS[r.tierAfter].name}</span>
        </li>`;
      }).join("");
      container.innerHTML = `
        <div class="stack vault">
          <section class="panel sprint-summary">
            <span class="complete-star" aria-hidden="true">${right === sprint.ids.length ? "🏆" : "📚"}</span>
            <h2>${right} of ${sprint.ids.length} correct</h2>
            <p class="muted">+${sprint.earned} ⚡ Sparks this sprint${bonus ? ` (including the +${bonus} daily bonus)` : ""}</p>
            <ul class="sum-list">${rows}</ul>
            <div class="stack">
              <button class="btn wide" type="button" id="sprint-again">Another sprint</button>
              <button class="btn ghost wide" type="button" id="sprint-home">Back to the Vault</button>
            </div>
          </section>
        </div>`;
      sprint = null;
      container.querySelector("#sprint-again").addEventListener("click", startSprint);
      container.querySelector("#sprint-home").addEventListener("click", render);
      container.scrollTop = 0;
    }

    // Slide-up breakdown: root, definition, context clue, every choice explained.
    function openDrawer(w, result) {
      closeDrawer();
      const correct = result && result.correct;
      drawer = document.createElement("div");
      drawer.className = "sheet-backdrop explain-backdrop";
      drawer.innerHTML = `
        <div class="sheet explain vocab-explain ${correct ? "ok" : "no"}" role="dialog" aria-modal="true" aria-labelledby="vx-title">
          <div class="grabber" aria-hidden="true"></div>
          <div class="explain-head">
            <span class="verdict-icon" aria-hidden="true">${correct ? "✓" : "✗"}</span>
            <div><h2 id="vx-title">${esc(w.word)}</h2><small>${esc(w.pos)}${correct ? "" : ` · back to ${TIERS[1].icon} Novice`}</small></div>
            <button class="linkbtn" type="button" data-close>Close</button>
          </div>
          <p class="vx-def">${esc(w.definition)}</p>
          <div class="vx-grid">
            <div class="vx-box"><span class="label-sm">🌱 Root</span><p>${esc(w.root)}</p></div>
            <div class="vx-box"><span class="label-sm">🔎 Context clue</span><p>${ctx.fill(w.clue, undefined, false)}</p></div>
          </div>
          <ol class="why-list">
            ${sprint && sprint.order ? sprint.order.map((ci, pos) => ({ ci, pos, rank: ci === w.answer ? 0 : ci === sprint.picked ? 1 : 2 }))
              .sort((a, b) => a.rank - b.rank || a.pos - b.pos)
              .map(({ ci, pos }) => `
                <li class="why-row ${ci === w.answer ? "right" : ci === sprint.picked ? "wrong" : "other"}">
                  <span class="letter" aria-hidden="true">${"ABCD"[pos]}</span>
                  <div class="why-body"><b>${esc(w.choices[ci])}</b>
                    ${ci === w.answer ? '<span class="why-tag">Correct answer</span>' : ci === sprint.picked ? '<span class="why-tag">Your answer</span>' : ""}
                    <p>${ctx.fill(w.notes[ci], undefined, false)}</p></div>
                </li>`).join("") : ""}
          </ol>
          <button class="btn wide" type="button" data-next>${sprint && sprint.i + 1 < sprint.ids.length ? "Next word →" : "Finish sprint"}</button>
        </div>`;
      document.body.append(drawer);
      drawer.addEventListener("mousedown", (e) => { if (e.target === drawer) closeDrawer(); });
      drawer.querySelector("[data-close]").addEventListener("click", closeDrawer);
      drawer.querySelector("[data-next]").addEventListener("click", next);
      document.addEventListener("keydown", drawerKeys, true);
      drawer.querySelector("[data-next]").focus({ preventScroll: true });
    }

    function closeDrawer() {
      if (!drawer) return;
      document.removeEventListener("keydown", drawerKeys, true);
      drawer.remove();
      drawer = null;
    }

    function drawerKeys(e) {
      if (!drawer) return;
      if (e.key === "Escape") { e.preventDefault(); closeDrawer(); }
      else if (e.key === "Tab") {
        const items = [...drawer.querySelectorAll("button")];
        const first = items[0];
        const last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      e.stopPropagation();
    }

    // busy: a sprint or deck is in progress, so background re-renders should wait.
    return {
      render,
      openDerbyStable: () => { sprint = null; deck = null; derby.openStable(); },
      isOpen: () => Boolean(drawer),
      busy: () => Boolean(sprint || deck || derby.racing()),
    };
  }

  SW.vocab = { WORDS, TIERS, RULES, emptyProgress, drawSprint, drawDeck, grade, reviewCard, flag, finishSprint, summary, mergeProgress, mount };
})();

</script>
<script>
/* ===== js/rewards.js ===== */
// SatWizz rewards: Sparks economy, Wizz Shop, Focus Shields, Aura Shields,
// the Double-Spark Wager and achievement titles.
// Pure state logic with no DOM. Each function takes the app state, changes it,
// and returns what happened so the UI can react.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});

  const RULES = Object.freeze({
    sparksPerCorrect: 10,
    comboBonus: 5, // paid on every 3rd answer in a row (3, 6, 9...)
    comboEvery: 3,
    dailyGoalSparks: 50,
    chapterSparks: 50, // first completion of each chapter
    maxFocus: 3,
    maxAura: 5,
    auraPrice: 50,
    auraBundleSize: 3,
    auraBundlePrice: 120,
    focusRefillPrice: 30,
    comboSaverPrice: 40,
    maxComboSavers: 3,
    comboSaverMin: 3, // only protects combos of 3 or more
    auraEarnEvery: 7, // streak days per free Aura Shield
    wagerStake: 50,
    wagerPayout: 100,
    wagerDays: 5,
    fastRunLength: 5,
    fastRunMs: 60 * 1000,
  });

  const fail = (reason, extra = {}) => ({ ok: false, reason, ...extra });

  // ---------- Sparks ----------
  // `combo` is the combo count after this correct answer.
  function sparksForCorrect(combo) {
    const bonus = combo > 0 && combo % RULES.comboEvery === 0 ? RULES.comboBonus : 0;
    return { base: RULES.sparksPerCorrect, bonus, total: RULES.sparksPerCorrect + bonus };
  }

  function earn(state, amount) {
    state.sparks = (state.sparks || 0) + amount;
    return amount;
  }

  // ---------- Themes ----------
  const themeById = (id) => SW.themes.find((t) => t.id === id);

  function isThemeUnlocked(state, id) {
    if (id === "custom") return true;
    const t = themeById(id);
    if (!t) return false;
    return !t.price || state.unlockedThemes.includes(id);
  }

  function buyTheme(state, id) {
    const t = themeById(id);
    if (!t || !t.price) return fail("not-for-sale");
    if (isThemeUnlocked(state, id)) return fail("owned");
    if (state.sparks < t.price) return fail("short", { need: t.price - state.sparks });
    state.sparks -= t.price;
    state.unlockedThemes.push(id);
    return { ok: true, spent: t.price, theme: t };
  }

  // ---------- Aura Shields (protect a missed day) ----------
  function buyAura(state) {
    if (state.freezes >= RULES.maxAura) return fail("full");
    if (state.sparks < RULES.auraPrice) return fail("short", { need: RULES.auraPrice - state.sparks });
    state.sparks -= RULES.auraPrice;
    state.freezes += 1;
    return { ok: true, spent: RULES.auraPrice };
  }

  function buyAuraBundle(state) {
    const room = RULES.maxAura - state.freezes;
    if (room < RULES.auraBundleSize) return fail("room", { room });
    if (state.sparks < RULES.auraBundlePrice) return fail("short", { need: RULES.auraBundlePrice - state.sparks });
    state.sparks -= RULES.auraBundlePrice;
    state.freezes += RULES.auraBundleSize;
    return { ok: true, spent: RULES.auraBundlePrice };
  }

  // Free shield for every 7 streak days, if there's room.
  function earnAuraForStreak(state) {
    if (state.streak % RULES.auraEarnEvery !== 0 || state.freezes >= RULES.maxAura) return false;
    state.freezes += 1;
    return true;
  }

  // ---------- Double-Spark Wager ----------
  // Stake 50 now; if the streak grows by 5 more days, collect 100.
  // Today counts as day 1 if today's goal isn't done yet.
  function placeWager(state, todayKey) {
    if (state.wager) return fail("active");
    if (state.sparks < RULES.wagerStake) return fail("short", { need: RULES.wagerStake - state.sparks });
    state.sparks -= RULES.wagerStake;
    state.wager = {
      stake: RULES.wagerStake,
      startStreak: state.streak,
      target: state.streak + RULES.wagerDays,
      placedOn: todayKey,
    };
    return { ok: true, spent: RULES.wagerStake };
  }

  function wagerProgress(state) {
    const w = state.wager;
    if (!w) return null;
    const days = Math.max(0, Math.min(RULES.wagerDays, state.streak - w.startStreak));
    return { days, of: RULES.wagerDays };
  }

  // Call after the daily goal is met.
  function settleWager(state) {
    const w = state.wager;
    if (!w) return null;
    if (state.streak < w.startStreak) return loseWager(state);
    if (state.streak >= w.target) {
      state.wager = null;
      earn(state, RULES.wagerPayout);
      return { won: true, payout: RULES.wagerPayout };
    }
    return { won: false, ...wagerProgress(state) };
  }

  // Call when the streak breaks.
  function loseWager(state) {
    if (!state.wager) return null;
    const stake = state.wager.stake;
    state.wager = null;
    return { lost: true, stake };
  }

  // ---------- Focus Shields ----------
  function loseFocus(state) {
    state.focus = Math.max(0, state.focus - 1);
    return state.focus;
  }

  function restoreFocus(state) {
    state.focus = RULES.maxFocus;
  }

  // Skip the Focus Break review by paying Sparks.
  function buyFocusRefill(state) {
    if (state.focus >= RULES.maxFocus) return fail("full");
    if (state.sparks < RULES.focusRefillPrice) return fail("short", { need: RULES.focusRefillPrice - state.sparks });
    state.sparks -= RULES.focusRefillPrice;
    restoreFocus(state);
    return { ok: true, spent: RULES.focusRefillPrice };
  }

  // ---------- Combo Savers ----------
  function buyComboSaver(state) {
    if (state.comboSavers >= RULES.maxComboSavers) return fail("full");
    if (state.sparks < RULES.comboSaverPrice) return fail("short", { need: RULES.comboSaverPrice - state.sparks });
    state.sparks -= RULES.comboSaverPrice;
    state.comboSavers += 1;
    return { ok: true, spent: RULES.comboSaverPrice };
  }

  // Call on a wrong answer before resetting the combo. True if a saver was spent.
  function useComboSaver(state) {
    if (state.combo < RULES.comboSaverMin || state.comboSavers <= 0) return false;
    state.comboSavers -= 1;
    return true;
  }

  // ---------- Avatars ----------
  const avatarById = (id) => SW.avatars.find((a) => a.id === id);

  function isAvatarUnlocked(state, id) {
    const a = avatarById(id);
    if (!a) return false;
    return !a.price || state.unlockedAvatars.includes(id);
  }

  function buyAvatar(state, id) {
    const a = avatarById(id);
    if (!a || !a.price) return fail("not-for-sale");
    if (isAvatarUnlocked(state, id)) return fail("owned");
    if (state.sparks < a.price) return fail("short", { need: a.price - state.sparks });
    state.sparks -= a.price;
    state.unlockedAvatars.push(id);
    return { ok: true, spent: a.price, avatar: a };
  }

  // ---------- Achievements ----------
  // Keeps timestamps of the current run of correct answers.
  // Returns true when the last 5 in a row took under 60 seconds.
  function trackFastRun(times, correct, now) {
    if (!correct) {
      times.length = 0;
      return false;
    }
    times.push(now);
    while (times.length > RULES.fastRunLength) times.shift();
    return times.length === RULES.fastRunLength && now - times[0] < RULES.fastRunMs;
  }

  const BADGES = [
    {
      id: "spark-starter",
      title: "Spark Starter",
      icon: "✨",
      desc: "Reach a 3-day streak.",
      progress: (s) => ({ value: Math.min(s.bestStreak, 3), of: 3, label: `${Math.min(s.bestStreak, 3)} / 3 days` }),
      check: (s) => s.bestStreak >= 3,
    },
    {
      id: "syntax-warlock",
      title: "Syntax Warlock",
      icon: "🧙",
      desc: "Answer 50 questions correctly.",
      progress: (s) => ({ value: Math.min(s.totalCorrect, 50), of: 50, label: `${Math.min(s.totalCorrect, 50)} / 50 correct` }),
      check: (s) => s.totalCorrect >= 50,
    },
    {
      id: "lightning-fast",
      title: "Lightning Fast",
      icon: "🌩️",
      desc: "Get 5 right in a row in under 60 seconds.",
      progress: (s) => ({ value: s.badges.includes("lightning-fast") ? 1 : 0, of: 1, label: "5 in a row, under a minute" }),
      check: (s, ctx) => Boolean(ctx.fastRun),
    },
  ];

  const badgeById = (id) => BADGES.find((b) => b.id === id);

  // Returns badges unlocked by this check.
  function checkBadges(state, ctx = {}) {
    const fresh = [];
    for (const b of BADGES) {
      if (!state.badges.includes(b.id) && b.check(state, ctx)) {
        state.badges.push(b.id);
        fresh.push(b);
      }
    }
    return fresh;
  }

  SW.rewards = {
    RULES,
    sparksForCorrect,
    earn,
    isThemeUnlocked,
    buyTheme,
    buyAura,
    buyAuraBundle,
    earnAuraForStreak,
    buyFocusRefill,
    buyComboSaver,
    useComboSaver,
    avatarById,
    isAvatarUnlocked,
    buyAvatar,
    placeWager,
    wagerProgress,
    settleWager,
    loseWager,
    loseFocus,
    restoreFocus,
    trackFastRun,
    BADGES,
    badgeById,
    checkBadges,
  };
})();

</script>
<script>
/* ===== js/sfx.js ===== */
// SatWizz sound effects and haptics.
// Sounds are synthesized with the Web Audio API (no audio files). Browsers only
// allow audio after a user gesture, so the AudioContext is created lazily on
// the first play() call, which always happens inside a tap.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  let ctx = null;
  let muted = false;
  let haptics = true;

  function audio() {
    if (muted) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { return null; }
    }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }

  // One enveloped oscillator note.
  function tone(ac, { freq, start = 0, dur = 0.15, type = "sine", gain = 0.2, slideTo }) {
    const t0 = ac.currentTime + start;
    const osc = ac.createOscillator();
    const amp = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(amp).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  // Short filtered noise burst for the "tap".
  function click(ac) {
    const len = Math.floor(ac.sampleRate * 0.03);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    const src = ac.createBufferSource();
    const filter = ac.createBiquadFilter();
    const amp = ac.createGain();
    src.buffer = buf;
    filter.type = "highpass";
    filter.frequency.value = 1800;
    amp.gain.value = 0.35;
    src.connect(filter).connect(amp).connect(ac.destination);
    src.start();
  }

  const SOUNDS = {
    tap: (ac) => click(ac),
    correct: (ac) => {
      tone(ac, { freq: 880, dur: 0.14, type: "triangle", gain: 0.18 });
      tone(ac, { freq: 1318.5, start: 0.08, dur: 0.28, type: "sine", gain: 0.16 });
    },
    wrong: (ac) => {
      tone(ac, { freq: 150, dur: 0.24, type: "triangle", gain: 0.3, slideTo: 70 });
      tone(ac, { freq: 90, dur: 0.18, type: "sine", gain: 0.22 });
    },
    combo: (ac) => {
      [659.3, 830.6, 987.8, 1318.5].forEach((f, i) => tone(ac, { freq: f, start: i * 0.06, dur: 0.18, type: "triangle", gain: 0.13 }));
    },
    // Starting bell for the Vocab Derby.
    bell: (ac) => {
      tone(ac, { freq: 1568, dur: 0.5, type: "sine", gain: 0.14 });
      tone(ac, { freq: 2093, start: 0.02, dur: 0.6, type: "sine", gain: 0.09 });
    },
    // Four quick hoofbeats.
    gallop: (ac) => {
      [0, 0.09, 0.2, 0.29].forEach((start, i) => tone(ac, { freq: i % 2 ? 110 : 140, start, dur: 0.07, type: "triangle", gain: 0.22 }));
    },
    complete: (ac) => {
      [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(ac, { freq: f, start: i * 0.1, dur: 0.35, type: "triangle", gain: 0.14 }));
    },
  };

  function play(name) {
    const ac = audio();
    const fn = SOUNDS[name];
    if (!ac || !fn) return;
    try { fn(ac); } catch (e) { /* audio is best-effort */ }
  }

  function buzz(ms = 50) {
    if (!haptics || typeof navigator.vibrate !== "function") return;
    try { navigator.vibrate(ms); } catch (e) { /* not allowed here */ }
  }

  SW.sfx = {
    play,
    buzz,
    setMuted: (v) => { muted = Boolean(v); },
    setHaptics: (v) => { haptics = Boolean(v); },
    canVibrate: () => typeof navigator.vibrate === "function",
  };
})();

</script>
<script>
/* ===== js/auth.js ===== */
// SatWizz accounts and cloud sync (Supabase).
// Exposes window.SatWizz.auth. Works without Supabase too: if the SDK or the
// config is missing, available() is false and the app stays in guest mode.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  const cfg = SW.config || {};
  const GOALS = [5, 10, 20];
  const PUSH_DELAY_MS = 1200;

  let client = null;
  let session = null;
  let unavailableReason = "";
  const authListeners = new Set();
  const statusListeners = new Set();
  let status = "idle"; // idle | pending | syncing | synced | error

  // ---------- Setup ----------
  function init() {
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      unavailableReason = "not-configured";
      return false;
    }
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      unavailableReason = "sdk-missing";
      return false;
    }
    client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    client.auth.onAuthStateChange((event, s) => {
      session = s;
      // Supabase warns against awaiting its own calls inside this callback,
      // so listeners run on the next tick.
      setTimeout(() => authListeners.forEach((fn) => fn(event, s)), 0);
    });
    return true;
  }

  const available = () => client !== null;
  const reason = () => unavailableReason;
  const user = () => (session && session.user) || null;

  function onChange(fn) {
    authListeners.add(fn);
    return () => authListeners.delete(fn);
  }

  function requireClient() {
    if (!client) {
      throw new Error(
        unavailableReason === "sdk-missing"
          ? "Couldn't reach the sign-in service. Check your connection and reload."
          : "Cloud accounts aren't set up on this copy of SatWizz yet."
      );
    }
  }

  const redirectUrl = () => location.origin + location.pathname;

  // ---------- Auth methods ----------
  async function signUp(email, password) {
    requireClient();
    const { data, error } = await client.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: redirectUrl() },
    });
    if (error) throw error;
    // With email confirmation on, Supabase returns a user but no session.
    return { needsConfirmation: !data.session };
  }

  async function signIn(email, password) {
    requireClient();
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) throw error;
  }

  async function signInWithGoogle() {
    requireClient();
    if (location.protocol === "file:") {
      throw new Error("Google sign-in needs SatWizz to be served over http(s), not opened as a file.");
    }
    const { error } = await client.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: redirectUrl() },
    });
    if (error) throw error; // on success the browser leaves for Google
  }

  async function signOut() {
    if (!client) return;
    clearTimeout(pushTimer);
    const { error } = await client.auth.signOut();
    if (error) throw error;
    setStatus("idle");
  }

  // ---------- Cloud sync ----------
  function setStatus(next) {
    status = next;
    statusListeners.forEach((fn) => fn(status));
  }
  const getStatus = () => status;
  function onStatus(fn) {
    statusListeners.add(fn);
    return () => statusListeners.delete(fn);
  }

  // App state -> table rows
  function toRows(state, u) {
    const now = new Date().toISOString();
    return {
      profile: {
        user_id: u.id,
        email: u.email,
        current_streak: state.streak,
        best_streak: state.bestStreak,
        total_xp: state.xp,
        streak_freezes: state.freezes,
        last_goal_date: state.lastDone,
        sparks: state.sparks,
        unlocked_chapters: state.unlockedChapters,
        completed_chapters: state.completedChapters,
        unlocked_themes: state.unlockedThemes,
        unlocked_badges: state.badges,
        spark_wager: state.wager,
        unlocked_avatars: state.unlockedAvatars,
        combo_savers: state.comboSavers,
        vocab_progress: state.vocab,
        updated_at: now,
      },
      settings: {
        user_id: u.id,
        selected_theme: state.themeId,
        daily_goal: state.goal,
        custom_names: state.custom,
        avatar: state.avatar,
        updated_at: now,
      },
    };
  }

  async function pull() {
    requireClient();
    const u = user();
    if (!u) return { profile: null, settings: null };
    const [p, s] = await Promise.all([
      client.from("profiles").select("*").eq("user_id", u.id).maybeSingle(),
      client.from("user_settings").select("*").eq("user_id", u.id).maybeSingle(),
    ]);
    if (p.error) throw p.error;
    if (s.error) throw s.error;
    return { profile: p.data, settings: s.data };
  }

  async function push(state) {
    requireClient();
    const u = user();
    if (!u) return;
    const rows = toRows(state, u);
    const [a, b, c] = await Promise.all([
      client.from("profiles").upsert(rows.profile, { onConflict: "user_id" }),
      client.from("user_settings").upsert(rows.settings, { onConflict: "user_id" }),
      client.from("user_public").upsert(publicRow(state, u), { onConflict: "user_id" }),
    ]);
    if (a.error) throw a.error;
    if (b.error) throw b.error;
    if (c.error) throw c.error;
  }

  // The leaderboard card. Username is only sent once it has been claimed, so a
  // sync never overwrites it with an empty value.
  function publicRow(state, u) {
    const row = {
      user_id: u.id,
      display_name: cleanDisplayName(state.displayName) || defaultDisplayName(u),
      avatar: state.avatar,
      total_xp: Math.max(0, Math.round(state.xp || 0)),
      sparks: Math.max(0, Math.round(state.sparks || 0)),
      current_streak: Math.max(0, Math.round(state.streak || 0)),
      updated_at: new Date().toISOString(),
    };
    if (state.username) row.username = state.username;
    return row;
  }

  const cleanDisplayName = (s) => String(s || "").replace(/\s+/g, " ").trim().slice(0, 30);
  const defaultDisplayName = (u) => {
    const local = String((u && u.email) || "").split("@")[0].replace(/[._-]+/g, " ").trim();
    return cleanDisplayName(local ? local.charAt(0).toUpperCase() + local.slice(1) : "SatWizz student");
  };

  // Debounced push; call after every local save.
  let pushTimer;
  function schedulePush(getState) {
    if (!client || !user()) return;
    clearTimeout(pushTimer);
    setStatus("pending");
    pushTimer = setTimeout(async () => {
      setStatus("syncing");
      try {
        await push(getState());
        setStatus("synced");
      } catch (e) {
        console.warn("SatWizz sync failed", e);
        setStatus("error");
      }
    }, PUSH_DELAY_MS);
  }

  const union = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])].filter((x) => typeof x === "string");
  const clampInt = (n, lo, hi) => Math.max(lo, Math.min(hi, Math.round(Number(n) || 0)));
  function cleanWager(w) {
    if (!w || typeof w !== "object") return null;
    const startStreak = clampInt(w.startStreak, 0, 1e6);
    return {
      stake: clampInt(w.stake, 0, 1e6),
      startStreak,
      target: clampInt(w.target, startStreak, 1e6),
      placedOn: typeof w.placedOn === "string" ? w.placedOn : null,
    };
  }

  // Combines this device's state with what the account already has.
  // - XP and best streak keep the higher value; the current streak comes from
  //   whichever side met its daily goal more recently.
  // - Unlocked and completed chapters, themes, badges and avatars are combined.
  // - Focus Shields are per session and never synced.
  // - Sparks, Combo Savers and the wager are spendable, so taking the max would undo
  //   purchases. If this device last synced with the same account, the newer
  //   side wins. Otherwise (guest progress, another account) keep the higher
  //   balance so nothing earned is lost.
  // - Saved settings win over this device's.
  // Returns only the fields to overwrite.
  function merge(local, cloud, userId) {
    const out = {};
    const p = cloud.profile;
    if (p) {
      out.xp = Math.max(local.xp || 0, p.total_xp || 0);
      const cloudDate = p.last_goal_date || null;
      const cloudStreakNewer =
        (cloudDate && (!local.lastDone || cloudDate > local.lastDone)) ||
        (cloudDate && cloudDate === local.lastDone && (p.current_streak || 0) > local.streak);
      if (cloudStreakNewer) {
        out.streak = p.current_streak || 0;
        out.lastDone = cloudDate;
        out.freezes = p.streak_freezes || 0;
      }
      out.bestStreak = Math.max(local.bestStreak || 0, p.best_streak || 0, out.streak || 0, local.streak || 0);

      const chapterIds = new Set((SW.chapters || []).map((c) => c.id));
      const chapters = (a, b) => [...new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])])]
        .filter((id) => chapterIds.has(id)).sort((x, y) => x - y);
      out.unlockedChapters = chapters([1, ...(local.unlockedChapters || [])], p.unlocked_chapters);
      out.completedChapters = chapters(local.completedChapters, p.completed_chapters);
      out.unlockedThemes = union(local.unlockedThemes, p.unlocked_themes);
      out.badges = union(local.badges, p.unlocked_badges);
      // Vocab Vault: per word, the most recently answered side wins.
      if (SW.vocab) out.vocab = SW.vocab.mergeProgress(local.vocab, p.vocab_progress);
      const avatarIds = new Set((SW.avatars || []).map((a) => a.id));
      out.unlockedAvatars = union(local.unlockedAvatars, p.unlocked_avatars).filter((id) => avatarIds.has(id));

      if (typeof p.sparks === "number") {
        const sameAccount = Boolean(userId) && local.syncedUserId === userId;
        const cloudNewer = (Date.parse(p.updated_at) || 0) > (local.updatedAt || 0);
        if (sameAccount) {
          if (cloudNewer) {
            out.sparks = clampInt(p.sparks, 0, 1e9);
            out.wager = cleanWager(p.spark_wager);
            out.comboSavers = clampInt(p.combo_savers, 0, 3);
          }
        } else {
          out.sparks = Math.max(local.sparks || 0, clampInt(p.sparks, 0, 1e9));
          out.comboSavers = Math.max(local.comboSavers || 0, clampInt(p.combo_savers, 0, 3));
          if (!local.wager) out.wager = cleanWager(p.spark_wager);
        }
      }
    }
    const s = cloud.settings;
    if (s) {
      if (s.selected_theme) out.themeId = s.selected_theme;
      if (GOALS.includes(s.daily_goal)) out.goal = s.daily_goal;
      if (s.avatar && (SW.avatars || []).some((a) => a.id === s.avatar)) out.avatar = s.avatar;
      const c = s.custom_names;
      if (c && Array.isArray(c.people) && c.people.length === 3) {
        out.custom = {
          people: c.people.map((x) => ({
            name: String((x && x.name) || "").slice(0, 24),
            pro: ["he", "she", "they"].includes(x && x.pro) ? x.pro : "they",
          })),
          place: String(c.place || "").slice(0, 40),
          craft: String(c.craft || "").slice(0, 40),
          event: String(c.event || "").slice(0, 40),
        };
      }
      out.castChosen = true;
    }
    return out;
  }

  // ======================================================================
  // Social: usernames, friends, friend streaks, leaderboards, Lock In.
  // All of these need a signed-in user; they throw friendly Errors.
  // ======================================================================
  const USERNAME_RE = /^[a-z0-9_]{3,20}$/;
  const PUBLIC_COLS = "user_id, username, display_name, avatar, total_xp, sparks, current_streak, last_practice_at";
  const FRIENDLY = {
    user_not_found: "No one has that username. Check the spelling.",
    cannot_friend_self: "That's your own username.",
    not_friends: "You can only Lock In friends.",
    already_locked_in: "You already sent a Lock In. Try again in a few hours.",
    request_not_found: "That request is no longer there.",
    not_signed_in: "Sign in first.",
  };

  function friendly(err) {
    const msg = (err && (err.message || err.error)) || String(err || "");
    const code = Object.keys(FRIENDLY).find((k) => msg.includes(k));
    if (code) return new Error(FRIENDLY[code]);
    if (err && err.code === "23505") return new Error("That username is taken.");
    if (/failed to fetch|network/i.test(msg)) return new Error("Couldn't reach the server. Check your connection.");
    return new Error(msg || "Something went wrong. Try again.");
  }

  function me() {
    requireClient();
    const u = user();
    if (!u) throw new Error(FRIENDLY.not_signed_in);
    return u;
  }

  const normalizeUsername = (s) => String(s || "").trim().replace(/^@/, "").toLowerCase();

  // Claim or change your @username. Returns the saved username.
  async function claimUsername(name, state) {
    const u = me();
    const username = normalizeUsername(name);
    if (!USERNAME_RE.test(username)) throw new Error("Use 3–20 lowercase letters, numbers or underscores.");
    const row = { ...publicRow(state, u), username };
    const { error } = await client.from("user_public").upsert(row, { onConflict: "user_id" });
    if (error) throw friendly(error);
    return username;
  }

  // Returns { username, displayName } for the signed-in user, giving a new
  // account a username like "maya_4821" so friends can find it.
  async function ensureUsername(state) {
    const u = me();
    const { data } = await client.from("user_public").select("username, display_name").eq("user_id", u.id).maybeSingle();
    const displayName = (data && data.display_name) || cleanDisplayName(state.displayName) || defaultDisplayName(u);
    if (data && data.username) return { username: data.username, displayName };
    const base = (String(u.email || "").split("@")[0].toLowerCase().replace(/[^a-z0-9_]/g, "") || "wizz").slice(0, 14).padEnd(3, "x");
    for (let i = 0; i < 6; i++) {
      const candidate = `${base}_${Math.floor(1000 + Math.random() * 9000)}`;
      try {
        return { username: await claimUsername(candidate, { ...state, displayName }), displayName };
      } catch (e) {
        if (!/taken/.test(e.message)) throw e;
      }
    }
    throw new Error("Couldn't pick a username. Choose one in Profile.");
  }

  async function searchUsers(query) {
    const u = me();
    const q = normalizeUsername(query).replace(/[^a-z0-9_]/g, "");
    if (q.length < 2) return [];
    const { data, error } = await client.from("user_public").select(PUBLIC_COLS)
      .ilike("username", `${q}%`).neq("user_id", u.id).order("username").limit(8);
    if (error) throw friendly(error);
    return data || [];
  }

  async function sendFriendRequest(username) {
    me();
    const { data, error } = await client.rpc("send_friend_request", { target_username: normalizeUsername(username) });
    if (error) throw friendly(error);
    return data; // friendships row; status "accepted" if they had already asked you
  }

  async function respondFriendRequest(id, accept) {
    me();
    const { error } = await client.rpc("respond_friend_request", { request_id: id, accept });
    if (error) throw friendly(error);
  }

  const utcDay = (d = new Date()) => d.toISOString().slice(0, 10);
  const utcYesterday = () => utcDay(new Date(Date.now() - 864e5));

  // Friends with their public cards and the shared streak.
  async function listFriends() {
    const u = me();
    const { data: rows, error } = await client.from("friendships").select("*");
    if (error) throw friendly(error);
    const otherId = (f) => (f.user_low === u.id ? f.user_high : f.user_low);
    const ids = [...new Set((rows || []).map(otherId))];
    let cards = [];
    if (ids.length) {
      const res = await client.from("user_public").select(PUBLIC_COLS).in("user_id", ids);
      if (res.error) throw friendly(res.error);
      cards = res.data || [];
    }
    const byId = Object.fromEntries(cards.map((c) => [c.user_id, c]));
    const alive = (f) => f.streak_date && f.streak_date >= utcYesterday();
    const out = { friends: [], incoming: [], outgoing: [] };
    for (const f of rows || []) {
      const profile = byId[otherId(f)] || { user_id: otherId(f), display_name: "Friend", avatar: "fox" };
      const lastAt = profile.last_practice_at ? Date.parse(profile.last_practice_at) : 0;
      const entry = {
        id: f.id,
        profile,
        streak: alive(f) ? f.streak : 0,
        practicedRecently: Date.now() - lastAt < 20 * 3600e3, // "active" for Lock In purposes
        lastPracticeAt: lastAt || null,
      };
      if (f.status === "accepted") out.friends.push(entry);
      else if (f.requested_by === u.id) out.outgoing.push(entry);
      else out.incoming.push(entry);
    }
    out.friends.sort((a, b) => b.streak - a.streak || (b.profile.total_xp || 0) - (a.profile.total_xp || 0));
    return out;
  }

  // scope: "global" (top 50) or "friends"; metric: "xp" or "sparks".
  async function leaderboard(scope, metric, mine) {
    const u = me();
    const col = metric === "sparks" ? "sparks" : "total_xp";
    let rows;
    if (scope === "friends") {
      const { data: fr, error } = await client.from("friendships").select("user_low, user_high").eq("status", "accepted");
      if (error) throw friendly(error);
      const ids = [u.id, ...(fr || []).map((f) => (f.user_low === u.id ? f.user_high : f.user_low))];
      const res = await client.from("user_public").select(PUBLIC_COLS).in("user_id", ids).order(col, { ascending: false });
      if (res.error) throw friendly(res.error);
      rows = res.data || [];
    } else {
      const res = await client.from("user_public").select(PUBLIC_COLS).order(col, { ascending: false }).limit(50);
      if (res.error) throw friendly(res.error);
      rows = res.data || [];
    }
    // Your rank = 1 + number of people strictly ahead of you.
    let myRank = rows.findIndex((r) => r.user_id === u.id) + 1 || null;
    if (!myRank && scope === "global" && mine != null) {
      const { count, error } = await client.from("user_public").select("user_id", { count: "exact", head: true }).gt(col, mine);
      if (!error && typeof count === "number") myRank = count + 1;
    }
    return { rows, myRank, column: col };
  }

  // Marks you active and grows friend streaks. Cheap; the app throttles it.
  async function recordPractice() {
    if (!client || !user()) return;
    const { error } = await client.rpc("record_practice");
    if (error) console.warn("SatWizz: record_practice failed", error);
  }

  // Lock In a friend: the Edge Function stores the alert and pushes it. If the
  // function isn't deployed, fall back to storing it (in-app alert only).
  async function sendLockIn(friendId) {
    me();
    const { data, error } = await client.functions.invoke("lock-in", { body: { friendId } });
    if (!error) return { pushed: (data && data.sent) > 0, message: data && data.message };
    let status = 0;
    let body = null;
    try {
      status = error.context && error.context.status;
      body = error.context && typeof error.context.json === "function" ? await error.context.json() : null;
    } catch (e) { /* not JSON */ }
    if (body && body.error && status >= 400 && status < 500 && status !== 404) throw friendly(body);
    // Not deployed (404) or unreachable: store it directly so it still shows in-app.
    const res = await client.rpc("send_lock_in", { target: friendId });
    if (res.error) throw friendly(res.error);
    return { pushed: false, message: res.data && res.data.message };
  }

  async function unreadLockIns() {
    const u = me();
    const { data, error } = await client.from("lock_ins").select("*")
      .eq("to_user", u.id).is("read_at", null).order("created_at", { ascending: false }).limit(5);
    if (error) throw friendly(error);
    return data || [];
  }

  async function markLockInsRead(ids) {
    if (!ids.length) return;
    me();
    const { error } = await client.from("lock_ins").update({ read_at: new Date().toISOString() }).in("id", ids);
    if (error) console.warn("SatWizz: couldn't mark Lock In read", error);
  }

  // Live in-app alerts while the app is open. Returns an unsubscribe function.
  function subscribeLockIns(onAlert) {
    const u = user();
    if (!client || !u || typeof client.channel !== "function") return () => {};
    const channel = client
      .channel(`lock-ins-${u.id}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "lock_ins", filter: `to_user=eq.${u.id}` },
        (payload) => onAlert(payload.new))
      .subscribe();
    return () => client.removeChannel(channel);
  }

  // ---------- Web Push ----------
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

  // unsupported | not-configured | needs-install | default | denied | enabled
  async function pushState() {
    if (!cfg.vapidPublicKey) return "not-configured";
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
      return isIOS() && !isStandalone() ? "needs-install" : "unsupported";
    }
    if (Notification.permission === "denied") return "denied";
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && (await reg.pushManager.getSubscription());
      if (sub && Notification.permission === "granted") return "enabled";
    } catch (e) { /* treat as not enabled */ }
    return "default";
  }

  function urlBase64ToUint8Array(base64) {
    const padded = (base64 + "=".repeat((4 - (base64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(padded);
    return Uint8Array.from(raw, (c) => c.charCodeAt(0));
  }

  // Must be called from a tap (browsers require a user gesture for the prompt).
  async function enablePush() {
    me();
    const state = await pushState();
    if (state === "needs-install") throw new Error("On iPhone, add SatWizz to your Home Screen first (Share → Add to Home Screen), then turn alerts on there.");
    if (state === "unsupported") throw new Error("This browser doesn't support notifications.");
    if (state === "not-configured") throw new Error("Push alerts aren't set up on this copy of SatWizz yet.");
    const permission = await Notification.requestPermission();
    if (permission !== "granted") throw new Error("Notifications are blocked. Allow them in your browser settings to get Lock In alerts.");
    let reg;
    try {
      reg = await navigator.serviceWorker.register("sw.js");
    } catch (e) {
      // The single-file build (dist/index.html) has no sw.js beside it.
      throw new Error("Push alerts need the sw.js file next to this page. Upload sw.js alongside index.html to turn them on.");
    }
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(cfg.vapidPublicKey) }));
    const { endpoint, keys } = sub.toJSON();
    const { error } = await client.from("push_subscriptions")
      .upsert({ user_id: user().id, endpoint, p256dh: keys.p256dh, auth: keys.auth }, { onConflict: "endpoint" });
    if (error) throw friendly(error);
    return "enabled";
  }

  async function disablePush() {
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
    const sub = reg && (await reg.pushManager.getSubscription());
    if (!sub) return;
    if (client && user()) await client.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
    await sub.unsubscribe();
  }

  SW.auth = {
    init,
    available,
    reason,
    user,
    onChange,
    signUp,
    signIn,
    signInWithGoogle,
    signOut,
    pull,
    push,
    schedulePush,
    merge,
    status: getStatus,
    onStatus,
    defaultDisplayName,
    // social
    claimUsername,
    ensureUsername,
    searchUsers,
    sendFriendRequest,
    respondFriendRequest,
    listFriends,
    leaderboard,
    recordPractice,
    sendLockIn,
    unreadLockIns,
    markLockInsRead,
    subscribeLockIns,
    pushState,
    enablePush,
    disablePush,
  };
})();

</script>
<script>
/* ===== js/onboarding.js ===== */
// SatWizz sign-up / log-in modal. Exposes window.SatWizz.onboarding.
// open({ reason, onGuest }) shows the overlay; reason is "save", "combo" or "invite".
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  const auth = () => SW.auth;

  const COPY = {
    save: {
      title: "Save your progress",
      body: "Create a free account to keep your streak, XP and cast on every device.",
    },
    combo: {
      title: "3 in a row! Don't lose that streak",
      body: "Make a free account so your streak and XP follow you to any phone or laptop.",
    },
    invite: {
      title: "A friend invited you 🔥",
      body: "Sign in to accept their friend request, start a friend streak and see where you rank.",
    },
  };

  const GOOGLE_G =
    '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">' +
    '<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>' +
    '<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>' +
    '<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>' +
    '<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>' +
    "</svg>";

  let root = null;
  let opts = {};
  let mode = "signup";
  let returnFocus = null;

  const isOpen = () => root !== null;

  function open(options = {}) {
    if (root) return;
    opts = options;
    mode = options.mode || "signup";
    returnFocus = document.activeElement;
    render();
    document.addEventListener("keydown", onKey, true);
    root.querySelector("#auth-google").focus();
  }

  function close() {
    if (!root) return;
    document.removeEventListener("keydown", onKey, true);
    root.remove();
    root = null;
    if (returnFocus && typeof returnFocus.focus === "function") returnFocus.focus({ preventScroll: true });
  }

  function continueAsGuest() {
    close();
    if (typeof opts.onGuest === "function") opts.onGuest();
  }

  function render() {
    const copy = COPY[opts.reason] || COPY.save;
    const ready = auth() && auth().available();
    root = document.createElement("div");
    root.className = "modal-backdrop";
    root.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title" aria-describedby="auth-body">
        <div class="modal-brand">Sat<span>Wizz</span></div>
        <h2 id="auth-title">${copy.title}</h2>
        <p id="auth-body" class="muted">${copy.body}</p>
        ${ready ? "" : `<p class="notice">${
          auth() && auth().reason() === "sdk-missing"
            ? "The sign-in service didn't load. Check your connection and reload, or keep playing as a guest."
            : "Cloud accounts aren't set up on this copy of SatWizz yet. You can keep playing as a guest."
        }</p>`}
        <button class="btn google wide" type="button" id="auth-google">${GOOGLE_G}<span>Continue with Google</span></button>
        <div class="divider" role="separator"><span>or use email</span></div>
        <div class="seg auth-tabs" role="tablist" aria-label="Account">
          <button type="button" role="tab" id="tab-signup" aria-controls="auth-form">Sign Up</button>
          <button type="button" role="tab" id="tab-login" aria-controls="auth-form">Log In</button>
        </div>
        <form id="auth-form" class="stack" novalidate>
          <div class="field">
            <label for="auth-email">Email</label>
            <input class="input" id="auth-email" type="email" autocomplete="email" inputmode="email" required>
          </div>
          <div class="field">
            <label for="auth-pass">Password</label>
            <input class="input" id="auth-pass" type="password" minlength="6" required>
          </div>
          <p class="form-msg" id="auth-msg" role="alert"></p>
          <button class="btn wide" type="submit" id="auth-submit"></button>
        </form>
        <button class="linkbtn" type="button" id="auth-guest">Continue as Guest</button>
        <p class="fine">As a guest, progress is saved in this browser only.</p>
      </div>`;
    document.body.append(root);

    root.addEventListener("mousedown", (e) => { if (e.target === root) continueAsGuest(); });
    root.querySelector("#tab-signup").addEventListener("click", () => setMode("signup"));
    root.querySelector("#tab-login").addEventListener("click", () => setMode("login"));
    root.querySelector("#auth-guest").addEventListener("click", continueAsGuest);
    root.querySelector("#auth-google").addEventListener("click", google);
    root.querySelector("#auth-form").addEventListener("submit", submit);
    setMode(mode);
  }

  function setMode(next) {
    mode = next;
    const signup = mode === "signup";
    root.querySelector("#tab-signup").setAttribute("aria-selected", String(signup));
    root.querySelector("#tab-login").setAttribute("aria-selected", String(!signup));
    root.querySelector("#tab-signup").setAttribute("aria-pressed", String(signup));
    root.querySelector("#tab-login").setAttribute("aria-pressed", String(!signup));
    root.querySelector("#auth-pass").setAttribute("autocomplete", signup ? "new-password" : "current-password");
    root.querySelector("#auth-submit").textContent = signup ? "Sign Up" : "Log In";
    message("");
  }

  function message(text, kind = "error") {
    const el = root && root.querySelector("#auth-msg");
    if (!el) return;
    el.textContent = text;
    el.dataset.kind = kind;
  }

  function busy(on, label) {
    const btn = root.querySelector("#auth-submit");
    btn.disabled = on;
    root.querySelector("#auth-google").disabled = on;
    if (label) btn.textContent = label;
  }

  function friendly(err) {
    const m = (err && err.message) || "Something went wrong. Try again.";
    if (/invalid login credentials/i.test(m)) return "That email and password don't match. Check them or switch to Sign Up.";
    if (/already registered|already exists/i.test(m)) return "There's already an account with that email. Switch to Log In.";
    if (/email not confirmed/i.test(m)) return "Confirm your email first. Check your inbox for the link.";
    if (/failed to fetch|network/i.test(m)) return "Couldn't reach the server. Check your connection and try again.";
    return m;
  }

  async function google() {
    message("");
    try {
      busy(true);
      await auth().signInWithGoogle();
    } catch (e) {
      message(friendly(e));
      busy(false);
    }
  }

  async function submit(e) {
    e.preventDefault();
    const email = root.querySelector("#auth-email").value.trim();
    const password = root.querySelector("#auth-pass").value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return message("Enter a valid email address.");
    if (password.length < 6) return message("Use a password with at least 6 characters.");

    const signup = mode === "signup";
    busy(true, signup ? "Creating account…" : "Logging in…");
    try {
      if (signup) {
        const { needsConfirmation } = await auth().signUp(email, password);
        if (needsConfirmation) {
          setMode("login");
          busy(false);
          message(`Check ${email} for a confirmation link, then log in here.`, "info");
          return;
        }
      } else {
        await auth().signIn(email, password);
      }
      close(); // the app's auth listener pulls and merges cloud data
    } catch (err) {
      busy(false);
      setMode(mode);
      message(friendly(err));
    }
  }

  function onKey(e) {
    if (!root) return;
    if (e.key === "Escape") {
      e.preventDefault();
      continueAsGuest();
      return;
    }
    if (e.key === "Tab") {
      const items = [...root.querySelectorAll("button:not(:disabled), input")];
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    // Capture-phase stop: the app's feed shortcuts never see keys typed here.
    e.stopPropagation();
  }

  SW.onboarding = { open, close, isOpen };
})();

</script>
<script>
/* ===== js/social-view.js ===== */
// SatWizz "Leaderboard" tab: live leaderboards (Global Top 50 / Friends League),
// friend streaks with Lock In nudges, friend requests, search and invites.
//
// The app mounts it with a context of shared helpers:
//   SatWizz.socialView.mount({ container, getState, save, esc, toast, openSignup,
//                              avatarEmoji, sfx, inviteUrl })
// and gets back { render, invalidate }.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  const CACHE_MS = 20 * 1000;

  function mount(ctx) {
    const auth = SW.auth;
    const { container, esc, toast } = ctx;
    const cache = new Map(); // key -> { at, data }
    let searchResults = null;
    let renderSeq = 0;

    const S = () => ctx.getState();
    const fmt = (n) => Number(n || 0).toLocaleString();
    const medal = (rank) => ["🥇", "🥈", "🥉"][rank - 1] || `#${rank}`;
    const signedIn = () => auth.available() && auth.user();

    async function cached(key, load, force) {
      const hit = cache.get(key);
      if (!force && hit && Date.now() - hit.at < CACHE_MS) return hit.data;
      const data = await load();
      cache.set(key, { at: Date.now(), data });
      return data;
    }
    const invalidate = () => cache.clear();

    // ---------- shell ----------
    function render(force) {
      const st = S();
      const scope = st.lbScope === "friends" ? "friends" : "global";
      const metric = st.lbMetric === "sparks" ? "sparks" : "xp";
      container.innerHTML = `
        <div class="stack ranks">
          <div class="seg subtabs" role="tablist" aria-label="Leaderboard">
            <button type="button" role="tab" data-scope="global" aria-selected="${scope === "global"}">🌍 Global Top 50</button>
            <button type="button" role="tab" data-scope="friends" aria-selected="${scope === "friends"}">🤝 Friends League</button>
          </div>
          <div class="metric-row">
            <span class="label-sm">Rank by</span>
            <div class="seg small" role="group" aria-label="Rank by">
              <button type="button" data-metric="xp" aria-pressed="${metric === "xp"}">XP</button>
              <button type="button" data-metric="sparks" aria-pressed="${metric === "sparks"}">⚡ Sparks</button>
            </div>
          </div>
          <div id="ranks-body" class="stack"><div class="panel skeleton" aria-busy="true"><p class="muted">Loading the leaderboard…</p></div></div>
        </div>
        <div class="rank-bar" id="rank-bar" aria-live="polite"></div>`;
      container.querySelectorAll("[data-scope]").forEach((b) => b.addEventListener("click", () => {
        S().lbScope = b.dataset.scope;
        ctx.save();
        render();
      }));
      container.querySelectorAll("[data-metric]").forEach((b) => b.addEventListener("click", () => {
        S().lbMetric = b.dataset.metric;
        ctx.save();
        render();
      }));
      load(scope, metric, force);
    }

    function rankBar({ rank, value, metric }) {
      const st = S();
      const bar = container.querySelector("#rank-bar");
      if (!bar) return;
      const unit = metric === "sparks" ? "⚡" : "XP";
      bar.innerHTML = `
        <span class="lb-rank">${rank ? medal(rank) : "—"}</span>
        <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(st.avatar)}</span>
        <span class="lb-name"><b>Your rank</b><small>${rank ? `${st.username ? "@" + esc(st.username) + " · " : ""}🔥 ${st.streak}` : "Unranked · sign in to compete"}</small></span>
        <span class="lb-value">${fmt(value)} <small>${unit}</small></span>`;
    }

    // ---------- data ----------
    async function load(scope, metric, force) {
      const seq = ++renderSeq;
      const body = container.querySelector("#ranks-body");
      const st = S();
      const myValue = metric === "sparks" ? st.sparks : st.xp;

      if (st.demo) {
        body.innerHTML = `<section class="panel"><h2>Demo Mode is on</h2><p class="muted">Leaderboards are paused while Demo Mode is on, so demo numbers never reach the real rankings. Tap the SatWizz logo 5 times to turn it off.</p></section>`;
        rankBar({ rank: null, value: myValue, metric });
        return;
      }
      if (!signedIn()) {
        body.innerHTML = `
          <section class="panel ranks-cta">
            <span class="cta-emoji" aria-hidden="true">🏆</span>
            <h2>Climb the leaderboard</h2>
            <p class="muted">Sign in to see where you rank worldwide, add friends by @username, and keep friend streaks alive.</p>
            <button class="btn wide" type="button" id="ranks-signin">Save Progress &amp; join</button>
          </section>`;
        body.querySelector("#ranks-signin").addEventListener("click", () => ctx.openSignup("save"));
        rankBar({ rank: null, value: myValue, metric });
        return;
      }

      try {
        const [board, social] = await Promise.all([
          cached(`${scope}:${metric}`, () => auth.leaderboard(scope, metric, myValue), force),
          scope === "friends" ? cached("friends", () => auth.listFriends(), force) : Promise.resolve(null),
        ]);
        if (seq !== renderSeq) return; // a newer render started
        body.innerHTML = "";
        if (social) body.append(...friendsSections(social));
        body.append(boardSection(board, scope, metric));
        rankBar({ rank: board.myRank, value: myValue, metric });
        wire(body);
      } catch (e) {
        if (seq !== renderSeq) return;
        body.innerHTML = `<section class="panel"><h2>Couldn't load rankings</h2><p class="muted">${esc(e.message)}</p><button class="btn ghost" type="button" id="ranks-retry">Try again</button></section>`;
        body.querySelector("#ranks-retry").addEventListener("click", () => render(true));
        rankBar({ rank: null, value: myValue, metric });
      }
    }

    // ---------- sections ----------
    function boardSection(board, scope, metric) {
      const me = auth.user().id;
      const col = board.column;
      const unit = metric === "sparks" ? "⚡" : "XP";
      const sec = document.createElement("section");
      sec.className = "panel";
      const rows = board.rows.map((r, i) => `
        <li class="lb-row${r.user_id === me ? " me" : ""}${i < 3 ? " top" : ""}">
          <span class="lb-rank">${medal(i + 1)}</span>
          <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(r.avatar)}</span>
          <span class="lb-name"><b>${esc(r.display_name)}${r.user_id === me ? " (you)" : ""}</b><small>${r.username ? "@" + esc(r.username) + " · " : ""}🔥 ${fmt(r.current_streak)}</small></span>
          <span class="lb-value">${fmt(r[col])} <small>${unit}</small></span>
        </li>`).join("");
      sec.innerHTML = `
        <h2>${scope === "friends" ? "Friends League" : "Global Top 50"}</h2>
        ${board.rows.length
          ? `<ol class="lb-list">${rows}</ol>`
          : `<p class="muted">${scope === "friends" ? "Add friends to start a league." : "No one's on the board yet. Answer a question to be first."}</p>`}`;
      return sec;
    }

    function friendsSections(social) {
      const out = [];
      const st = S();

      // Friend streaks + Lock In
      const streaks = document.createElement("section");
      streaks.className = "panel";
      streaks.innerHTML = `
        <h2>Friend streaks</h2>
        <p class="muted">A friend streak grows each day you and a friend both practice within 24 hours.</p>
        ${social.friends.length ? `<ul class="friend-list">${social.friends.map((f) => `
          <li class="friend-row${f.practicedRecently ? "" : " idle"}">
            <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(f.profile.avatar)}</span>
            <span class="lb-name"><b>${esc(f.profile.display_name)}</b><small>${f.profile.username ? "@" + esc(f.profile.username) + " · " : ""}${f.practicedRecently ? "practiced today ✓" : lastSeen(f.lastPracticeAt)}</small></span>
            <span class="fstreak${f.streak ? "" : " cold"}" title="Friend streak">🔥 ${f.streak}</span>
            ${f.practicedRecently ? "" : `<button class="lock-btn" type="button" data-lock="${esc(f.profile.user_id)}" data-name="${esc(f.profile.display_name)}">Lock In 🔒</button>`}
          </li>`).join("")}</ul>` : '<p class="muted">No friends yet. Search by @username or share your invite link below.</p>'}`;
      out.push(streaks);

      // Requests
      if (social.incoming.length || social.outgoing.length) {
        const req = document.createElement("section");
        req.className = "panel";
        req.innerHTML = `
          <h2>Requests</h2>
          <ul class="friend-list">
            ${social.incoming.map((f) => `
              <li class="friend-row">
                <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(f.profile.avatar)}</span>
                <span class="lb-name"><b>${esc(f.profile.display_name)}</b><small>${f.profile.username ? "@" + esc(f.profile.username) : ""} wants to be friends</small></span>
                <button class="mini-btn on" type="button" data-accept="${f.id}">Accept</button>
                <button class="mini-btn" type="button" data-decline="${f.id}">Decline</button>
              </li>`).join("")}
            ${social.outgoing.map((f) => `
              <li class="friend-row">
                <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(f.profile.avatar)}</span>
                <span class="lb-name"><b>${esc(f.profile.display_name)}</b><small>Request sent · waiting</small></span>
                <button class="mini-btn" type="button" data-decline="${f.id}">Cancel</button>
              </li>`).join("")}
          </ul>`;
        out.push(req);
      }

      // Add friends
      const add = document.createElement("section");
      add.className = "panel";
      const link = ctx.inviteUrl();
      add.innerHTML = `
        <h2>Add friends</h2>
        <form class="search-row" id="friend-search" role="search">
          <label class="sr-only" for="friend-q">Search by username</label>
          <input class="input" id="friend-q" placeholder="@username" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="search">
          <button class="btn" type="submit">Search</button>
        </form>
        <ul class="friend-list" id="search-results">${renderResults()}</ul>
        <div class="invite">
          <span class="label-sm">Your invite link${st.username ? ` · you're @${esc(st.username)}` : ""}</span>
          ${link ? `<code class="invite-link" id="invite-link">${esc(link)}</code>
          <div class="row">
            <button class="btn ghost" type="button" id="copy-invite">Copy link</button>
            ${navigator.share ? '<button class="btn ghost" type="button" id="share-invite">Share</button>' : ""}
          </div>` : '<p class="muted">Your username is being set up…</p>'}
        </div>
        <div class="push-card" id="push-card"></div>`;
      out.push(add);
      return out;
    }

    function renderResults() {
      if (searchResults === null) return "";
      if (!searchResults.length) return '<li class="muted">No one found with that username.</li>';
      return searchResults.map((r) => `
        <li class="friend-row">
          <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(r.avatar)}</span>
          <span class="lb-name"><b>${esc(r.display_name)}</b><small>@${esc(r.username)} · ${fmt(r.total_xp)} XP</small></span>
          <button class="mini-btn on" type="button" data-add="${esc(r.username)}">Add</button>
        </li>`).join("");
    }

    function lastSeen(ts) {
      if (!ts) return "hasn't practiced yet";
      const days = Math.floor((Date.now() - ts) / 864e5);
      return days < 1 ? "not practiced today" : `last practiced ${days}d ago`;
    }

    // ---------- actions ----------
    function wire(body) {
      body.querySelectorAll("[data-lock]").forEach((b) => b.addEventListener("click", async () => {
        ctx.sfx.play("tap");
        b.disabled = true;
        b.textContent = "Sending…";
        try {
          const res = await auth.sendLockIn(b.dataset.lock);
          b.textContent = "Sent ✓";
          toast(`Lock In sent to ${b.dataset.name} 🔒${res.pushed ? "" : " They'll see it next time they open SatWizz."}`);
        } catch (e) {
          b.textContent = "Lock In 🔒";
          b.disabled = /again in a few hours/.test(e.message);
          toast(e.message);
        }
      }));
      body.querySelectorAll("[data-accept]").forEach((b) => b.addEventListener("click", () => respond(b, Number(b.dataset.accept), true)));
      body.querySelectorAll("[data-decline]").forEach((b) => b.addEventListener("click", () => respond(b, Number(b.dataset.decline), false)));
      wireAdd(body);
      wireInvite(body);
      renderPushCard(body.querySelector("#push-card"));
    }

    async function respond(btn, id, accept) {
      btn.disabled = true;
      try {
        await auth.respondFriendRequest(id, accept);
        toast(accept ? "Friend added 🎉 Your friend streak starts when you both practice." : "Request removed.");
        invalidate();
        render(true);
      } catch (e) {
        btn.disabled = false;
        toast(e.message);
      }
    }

    function wireAdd(body) {
      const form = body.querySelector("#friend-search");
      if (!form) return;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const q = body.querySelector("#friend-q").value;
        try {
          searchResults = await auth.searchUsers(q);
        } catch (err) {
          toast(err.message);
          searchResults = [];
        }
        body.querySelector("#search-results").innerHTML = renderResults();
        wireAddButtons(body);
      });
      wireAddButtons(body);
    }

    function wireAddButtons(body) {
      body.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          const row = await auth.sendFriendRequest(b.dataset.add);
          toast(row && row.status === "accepted" ? `You and @${b.dataset.add} are now friends 🎉` : `Friend request sent to @${b.dataset.add}`);
          searchResults = null;
          invalidate();
          render(true);
        } catch (e) {
          b.disabled = false;
          toast(e.message);
        }
      }));
    }

    function wireInvite(body) {
      const link = body.querySelector("#invite-link");
      body.querySelector("#copy-invite")?.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(link.textContent);
          toast("Invite link copied");
        } catch (e) {
          const range = document.createRange();
          range.selectNodeContents(link);
          const sel = getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          toast("Press and hold (or Ctrl+C) to copy the link");
        }
      });
      body.querySelector("#share-invite")?.addEventListener("click", () => {
        navigator.share({
          title: "Join me on SatWizz",
          text: "Practice SAT grammar with me and let's keep a streak going 🔥",
          url: link.textContent,
        }).catch(() => {});
      });
    }

    async function renderPushCard(el) {
      if (!el) return;
      const state = await auth.pushState();
      if (state === "enabled" || state === "not-configured" || state === "unsupported") {
        el.hidden = state !== "enabled";
        el.innerHTML = state === "enabled" ? '<p class="muted">🔔 Lock In alerts are on for this device.</p>' : "";
        return;
      }
      const copy = {
        default: "Get a notification when a friend tells you to Lock In.",
        denied: "Notifications are blocked for SatWizz. Allow them in your browser's site settings to get Lock In alerts.",
        "needs-install": "On iPhone, add SatWizz to your Home Screen (Share → Add to Home Screen) to get Lock In alerts.",
      }[state];
      el.innerHTML = `<p class="muted">🔔 ${copy}</p>${state === "default" ? '<button class="btn ghost" type="button" id="push-on">Turn on alerts</button>' : ""}`;
      el.querySelector("#push-on")?.addEventListener("click", async () => {
        try {
          await auth.enablePush();
          toast("Lock In alerts are on 🔔");
        } catch (e) {
          toast(e.message);
        }
        renderPushCard(el);
      });
    }

    return { render, invalidate };
  }

  SW.socialView = { mount };
})();

</script>
<script>
/* ===== js/app.js ===== */
(function () {
  "use strict";

  const SW = window.SatWizz;
  SW.curriculum.build(); // every chapter file has registered by now
  const QUESTIONS = SW.questions;
  const THEMES = SW.themes;
  const PRONOUNS = SW.pronouns;
  const CHAPTERS = SW.chapters;
  const chapterById = SW.chapterById;
  const CORE_CHAPTERS = SW.CORE_CHAPTERS;
  const REVIEW_ID = "review"; // mixed review of completed chapters
  const SAVE_VERSION = 2;
  const auth = SW.auth;
  const onboarding = SW.onboarding;
  const sfx = SW.sfx;
  const rewards = SW.rewards;
  const RULES = rewards.RULES;
  const BY_ID = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));
  const STORE_KEY = "satwizz.v1";
  const LEGACY_STORE_KEY = "brainblast-sat.v1"; // pre-rebrand saves
  const SIGNUP_PROMPT_COMBO = 3;
  const GOALS = [5, 10, 20];
  const REVIEW_LENGTH = 2;

  // ---------- State ----------
  const DEFAULTS = {
    name: "",
    themeId: SW.defaultThemeId,
    castChosen: false,
    custom: {
      people: [
        { name: "", pro: "he" },
        { name: "", pro: "she" },
        { name: "", pro: "they" },
      ],
      place: "",
      craft: "",
      event: "",
    },
    goal: 5,
    xp: 0,
    combo: 0,
    bestCombo: 0,
    streak: 0,
    bestStreak: 0,
    lastDone: null, // date key of the last day the goal was met
    freezes: 0, // Aura Shields (synced as streak_freezes)
    days: {}, // dateKey -> { n, c, done, frozen }
    skills: {}, // skill -> { seen, right }
    missed: [], // question ids answered wrong and not yet fixed
    guest: false, // chose "Continue as Guest", so don't prompt again on a combo
    // curriculum
    chapterId: 1, // current chapter (1-10) or "review"
    unlockedChapters: [1],
    completedChapters: [],
    chapterCorrect: {}, // chapterId -> question ids answered correctly
    // gamification
    sparks: 0,
    focus: RULES.maxFocus, // refilled at the start of every session
    unlockedThemes: [],
    badges: [],
    title: null, // equipped badge id
    wager: null,
    totalCorrect: 0,
    comboSavers: 0,
    avatar: SW.defaultAvatarId,
    unlockedAvatars: [],
    // Vocab Vault spaced-repetition progress (see js/vocab.js)
    vocab: SW.vocab.emptyProgress(),
    // social
    username: "", // @handle, claimed on first sign-in
    displayName: "",
    lbScope: "global", // leaderboard tab: "global" | "friends"
    lbMetric: "xp", // rank by "xp" | "sparks"
    // settings
    muted: false,
    haptics: true,
    demo: false, // Demo Mode: everything unlocked, nothing synced
    // sync bookkeeping
    updatedAt: 0, // ms of the last change made on this device
    syncedUserId: null, // account this device last merged with
    v: SAVE_VERSION,
  };

  let S = load();

  function normalize(saved) {
    const s = { ...structuredClone(DEFAULTS), ...saved, custom: { ...DEFAULTS.custom, ...(saved.custom || {}) } };
    if (!Array.isArray(s.unlockedThemes)) s.unlockedThemes = [];
    if (!Array.isArray(s.badges)) s.badges = [];
    if (!Array.isArray(s.missed)) s.missed = [];
    if (!Array.isArray(s.unlockedAvatars)) s.unlockedAvatars = [];
    s.vocab = SW.vocab.mergeProgress(s.vocab, null); // fills defaults, drops unknown words
    if (!SW.avatars.some((a) => a.id === s.avatar)) s.avatar = SW.defaultAvatarId;
    // Saves from before Sparks existed: count correct answers from skill stats.
    if (typeof saved.totalCorrect !== "number") {
      s.totalCorrect = Object.values(s.skills || {}).reduce((n, k) => n + (k.right || 0), 0);
    }
    // Saves from before the curriculum: drop old question ids and filters.
    s.missed = s.missed.filter((id) => BY_ID[id]);
    delete s.filter;
    delete s.focusDay;
    const validChapter = (id) => Number.isInteger(id) && chapterById(id);
    s.unlockedChapters = [...new Set([1, ...(s.unlockedChapters || []).filter(validChapter)])];
    s.completedChapters = [...new Set((s.completedChapters || []).filter(validChapter))];
    if (!s.chapterCorrect || typeof s.chapterCorrect !== "object") s.chapterCorrect = {};
    if (s.chapterId !== REVIEW_ID && !s.unlockedChapters.includes(s.chapterId)) s.chapterId = 1;
    // Packs that used to be free stay free for anyone who played before v2,
    // and anyone already using a cast that became paid keeps it.
    if ((saved.v || 1) < SAVE_VERSION) {
      const played = (saved.xp || 0) > 0 || (saved.totalCorrect || 0) > 0 || Object.keys(saved.days || {}).length > 0;
      if (played) SW.legacyFreeThemes.forEach((id) => { if (!s.unlockedThemes.includes(id)) s.unlockedThemes.push(id); });
      s.v = SAVE_VERSION;
    }
    const current = THEMES.find((t) => t.id === s.themeId);
    if (current && current.price && !s.unlockedThemes.includes(current.id)) s.unlockedThemes.push(current.id);
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_STORE_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) { /* storage unavailable: start fresh */ }
    return structuredClone(DEFAULTS);
  }

  // touch=false for bookkeeping (day rollover) so a stale device doesn't look
  // newer than the cloud when merging. Demo Mode never reaches the cloud.
  function save(touch = true) {
    if (touch) S.updatedAt = Date.now();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
    if (!S.demo) auth.schedulePush(() => S);
  }

  // ---------- Dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayKey = () => keyOf(new Date());
  const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const dayDiff = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
  const today = () => (S.days[todayKey()] ||= { n: 0, c: 0 });

  // Missed days: spend Aura Shields if there are enough, otherwise the streak
  // (and any wager) is lost.
  function rollover() {
    const t = todayKey();
    let changed = false;
    if (S.lastDone && S.streak > 0) {
      const gap = dayDiff(S.lastDone, t);
      if (gap > 1) {
        const missedDays = gap - 1;
        if (S.freezes >= missedDays) {
          for (let i = 1; i <= missedDays; i++) {
            const k = addDays(S.lastDone, i);
            S.days[k] = { ...(S.days[k] || { n: 0, c: 0 }), frozen: true };
          }
          S.freezes -= missedDays;
          S.lastDone = addDays(t, -1);
          toast(`💠 ${missedDays === 1 ? "An Aura Shield" : missedDays + " Aura Shields"} saved your ${S.streak}-day streak`);
        } else {
          const lost = rewards.loseWager(S);
          toast(`Your ${S.streak}-day streak ended${lost ? ` and your ${lost.stake} ⚡ wager was lost` : ""}. Start a new one today.`);
          S.streak = 0;
        }
        changed = true;
      }
    }
    if (changed) save(false);
  }

  const doneToday = () => S.lastDone === todayKey();
  const atRisk = () => S.streak > 0 && !doneToday();

  // ---------- Personalization ----------
  function castOf(themeId = S.themeId) {
    if (themeId === "custom") {
      const fallback = THEMES[0];
      const c = S.custom;
      return {
        people: c.people.map((p, i) => ({ name: p.name.trim() || fallback.people[i].name, pro: p.pro })),
        place: c.place.trim() || fallback.place,
        craft: c.craft.trim() || fallback.craft,
        event: c.event.trim() || fallback.event,
      };
    }
    const t = THEMES.find((x) => x.id === themeId);
    return t && rewards.isThemeUnlocked(S, t.id) ? t : THEMES[0];
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

  // Swaps {{NAME_1}}, {{NAME_2_POSS}}, {{LOCATION}} etc. for the chosen cast.
  // Returns HTML; names are highlighted unless mark=false.
  const PLACEHOLDER = /\{\{(?:NAME_([123])(?:_(POSS|OBJ))?|(LOCATION|EVENT|SKILL))\}\}/g;
  function fill(template, cast = castOf(), mark = true) {
    return esc(template).replace(PLACEHOLDER, (m, n, form, flavorKey) => {
      if (n) {
        const p = cast.people[Number(n) - 1];
        if (form) return esc(PRONOUNS[p.pro][form === "POSS" ? "his" : "him"]);
        return mark ? `<span class="cast">${esc(p.name)}</span>` : esc(p.name);
      }
      const flavor = { LOCATION: cast.place, SKILL: cast.craft, EVENT: cast.event }[flavorKey];
      return flavor != null ? esc(flavor) : m;
    });
  }

  // Free casts first, then packs by price.
  const themesForPicker = () => THEMES.slice().sort((a, b) => (a.price || 0) - (b.price || 0));

  // A cast button for the welcome card and the Personalize view.
  function castButton(t, onPick) {
    const locked = !rewards.isThemeUnlocked(S, t.id);
    const sub = t.id === "custom" ? "Type any names you like" : t.people.map((p) => p.name).join(", ");
    const b = h("button", {
      class: `cast-btn${locked ? " locked" : ""}`,
      type: "button",
      "data-id": t.id,
      "aria-pressed": String(t.id === S.themeId),
    }, `<b>${esc(t.label)}</b><span>${locked ? `🔒 ${t.price} ⚡ in the Wizz Shop` : esc(sub)}</span>`);
    b.addEventListener("click", () => {
      if (locked) {
        show("shop");
        toast(`Unlock ${t.label} in the Wizz Shop for ${t.price} ⚡`);
        return;
      }
      onPick(t);
    });
    return b;
  }

  const currentAvatar = () => rewards.avatarById(S.avatar) || rewards.avatarById(SW.defaultAvatarId);

  // ---------- Question queue ----------
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // A chapter runs through a queue of its questions. Wrong answers go back
  // into the queue, so the chapter is complete once every question has been
  // answered correctly. Mixed review never runs out.
  let queue = []; // { id, isRetry }
  let served = 0;
  let lastId = null;
  let completeShown = false;

  const inReview = () => S.chapterId === REVIEW_ID;
  const currentChapter = () => (inReview() ? null : chapterById(S.chapterId));
  const correctIn = (chId) => (S.chapterCorrect[chId] ||= []);
  const isUnlocked = (chId) => S.unlockedChapters.includes(chId);
  const isComplete = (chId) => S.completedChapters.includes(chId);
  // Mixed review opens once any core chapter is complete.
  const reviewOpen = () => S.completedChapters.some((id) => !chapterById(id).bonus);

  function buildQueue() {
    const ch = currentChapter();
    if (ch) {
      const done = new Set(correctIn(ch.id));
      // In progress: only what's left. Replay of a finished chapter: everything.
      const ids = ch.questions.map((q) => q.id).filter((id) => isComplete(ch.id) || !done.has(id));
      queue = shuffle(ids).map((id) => ({ id, isRetry: false }));
    } else {
      queue = [];
    }
  }

  // Mixed review: missed questions first, then a shuffle of completed chapters.
  function refillReview() {
    const pool = QUESTIONS.filter((q) => isComplete(q.chapterId)).map((q) => q.id);
    const missed = shuffle(S.missed.filter((id) => pool.includes(id)));
    const rest = shuffle(pool.filter((id) => !missed.includes(id)));
    queue.push(...[...missed, ...rest].map((id) => ({ id, isRetry: false })));
    if (queue.length > 1 && queue[0].id === lastId) queue.push(queue.shift());
  }

  function nextQuestion() {
    if (inReview() && !queue.length) refillReview();
    const next = queue.shift();
    if (!next) return null;
    served++;
    lastId = next.id;
    return { q: BY_ID[next.id], isRetry: next.isRetry };
  }

  // Wrong answer: see it again two cards later (or at the end of a short queue).
  function requeue(id) {
    queue.splice(Math.min(2, queue.length), 0, { id, isRetry: true });
  }

  // ---------- DOM helpers ----------
  const $ = (sel, root = document) => root.querySelector(sel);
  const h = (tag, attrs = {}, html = "") => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    if (html) el.innerHTML = html;
    return el;
  };
  const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- App shell ----------
  const app = $("#app");
  app.innerHTML = `
    <header class="hud">
      <div class="brand" id="brand" aria-label="SatWizz">Sat<span>Wizz</span><em class="demo-badge" id="demo-badge" hidden>DEMO</em></div>
      <span class="pill flame" id="hud-streak" title="Day streak"></span>
      <button class="pill sparks" id="hud-sparks" type="button" title="Sparks. Spend them in the Wizz Shop"></button>
