<style>
/* ===== css/styles.css ===== */
/* SatWizz. Layout: one phone-shaped column. Sticky HUD on top, a vertical snap-scrolling
   question feed in the middle, tab bar at the bottom. */
:root {
  --bg: #eaeef8;
  --surface: #ffffff;
  --surface-2: #f4f6fc;
  --ink: #16213a;
  --muted: #5a6683;
  --line: #d6dcea;
  --volt: #3b4ff0;
  --volt-ink: #ffffff;
  --flame: #ff5f1a;
  --flame-2: #ffae00;
  --ice: #2aa6d8;
  --spark: #9a6412;
  --spark-bg: #fff4d6;
  --good: #16864c;
  --good-bg: #dbf4e6;
  --bad: #c9303f;
  --bad-bg: #fde3e6;
  --blank: #ffe597;
  --shadow: 0 1px 0 rgba(22, 33, 58, 0.06), 0 8px 24px -12px rgba(22, 33, 58, 0.25);
  --scrim: rgba(22, 33, 58, 0.55);

  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;

  /* Space kept clear at the bottom of every scroll area so the last button
     never sits under the tab bar (Tailwind pb-28 equivalent, plus the notch). */
  --nav-clearance: calc(7rem + env(safe-area-inset-bottom, 0px));

  --r: 18px;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322;
    --surface: #161f35;
    --surface-2: #1c2741;
    --ink: #eaf0ff;
    --muted: #9aa6c4;
    --line: #2a3553;
    --volt: #8193ff;
    --volt-ink: #0d1322;
    --flame: #ff7a33;
    --flame-2: #ffc23d;
    --ice: #5cc8f0;
    --spark: #ffcf4d;
    --spark-bg: #3a2f10;
    --good: #4fd394;
    --good-bg: #123424;
    --bad: #ff7383;
    --bad-bg: #3a1820;
    --blank: #5a4812;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 0, 0, 0.8);
    --scrim: rgba(3, 6, 14, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322;
  --surface: #161f35;
  --surface-2: #1c2741;
  --ink: #eaf0ff;
  --muted: #9aa6c4;
  --line: #2a3553;
  --volt: #8193ff;
  --volt-ink: #0d1322;
  --flame: #ff7a33;
  --flame-2: #ffc23d;
  --ice: #5cc8f0;
  --spark: #ffcf4d;
  --spark-bg: #3a2f10;
  --good: #4fd394;
  --good-bg: #123424;
  --bad: #ff7383;
  --bad-bg: #3a1820;
  --blank: #5a4812;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 10px 28px -14px rgba(0, 0, 0, 0.8);
  --scrim: rgba(3, 6, 14, 0.7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
[hidden] { display: none !important; }

#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  display: flex;
  flex-direction: column;
}

/* ---------- HUD ---------- */
.hud {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 12px 8px;
}
.brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.3rem;
  letter-spacing: -0.03em;
  margin-right: auto;
  white-space: nowrap;
}
.brand span { color: var(--volt); }
.acct {
  flex: none;
  height: 32px;
  min-width: 32px;
  padding: 0 10px;
  border-radius: 999px;
  border: none;
  background: var(--volt);
  color: var(--volt-ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
}

/* ---------- Avatars ---------- */
.avatar {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-2);
  border: 2px solid var(--line);
  line-height: 1;
  padding: 0;
}
.avatar.sm { width: 34px; height: 34px; font-size: 1.15rem; }
.avatar.md { width: 44px; height: 44px; font-size: 1.4rem; }
.avatar.lg { width: 72px; height: 72px; font-size: 2.4rem; border-width: 3px; border-color: var(--volt); }
button.avatar:hover { border-color: var(--volt); }
.sync-dot {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid var(--bg);
  background: var(--good);
}
.sync-dot[data-status="pending"], .sync-dot[data-status="syncing"] { background: var(--flame-2); }
.sync-dot[data-status="error"] { background: var(--bad); }

.profile-head { display: flex; align-items: center; gap: 14px; }
.profile-meta { display: grid; gap: 4px; min-width: 0; justify-items: start; }
.profile-meta h2 { margin: 0; }
.profile-meta .title-chip { margin: 0; }
.avatar-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.avatar-pick {
  aspect-ratio: 1;
  max-width: 100%;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--surface);
  padding: 2px;
}
.avatar-pick .emoji { font-size: 1.5rem; line-height: 1; }
.avatar-pick small { font-size: 0.65rem; font-weight: 700; color: var(--spark); font-variant-numeric: tabular-nums; white-space: nowrap; }
.avatar-pick.locked .emoji { filter: grayscale(0.85); opacity: 0.55; }
.avatar-pick.locked { border-style: dashed; }
.avatar-pick.confirm { border-color: var(--good); border-style: solid; }
.avatar-pick.confirm small { color: var(--good); }
.avatar-pick[aria-pressed="true"] { border-color: var(--volt); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--volt); }
.shop-icon sup { font-size: 0.6rem; font-weight: 800; color: var(--spark); }
@media (max-width: 420px) {
  .avatar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-family: var(--font-display);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pill.flame { color: var(--flame); }
.pill.flame.cold { color: var(--muted); }
.pill.flame .risk { font-size: 0.9em; }
.pill.sparks { color: var(--spark); cursor: pointer; }
.pill.sparks:hover { border-color: var(--spark); }
.pill.bump { animation: bump 0.45s ease; }
@keyframes bump { 40% { transform: scale(1.25); } }

.goalbar {
  height: 8px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.goalbar > i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--flame-2), var(--flame));
  transition: width 0.4s ease;
}
.goalnote {
  display: flex;
  flex-wrap: wrap;
  column-gap: 12px;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--muted);
  padding-block: 4px 8px;
  font-variant-numeric: tabular-nums;
}

/* Focus + combo row above the feed */
.focusbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 0 8px;
  min-height: 36px;
}
.focusbar .combo {
  margin-left: auto;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.focusbar .combo.hot { background: var(--volt); border-color: var(--volt); color: var(--volt-ink); }
.focusbar .combo.bump { animation: bump 0.45s ease; }
.mini-btn {
  padding: 5px 10px;
  border-radius: 999px;
  border: 2px solid var(--volt);
  background: transparent;
  color: var(--volt);
  font-weight: 700;
  font-size: 0.8rem;
  white-space: nowrap;
}
.mini-btn.on { background: var(--volt); color: var(--volt-ink); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Current chapter, above the feed; opens the chapter drawer */
.chapter-bar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-block: 0 10px;
  padding: 8px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  text-align: left;
  min-width: 0;
}
.chapter-bar:hover { border-color: var(--volt); }
.ch-num {
  flex: none;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--volt);
  color: var(--volt-ink);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.75rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.ch-title {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ch-count { flex: none; font-size: 0.8rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch-caret { flex: none; color: var(--muted); }

/* ---------- Views ---------- */
/* position: relative keeps absolutely positioned bits (e.g. .sr-only labels)
   inside each scroll area instead of stretching the page. */
.view { flex: 1; min-height: 0; position: relative; }
.feed {
  overflow-y: auto;
  padding-bottom: var(--nav-clearance);
  scroll-padding-bottom: var(--nav-clearance);
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  scrollbar-width: none;
  border-radius: var(--r);
}
.feed::-webkit-scrollbar { display: none; }
.scrollview { overflow-y: auto; padding-block: 4px var(--nav-clearance); }

/* ---------- Question card ---------- */
.card {
  min-height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  padding-block: 4px 16px;
  display: flex;
}
.card-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px 18px 16px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: var(--muted);
}
.domain {
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--ink);
}
.meta .num { margin-left: auto; font-variant-numeric: tabular-nums; }
.retry-tag { color: var(--bad); }

.passage {
  font-size: 1.15rem;
  line-height: 1.65;
  margin: 0;
  text-wrap: pretty;
}
.cast { font-weight: 700; color: var(--volt); }
.blank {
  display: inline-block;
  min-width: 4.5em;
  border-bottom: 3px solid var(--ink);
  height: 1.1em;
  vertical-align: -0.1em;
}
.blank.filled {
  min-width: 0;
  height: auto;
  border-bottom: none;
  background: var(--blank);
  padding: 0 4px;
  border-radius: 4px;
  font-weight: 700;
  vertical-align: baseline;
}
.prompt { margin: 0; font-size: 0.9rem; color: var(--muted); }

/* ---------- Digital SAT (Bluebook-style) question card ---------- */
.bb-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bb-num {
  flex: none;
  min-width: 30px;
  height: 30px;
  padding: 0 8px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}
.bb-meta {
  min-width: 0;
  flex: 1;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bb-passage {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--ink);
  border-radius: 4px 12px 12px 4px;
  background: var(--surface-2);
}
.bb-passage .passage { font-size: 1.05rem; line-height: 1.7; }
.bb-passage .blank { min-width: 5em; border-bottom-width: 2px; }
u.target { text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 600; }
.bb-stem { margin: 0; font-size: 0.98rem; font-weight: 600; line-height: 1.45; }
.bb .choice { border-radius: 10px; border-bottom-width: 2px; }
.bb .choice:active:not(:disabled) { transform: none; margin-top: 0; border-bottom-width: 2px; }
.bb .choice .letter { border-radius: 50%; }

.choices { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.choice {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  background: var(--surface);
  font-size: 1rem;
  transition: transform 0.08s ease, border-color 0.15s ease;
}
.choice:hover:not(:disabled) { border-color: var(--volt); }
.choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; margin-top: 2px; }
.choice .letter {
  flex: none;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 2px solid var(--line);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--muted);
}
.choice .txt { min-width: 0; overflow-wrap: anywhere; }
.choice:disabled { cursor: default; }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.right .letter { border-color: var(--good); background: var(--good); color: var(--surface); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice.wrong .letter { border-color: var(--bad); background: var(--bad); color: var(--surface); }
.choice.dim { opacity: 0.55; }

.feedback {
  border-radius: 14px;
  padding: 12px 14px;
  display: grid;
  gap: 6px;
  animation: rise 0.25s ease;
}
.feedback.ok { background: var(--good-bg); }
.feedback.no { background: var(--bad-bg); }
.feedback h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 600;
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.feedback.ok h3 { color: var(--good); }
.feedback.no h3 { color: var(--bad); }
.feedback h3 small { font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; margin-left: auto; }
.feedback p { margin: 0; font-size: 0.95rem; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 12px 18px;
  border-radius: 14px;
  border: none;
  border-bottom: 4px solid rgba(0, 0, 0, 0.22);
  background: var(--volt);
  color: var(--volt-ink);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: 0.01em;
}
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn.danger { background: var(--bad); color: var(--surface); }
.btn.wide { width: 100%; }
.next-row { margin-top: auto; }

/* Welcome / personalize card at the top of the feed */
.hello h2, .panel h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.6rem;
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}
.hello p { margin: 0; color: var(--muted); }
.cast-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cast-btn {
  text-align: left;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--surface);
  display: grid;
  gap: 2px;
  min-width: 0;
}
.cast-btn b { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.cast-btn span { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.cast-btn.locked { border-style: dashed; }
.cast-btn.locked b { color: var(--muted); }
.cast-btn[aria-pressed="true"] { border-color: var(--volt); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--volt); }
.scroll-hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: auto; }

/* ---------- Explanation Pause (chapter lesson card) ---------- */
.pause-card { background: var(--surface); border-color: var(--volt); border-width: 2px; }
.pause-card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.45rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.pause-summary { margin: 0; font-size: 1.02rem; }
.rule-list { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 0.95rem; }
.rule-list li::marker { color: var(--volt); }
.patterns { display: flex; flex-wrap: wrap; gap: 6px; }
.pattern {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 8px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.8rem;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.pattern.ok { background: var(--good-bg); color: var(--good); }
.pattern.no { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1px; }
.pattern.no b { text-decoration: none; }
.pause-example {
  margin: 0;
  display: grid;
  gap: 4px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 0.95rem;
}

/* ---------- Chapter complete ---------- */
.complete-card { text-align: center; justify-content: center; }
.complete-card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.complete-card p { margin: 0; color: var(--muted); }
.complete-star { font-size: 3.4rem; line-height: 1; animation: bump 0.6s ease; }

/* ---------- Chapter drawer ---------- */
.chapter-list { display: grid; gap: 8px; }
.chapter-row {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  text-align: left;
}
.chapter-row:hover:not(:disabled) { border-color: var(--volt); }
.chapter-row:disabled { cursor: default; opacity: 0.6; }
.chapter-row.current { border: 2px solid var(--volt); background: var(--surface-2); }
.ch-status {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-2);
  font-weight: 800;
  color: var(--muted);
}
.chapter-row.done .ch-status { background: var(--good); color: var(--surface); }
.chapter-row.current .ch-status { background: var(--volt); color: var(--volt-ink); }
.ch-info { display: grid; gap: 3px; min-width: 0; }
.ch-info b { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; }
.ch-info small { font-size: 0.78rem; color: var(--muted); }
.ch-info .bar { display: block; height: 6px; }

/* ---------- Streak view ---------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  display: grid;
  gap: 12px;
}
.stack { display: grid; gap: 12px; }
.flame-hero { text-align: center; padding-block: 12px; }
.flame-hero .big {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 4.5rem;
  line-height: 1;
  color: var(--flame);
  font-variant-numeric: tabular-nums;
}
.flame-hero .big.cold { color: var(--muted); }
.flame-hero .emoji { font-size: 3rem; line-height: 1; display: block; }
.flame-hero .label { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
.flame-hero .status { color: var(--muted); margin: 6px 0 0; }
.flame-hero .status.warn { color: var(--flame); font-weight: 700; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
.week .d { display: grid; gap: 4px; justify-items: center; font-size: 0.75rem; color: var(--muted); font-weight: 700; }
.week .dot {
  width: 36px;
  height: 36px;
  max-width: 100%;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 2px dashed var(--line);
  font-size: 1.05rem;
}
.week .dot.done { border: none; background: linear-gradient(160deg, var(--flame-2), var(--flame)); }
.week .dot.frozen { border: none; background: var(--ice); }
.week .today .dot { border-style: solid; border-color: var(--flame); }
.week .today { color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8rem; color: var(--muted); }
.freeze-row { display: flex; align-items: center; gap: 12px; }
.freeze-row .ice { font-size: 1.6rem; letter-spacing: 2px; }
.freeze-row p { margin: 0; font-size: 0.9rem; color: var(--muted); }
.freeze-row p b { color: var(--ink); }

.subtabs button[aria-selected="true"] { border-color: var(--volt); color: var(--volt); background: var(--surface); }
.subtabs .count { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.title-chip {
  display: inline-block;
  justify-self: center;
  margin-bottom: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-weight: 700;
  font-size: 0.85rem;
}

/* ---------- Achievements ---------- */
.badge-list { display: grid; gap: 10px; }
.badge {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 14px;
  background: var(--surface-2);
}
.badge-icon {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: 1.6rem;
  background: var(--spark-bg);
}
.badge.locked .badge-icon { background: var(--line); font-size: 1.2rem; }
.badge-info { display: grid; gap: 4px; min-width: 0; }
.badge-info b { font-family: var(--font-display); font-weight: 700; }
.badge-info span { font-size: 0.85rem; color: var(--muted); }
.badge-info small { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge-info .bar i { background: var(--spark); }

/* ---------- Wizz Shop ---------- */
.wallet { background: var(--spark-bg); border-color: transparent; }
.wallet-num {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.6rem;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--spark);
  font-variant-numeric: tabular-nums;
}
.wallet-num small { font-size: 1rem; font-weight: 700; letter-spacing: 0; }
.earn-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 0.9rem; }
.earn-list b { display: inline-block; min-width: 3ch; color: var(--spark); font-variant-numeric: tabular-nums; }
.shop-list { display: grid; gap: 10px; }
.shop-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
}
.shop-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 1.4rem;
}
.shop-info { display: grid; gap: 4px; min-width: 0; }
.shop-info b { font-family: var(--font-display); font-weight: 700; }
.shop-info span { font-size: 0.85rem; color: var(--muted); }
.shop-info small { font-size: 0.75rem; color: var(--muted); }
.shop-info .bar i { background: var(--spark); }
.buy {
  min-width: 84px;
  padding: 8px 12px;
  border-radius: 12px;
  border: none;
  border-bottom: 3px solid rgba(0, 0, 0, 0.2);
  background: var(--spark);
  color: var(--surface);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.9rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.buy.confirm { background: var(--good); }
.buy.owned { background: var(--volt); color: var(--volt-ink); }
.buy:disabled { background: var(--line); color: var(--muted); border-bottom-color: transparent; cursor: default; }
@media (max-width: 380px) {
  .shop-item, .badge { grid-template-columns: auto minmax(0, 1fr); }
  .shop-item .buy, .badge .mini-btn { grid-column: 1 / -1; justify-self: end; }
}

/* ---------- You view ---------- */
.field { display: grid; gap: 6px; }
.field label, .label-sm {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.input, .select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--surface-2);
  min-width: 0;
}
.input:focus, .select:focus { border-color: var(--volt); outline: none; }
.person-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1;
  padding: 8px 10px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: transparent;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { border-color: var(--volt); color: var(--volt); }
.preview {
  margin: 0;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 1rem;
}
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; gap: 4px; }
.bar-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
.bar-row .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: inherit; }
.bar i.mid { background: var(--flame-2); }
.bar i.low { background: var(--bad); }
.muted { color: var(--muted); margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Tab bar ---------- */
.tabs {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 2px;
  padding-block: 8px 10px;
}
.tab {
  display: grid;
  justify-items: center;
  gap: 0;
  padding: 6px 2px;
  border-radius: 12px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 700;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tab .ico { font-size: 1.3rem; line-height: 1.2; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); }
/* Long labels swap to a short form on phones so five tabs fit without truncation. */
.tab .lbl-short { display: none; }
@media (max-width: 440px) {
  .tab .lbl-long { display: none; }
  .tab .lbl-short { display: inline; }
}

/* ---------- Vocab Vault ---------- */
.small { font-size: 0.8rem; }
.vault-hero h2 { margin: 0; }
.tier-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tier-tile {
  display: grid;
  gap: 2px;
  justify-items: center;
  padding: 10px 6px;
  border-radius: 14px;
  background: var(--surface-2);
  text-align: center;
}
.tier-tile b { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tier-tile span { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.tier-tile.t1 b { color: var(--good); }
.tier-tile.t2 b { color: var(--spark); }
.tier-tile.t3 b { color: var(--volt); }
.tier {
  flex: none;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 800;
  white-space: nowrap;
  background: var(--surface-2);
}
.tier.t1 { color: var(--good); background: var(--good-bg); }
.tier.t2 { color: var(--spark); background: var(--spark-bg); }
.tier.t3 { color: var(--volt-ink); background: var(--volt); }
.word-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.word-list details { padding: 8px 12px; border-radius: 12px; background: var(--surface-2); }
.word-list summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; }
.word-list summary::-webkit-details-marker { display: none; }
.word-list summary small { color: var(--muted); font-style: italic; }
.word-list details p { margin: 6px 0 0; }
.sprint-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sprint-dots { display: flex; gap: 6px; }
.sprint-dots i { width: 22px; height: 8px; border-radius: 999px; background: var(--line); }
.sprint-dots i.now { background: var(--volt); }
.sprint-dots i.ok { background: var(--good); }
.sprint-dots i.no { background: var(--bad); }
.vocab-card { flex: none; }
.vx-def { margin: 0; font-size: 1.02rem; font-weight: 600; }
.vx-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.vx-box { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.vx-box p { margin: 0; font-size: 0.9rem; }
@media (max-width: 420px) { .vx-grid { grid-template-columns: 1fr; } }
.sprint-summary { text-align: center; justify-items: center; }
.sprint-summary .stack { width: 100%; }
.sum-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; text-align: left; }
.sum-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; }
.sum-row.ok { background: var(--good-bg); }
.sum-row.ok > span:first-child { color: var(--good); font-weight: 900; }
.sum-row.no { background: var(--bad-bg); }
.sum-row.no > span:first-child { color: var(--bad); font-weight: 900; }
.sum-row .muted { text-align: right; }

/* ---------- Demo Mode badge ---------- */
.brand { position: relative; cursor: default; user-select: none; -webkit-user-select: none; }
.demo-badge {
  position: absolute;
  top: -8px;
  right: -14px;
  padding: 1px 5px;
  border-radius: 6px;
  background: var(--flame);
  color: var(--surface);
  font-style: normal;
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  vertical-align: middle;
}

/* ---------- Lock In alert banner ---------- */
.alert-slot { display: grid; gap: 6px; }
.alert-slot:empty { display: none; }
.alert-banner {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--ink);
  color: var(--bg);
  animation: rise 0.3s ease;
}
.alert-banner p { margin: 0; font-size: 0.88rem; font-weight: 600; }
.alert-banner .mini-btn { border-color: var(--flame-2); background: var(--flame-2); color: var(--ink); }
.alert-icon { font-size: 1.3rem; }
.alert-x { border: none; background: transparent; color: var(--bg); font-size: 1rem; padding: 4px; opacity: 0.7; }

/* ---------- Ranks (leaderboards & friends) ---------- */
.ranks-view { padding-block-end: 0; }
.ranks { padding-bottom: 16px; }
.metric-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg.small button { flex: none; padding: 5px 12px; font-size: 0.85rem; }
.skeleton { min-height: 120px; }
.ranks-cta { text-align: center; justify-items: center; }
.cta-emoji { font-size: 2.6rem; line-height: 1; }
.lb-list, .friend-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lb-row, .friend-row, .rank-bar {
  display: grid;
  grid-template-columns: 38px auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 14px;
  background: var(--surface-2);
}
.lb-row.top .lb-rank { font-size: 1.35rem; }
.lb-row.me { outline: 2px solid var(--volt); background: var(--surface); }
.lb-rank {
  text-align: center;
  font-family: var(--font-display);
  font-weight: 800;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.lb-name { display: grid; min-width: 0; }
.lb-name b { font-family: var(--font-display); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-name small { color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-value { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lb-value small { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
.friend-row { grid-template-columns: auto minmax(0, 1fr) auto auto; }
.friend-row.idle .avatar { filter: grayscale(0.7); opacity: 0.8; }
.fstreak { font-family: var(--font-display); font-weight: 800; color: var(--flame); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fstreak.cold { color: var(--muted); }
.lock-btn {
  padding: 6px 10px;
  border-radius: 999px;
  border: none;
  border-bottom: 3px solid rgba(0, 0, 0, 0.2);
  background: var(--flame);
  color: var(--surface);
  font-weight: 800;
  font-size: 0.8rem;
  white-space: nowrap;
}
.lock-btn:disabled { background: var(--line); color: var(--muted); border-bottom-color: transparent; }
.search-row, .handle-row { display: flex; gap: 8px; align-items: center; }
.search-row .input, .handle-row .input { flex: 1; }
.handle-row .at { font-weight: 800; color: var(--muted); }
.invite { display: grid; gap: 8px; }
.invite-link {
  display: block;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-2);
  font-size: 0.8rem;
  overflow-wrap: anywhere;
  user-select: all;
}
.push-card { display: grid; gap: 8px; }
.push-card:empty { display: none; }
/* Sticky "Your Rank" bar at the bottom of the Ranks view */
.rank-bar {
  position: sticky;
  bottom: 0;
  margin-top: 8px;
  background: var(--volt);
  color: var(--volt-ink);
  box-shadow: var(--shadow);
}
.rank-bar:empty { display: none; }
.rank-bar .lb-rank, .rank-bar .lb-name small, .rank-bar .lb-value small { color: inherit; opacity: 0.85; }
.rank-bar .avatar { border-color: transparent; }

/* ---------- Settings ---------- */
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-2);
  font-weight: 600;
}
.toggle input { order: 2; width: 44px; height: 24px; accent-color: var(--volt); }
#set-push { display: grid; gap: 8px; }

/* ---------- Slide-up explanation drawer ---------- */
.explain-backdrop { z-index: 36; }
.sheet.explain { gap: 12px; }
.explain-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.explain-head h2 { margin: 0; }
.explain-head small { color: var(--muted); font-weight: 700; font-size: 0.82rem; }
.verdict-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-weight: 900;
  font-size: 1.2rem;
  color: var(--surface);
}
.explain.ok .verdict-icon { background: var(--good); }
.explain.no .verdict-icon { background: var(--bad); }
.explain.ok .explain-head h2 { color: var(--good); }
.explain.no .explain-head h2 { color: var(--bad); }
.explain-sentence { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: 1rem; line-height: 1.6; }
.fill-in { background: var(--blank); color: var(--ink); padding: 0 4px; border-radius: 4px; font-weight: 700; }
.shortcut-chip { margin: 0; padding: 8px 12px; border-radius: 12px; background: var(--spark-bg); font-size: 0.88rem; }
.shortcut-chip b { color: var(--spark); margin-right: 4px; }
.why-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.why-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--line);
}
.why-row .letter {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 2px solid var(--line);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--muted);
}
.why-row.right { border-color: var(--good); background: var(--good-bg); }
.why-row.right .letter { background: var(--good); border-color: var(--good); color: var(--surface); }
.why-row.wrong { border-color: var(--bad); background: var(--bad-bg); }
.why-row.wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.why-body { min-width: 0; display: grid; gap: 2px; }
.why-body b { overflow-wrap: anywhere; }
.why-body p { margin: 0; font-size: 0.9rem; color: var(--ink); }
.why-tag { justify-self: start; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.why-row.right .why-tag { color: var(--good); }
.why-row.wrong .why-tag { color: var(--bad); }
.why-btn { justify-self: start; padding: 2px 0; }

.disclaimer {
  font-size: 0.7rem;
  line-height: 1.35;
  color: var(--muted);
  text-align: center;
  padding-block: 0 8px;
  text-wrap: balance;
}

/* ---------- Account ---------- */
.email { color: var(--ink); overflow-wrap: anywhere; }
.sync-line { margin: 0; font-size: 0.9rem; font-weight: 600; color: var(--good); }
.sync-line[data-status="error"] { color: var(--bad); }
.sync-line[data-status="pending"], .sync-line[data-status="syncing"] { color: var(--muted); }

/* ---------- Sign-up modal ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--scrim);
  overflow-y: auto;
  animation: fade 0.2s ease;
}
.modal {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px 20px 18px;
  display: grid;
  gap: 12px;
  box-shadow: var(--shadow);
  animation: rise 0.25s ease;
}
.modal h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.5rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.modal-brand {
  font-family: var(--font-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  font-size: 1rem;
}
.modal-brand span { color: var(--volt); }
.notice {
  margin: 0;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px dashed var(--line);
  font-size: 0.85rem;
  color: var(--muted);
}
.btn.google {
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  gap: 10px;
}
.btn:disabled { opacity: 0.6; cursor: default; }
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.auth-tabs button[aria-selected="true"] { border-color: var(--volt); color: var(--volt); background: var(--surface-2); }
.form-msg { margin: 0; font-size: 0.85rem; font-weight: 600; color: var(--bad); min-height: 0; }
.form-msg:empty { display: none; }
.form-msg[data-kind="info"] { color: var(--good); }
.linkbtn {
  justify-self: center;
  background: none;
  border: none;
  padding: 6px 8px;
  color: var(--volt);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.fine { margin: 0; text-align: center; font-size: 0.75rem; color: var(--muted); }
@keyframes fade { from { opacity: 0; } }

/* ---------- Focus Break drawer ---------- */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 35;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: var(--scrim);
  animation: fade 0.2s ease;
}
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 92%;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  display: grid;
  gap: 12px;
  box-shadow: var(--shadow);
  animation: slide-up 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
}
@keyframes slide-up { from { transform: translateY(40%); opacity: 0.4; } }
.grabber { justify-self: center; width: 44px; height: 5px; border-radius: 999px; background: var(--line); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.45rem;
  line-height: 1.15;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.tip-card {
  display: grid;
  gap: 8px;
  padding: 16px;
  border-radius: 16px;
  background: var(--spark-bg);
}
.tip-text { margin: 0; font-size: 1.05rem; line-height: 1.55; }
.tip-ex {
  margin: 0;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface);
  font-size: 0.9rem;
  font-weight: 600;
}
.sheet .card { min-height: 0; padding: 0; scroll-snap-align: none; }
.tip-card .rule-list { font-size: 0.95rem; }
.sheet .card-inner { box-shadow: none; }
.restored { text-align: center; display: grid; gap: 6px; padding-block: 12px; }
.restored-shields { font-size: 2.4rem; letter-spacing: 4px; animation: bump 0.6s ease; }

/* ---------- Celebrations & toasts ---------- */
.burst {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  z-index: 50; /* above drawers (35-36) and the sign-in modal (40) */
}
.burst-card {
  text-align: center;
  background: var(--surface);
  border: 2px solid var(--flame);
  border-radius: 24px;
  padding: 20px 28px;
  box-shadow: var(--shadow);
  animation: pop 1.9s ease forwards;
  max-width: calc(100% - 32px);
}
.burst-card .e { font-size: 3.2rem; line-height: 1; display: block; }
.burst-card b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--flame); }
.burst-card span { color: var(--muted); font-weight: 700; }
@keyframes pop {
  0% { transform: scale(0.6); opacity: 0; }
  15% { transform: scale(1.06); opacity: 1; }
  25% { transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-12px); }
}
.confetti {
  position: fixed;
  top: 40%;
  left: 50%;
  width: 10px;
  height: 14px;
  border-radius: 3px;
  z-index: 49;
  pointer-events: none;
  animation: fly 1.3s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
@keyframes fly {
  to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.9rem;
  z-index: 60;
  max-width: calc(100% - 32px);
  text-align: center;
  animation: rise 0.25s ease;
}

/* ---------- Vocab Vault: modes + flashcards ---------- */
.mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode-btn {
  display: grid;
  justify-items: start;
  gap: 2px;
  padding: 14px;
  border-radius: 16px;
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  background: var(--surface-2);
  color: var(--ink);
  text-align: left;
  font: inherit;
  cursor: pointer;
  min-width: 0;
}
.mode-btn b { font-family: var(--font-display); font-size: 1rem; }
.mode-btn small { color: var(--muted); font-size: 0.75rem; font-weight: 600; }
.mode-btn .mode-ico { font-size: 1.5rem; line-height: 1.2; }
.mode-btn.primary { background: var(--volt); border-color: var(--volt); color: var(--volt-ink); }
.mode-btn.primary small { color: inherit; opacity: 0.85; }
.mode-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

.fc-flag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--flame);
  background: var(--spark-bg);
}
.fc-stage { perspective: 1400px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.fc-drag { position: relative; transition: transform 0.25s ease; will-change: transform; --got: 0; --later: 0; }
.fc-drag.dragging { transition: none; }
.fc-drag.fly-right { transform: translateX(130%) rotate(16deg); opacity: 0; transition: transform 0.24s ease-in, opacity 0.24s ease-in; }
.fc-drag.fly-left { transform: translateX(-130%) rotate(-16deg); opacity: 0; transition: transform 0.24s ease-in, opacity 0.24s ease-in; }
.fc-stamp {
  position: absolute;
  top: 18px;
  z-index: 2;
  padding: 4px 12px;
  border: 3px solid currentColor;
  border-radius: 10px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.1rem;
  background: var(--surface);
  pointer-events: none;
}
.fc-stamp.got { left: 16px; color: var(--good); opacity: var(--got); transform: rotate(-10deg); }
.fc-stamp.later { right: 16px; color: var(--flame); opacity: var(--later); transform: rotate(10deg); }
.fc {
  display: block;
  width: 100%;
  padding: 0;
  border: none;
  background: none;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  border-radius: 22px;
}
.fc:focus-visible { outline: 3px solid var(--volt); outline-offset: 4px; }
.fc-inner {
  position: relative;
  display: block;
  height: clamp(250px, calc(100vh - 360px), 440px); /* leaves room for the buttons above the nav */
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.fc.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 22px 20px;
  border-radius: 22px;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
  overflow-y: auto;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.fc-front { background: linear-gradient(160deg, var(--surface) 55%, var(--surface-2)); }
.fc-back { transform: rotateY(180deg); }
.fc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fc-word {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2rem, 9vw, 2.6rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.fc-word.sm { font-size: 1.5rem; }
.fc-pos { color: var(--muted); font-style: italic; font-weight: 600; }
.fc-context {
  margin-top: auto;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  border-left: 4px solid var(--volt);
  font-size: 0.95rem;
  line-height: 1.5;
}
.fc-hl { background: var(--blank); color: var(--ink); padding: 0 3px; border-radius: 4px; }
.fc-hint { align-self: center; color: var(--muted); font-size: 0.8rem; font-weight: 700; }
.fc-def { font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
.fc-row { display: grid; gap: 2px; font-size: 0.92rem; line-height: 1.4; }
.fc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fc-actions .btn { padding-inline: 10px; white-space: nowrap; }
.fc-actions .btn small { font-weight: 700; opacity: 0.85; }
.fc-help { text-align: center; }
@media (hover: none) { .kbd-hint { display: none; } }

/* ---------- Vocab Derby ---------- */
.derby-btn {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  width: 100%;
  background: linear-gradient(135deg, var(--good-bg), var(--surface-2));
}
.derby-btn span { display: grid; gap: 2px; }
.pill-sm { padding: 2px 10px; border-radius: 999px; background: var(--spark-bg); color: var(--spark); font-weight: 800; font-variant-numeric: tabular-nums; }

.wager-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.wchip {
  display: grid;
  justify-items: center;
  gap: 1px;
  padding: 10px 4px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  min-width: 0;
}
.wchip b { font-family: var(--font-display); font-size: 0.95rem; white-space: nowrap; }
.wchip small { color: var(--muted); font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
.wchip[aria-checked="true"] { border-color: var(--volt); background: var(--surface); box-shadow: 0 0 0 2px var(--volt) inset; }
.wchip:disabled { opacity: 0.45; cursor: not-allowed; }

.silk-volt { --silk: var(--volt); }
.silk-flame { --silk: var(--flame); }
.silk-good { --silk: var(--good); }
.silk-bad { --silk: var(--bad); }
.silk-spark { --silk: var(--flame-2); }
.silk-ice { --silk: var(--ice); }
.silk-dot {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 1.3rem;
  height: 1.3rem;
  border-radius: 50%;
  background: var(--silk);
  color: #fff;
  font-style: normal;
  font-size: 0.72rem;
  font-weight: 800;
}

.track {
  list-style: none;
  margin: 0;
  padding: 8px;
  display: grid;
  gap: 4px;
  border-radius: 16px;
  background: var(--good-bg);
}
.lane {
  display: grid;
  grid-template-columns: minmax(0, 8.5rem) minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  border-radius: 10px;
}
.lane.you { background: var(--surface); box-shadow: 0 0 0 2px var(--volt) inset; }
.lane-name { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 0.78rem; font-weight: 700; }
.lane-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-track {
  position: relative;
  height: 2rem;
  border-bottom: 2px dashed color-mix(in srgb, var(--good) 45%, transparent);
  /* five step ticks */
  background-image: linear-gradient(to right, color-mix(in srgb, var(--good) 30%, transparent) 1px, transparent 1px);
  background-size: calc((100% - 1.8rem) / 5) 100%;
  background-repeat: repeat-x;
}
.lane-track::after { /* checkered finish line */
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 6px;
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0 / 6px 6px;
  opacity: 0.8;
}
.lane-horse {
  position: absolute;
  left: calc((100% - 1.8rem) * var(--p) / 5);
  bottom: 0;
  width: 1.8rem;
  font-size: 1.45rem;
  line-height: 2rem;
  text-align: center;
  transform: scaleX(-1); /* face the finish line */
  transition: left 0.7s cubic-bezier(0.3, 1.3, 0.5, 1);
}
.lane.moved .lane-horse { animation: hop 0.45s ease 0.1s; }
@keyframes hop {
  0%, 100% { translate: 0 0; }
  40% { translate: 0 -6px; }
}
.lane-pos { font-size: 0.75rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.track-note { margin: 6px 2px 0; }
.nm-short { display: none; }
@media (max-width: 440px) {
  .nm-long { display: none; }
  .nm-short { display: inline; }
  .lane { grid-template-columns: minmax(0, 5.6rem) minmax(0, 1fr) auto; }
}
/* In a race the lanes tighten so the track and question share the screen. */
.track.compact { gap: 2px; padding: 6px; }
.track.compact .lane { padding-block: 1px; }
.track.compact .lane-track { height: 1.6rem; }
.track.compact .lane-horse { font-size: 1.2rem; line-height: 1.6rem; }
#derby-next-slot:empty { display: none; }
.track-panel { padding: 10px; gap: 6px; }
.race-call { margin: 2px 4px 0; font-weight: 700; min-height: 1.4em; }

.derby-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center; gap: 4px; }
.derby-stats div { display: grid; gap: 2px; }
.derby-stats b { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.derby-stats span { font-size: 0.7rem; font-weight: 700; color: var(--muted); }
.derby-payout { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.derby-payout.ok { color: var(--good); }
.derby-payout.no { color: var(--bad); }
.standings { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; text-align: left; }
.standings li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); font-weight: 700; }
.standings li.you { box-shadow: 0 0 0 2px var(--volt) inset; }
.standings li .muted { margin-left: auto; }
@media (max-width: 380px) {
  .lane { grid-template-columns: minmax(0, 5.2rem) minmax(0, 1fr) auto; gap: 6px; padding-inline: 4px; }
  .lane-name { font-size: 0.72rem; }
  .wager-chips { gap: 6px; }
}

/* ---------- Vocab Derby v2: intro, Focus, Stable, review ---------- */
.silk-plum { --silk: #8a3ffc; }
.silk-slate { --silk: #5a6683; }
.silk-gold { --silk: #c99700; }
.silk-ink { --silk: #2b2d7c; }
.silk-crimson { --silk: #b0122e; }
.silk-emerald { --silk: #0f8a5f; }
.lane.you { box-shadow: 0 0 0 2px var(--silk) inset; }
.silk-dot.big { width: 2.2rem; height: 2.2rem; font-size: 1rem; }
.shop-icon.mount { font-size: 1.8rem; }
.derby-banner {
  margin: 0;
  padding: 10px 6px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--bg);
  font: 700 clamp(0.72rem, 3.4vw, 0.95rem) / 1.35 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  text-align: center;
  white-space: pre;
  overflow: hidden;
}
.center { text-align: center; }
.rule-list { margin: 0; padding-left: 1.2rem; display: grid; gap: 8px; line-height: 1.45; }
.intro-focus, .setup-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-weight: 700; }
.start-btn { font-size: 1.15rem; letter-spacing: 0.06em; }
.field-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.field-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; align-items: center; }
.field-list li .muted { grid-column: 2; }
.bad-text { color: var(--bad); }
.focus-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 8px 2px 0; }
.focus-row .muted { flex: 1 1 10rem; }
.lane.spooked .lane-horse { filter: grayscale(1); opacity: 0.6; }
.wallet-line { margin: 0; }
.table-wrap { overflow-x: auto; }
.review-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.review-table th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 4px 6px; border-bottom: 2px solid var(--line); }
.review-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.35; }
.review-table td:first-child { width: 32%; overflow-wrap: anywhere; }
.review-table .res { width: 2rem; text-align: center; font-weight: 800; font-size: 1.1rem; }
.review-table tr.ok .res { color: var(--good); }
.review-table tr.no .res { color: var(--bad); }
.stable-link { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.wager-chips { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }

/* ---------- Vocab Derby: CPU commentary + clock ---------- */
.q-timer {
  margin-left: auto;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  font: 800 0.85rem/1.4 ui-monospace, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.race-log { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; font-size: 0.85rem; }
.race-log:empty::before { content: "The rivals are reading their first questions…"; color: var(--muted); font-size: 0.85rem; }
.race-feed { gap: 6px; }
.race-log li { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 8px; padding: 4px 6px; border-radius: 8px; background: var(--surface-2); line-height: 1.35; }
.race-log li.ok { box-shadow: inset 3px 0 0 var(--good); }
.race-log li.no { box-shadow: inset 3px 0 0 var(--bad); }
.race-log li.muted { display: block; background: none; }
.race-log .silk-dot { width: 1.1rem; height: 1.1rem; font-size: 0.65rem; margin-top: 1px; }

/* ---------- Vocab Derby: real-time race ---------- */
.tactic { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font-size: 0.8rem; line-height: 1; pointer-events: none; }
.tactic:empty { display: none; }
.race-clock { font: 800 0.85rem/1 ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; color: var(--ink); }
.race-log time { font: 700 0.75rem/1 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-right: 4px; font-variant-numeric: tabular-nums; }
.race-log li:first-child { animation: rise 0.25s ease; }
.race-log li.mine { background: var(--surface); box-shadow: inset 3px 0 0 var(--silk), 0 0 0 1px var(--line); }
.lock-overlay {
  margin: 0;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--bad-bg);
  color: var(--bad);
  font-weight: 700;
  text-align: center;
}
.lock-overlay b { font-variant-numeric: tabular-nums; }
.choices.locked { opacity: 0.45; }
.review-table tr.skip .res { color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition: none !important; }
  .confetti { display: none; }
  .feed { scroll-behavior: auto; }
}
@media (max-width: 420px) {
  .hud { gap: 5px; }
  .combo-word { display: none; }
}
@media (max-width: 420px) {
  .pill { padding: 3px 8px; font-size: 0.9rem; }
  .acct { padding: 0 8px; }
}
@media (max-width: 380px) {
  .brand { font-size: 1.05rem; }
  .passage { font-size: 1.05rem; }
}
@media (max-width: 340px) {
  /* Smallest phones (320px): tighten the header so every pill fits. */
  .hud { gap: 4px; }
  .brand { font-size: 0.98rem; }
  .pill { padding: 3px 6px; }
  .acct { padding: 0 7px; }
}

/* ---------- Focus Meter (0-100%, js/focus.js) ---------- */
.fmeter { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: middle; }
.fmeter-bar { display: inline-block; width: 46px; height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fmeter-bar i { display: block; height: 100%; border-radius: inherit; background: var(--good); transition: width 0.4s ease, background 0.3s ease; }
.fmeter.low .fmeter-bar i { background: var(--flame); }
.fmeter.critical .fmeter-bar i { background: var(--bad); }
.fmeter.low .fmeter-num { color: var(--flame); }
.fmeter.critical .fmeter-num { color: var(--bad); }
.pill.focus-pill { cursor: pointer; padding-inline: 8px; }
.pill.focus-pill .fmeter-bar { width: 34px; }
.pill.focus-pill.critical { border-color: var(--bad); }
.pill.focus-pill.low { border-color: var(--flame); }
.focus-hint { margin-right: auto; }
@media (max-width: 540px) {
  .pill.focus-pill .fmeter-bar { display: none; }
  .pill.focus-pill b { display: none; }
}
/* Header fit: Save becomes a cloud icon, then the brand drops "Sat". */
.brand .b-pre { font-weight: inherit; }
.acct-short { display: none; }
@media (max-width: 440px) {
  .acct { padding: 0 6px; }
  .acct-long { display: none; }
  .acct-short { display: inline; }
  .brand { font-size: 1.1rem; }
}
@media (max-width: 360px) {
  .brand .b-pre { display: none; }
  .hud { gap: 4px; }
  .pill { padding: 3px 6px; font-size: 0.85rem; }
}
@media (max-width: 340px) {
  .hud { gap: 3px; }
  .brand { font-size: 0.95rem; }
  .hud .pill { padding: 2px 5px; font-size: 0.8rem; gap: 2px; }
  .hud .avatar.sm { width: 28px; height: 28px; font-size: 0.95rem; }
  .acct { height: 28px; min-width: 28px; padding: 0 4px; }
}

/* Low Focus: question text always stays sharp. Open questions get a colored
   outline instead (orange under 50%, red under 25%), and the screen shakes
   on a miss at critical Focus. */
.card[data-qid]:not(.answered) > .card-inner,
#derby-q:not(.answered) { transition: box-shadow 0.4s ease; }
body[data-focus="low"] .card[data-qid]:not(.answered) > .card-inner,
body[data-focus="low"] #derby-q:not(.answered) { box-shadow: 0 0 0 2px var(--flame), var(--shadow); }
body[data-focus="critical"] .card[data-qid]:not(.answered) > .card-inner,
body[data-focus="critical"] #derby-q:not(.answered) { box-shadow: 0 0 0 3px var(--bad), var(--shadow); }
.focus-shake { animation: focus-shake 0.5s ease; }
@keyframes focus-shake {
  15%, 55% { transform: translateX(-7px); }
  35%, 75% { transform: translateX(7px); }
  90% { transform: translateX(-2px); }
}
@media (prefers-reduced-motion: reduce) {
  /* No shake; the outline alone shows low Focus. */
  .focus-shake { animation: none; }
}

/* View transitions between tabs */
.view-in { animation: view-in 0.22s ease; }
@keyframes view-in { from { opacity: 0; } } /* opacity only: a transform would briefly overflow the page */

/* Profile: stats row, Leaderboard & Friends entry; ranks sub-header */
.you-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
.you-stats b { display: block; font-family: var(--font-display); font-size: 1.05rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.you-stats span { font-size: 0.72rem; color: var(--muted); }
.nav-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.nav-row:hover { border-color: var(--volt); }
.subnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 4px 8px; }

/* High-Barrier Shop */
.shop-tier h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.price-tag { font-size: 0.85rem; padding: 2px 10px; border-radius: 999px; color: var(--spark); background: var(--spark-bg); font-variant-numeric: tabular-nums; }
.silk-swatch { border-radius: 10px; background: color-mix(in srgb, var(--silk, var(--volt)) 28%, transparent); }
.shop-info .fmeter { margin-top: 4px; }

/* Vault: card status chips and toggles; rule line in explanations */
.fc-flag.ok { color: var(--good); background: var(--good-bg); }
.fc-toggle[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--volt); }
.rule-line { font-size: 0.9rem; padding: 8px 10px; border-left: 3px solid var(--volt); background: var(--surface-2); border-radius: 8px; margin-block: 8px; }

/* ---------- Vocab Fishing (js/fishing.js) ---------- */
.fish-btn .mode-ico { font-size: 1.5rem; }
.fish-word { gap: 8px; }
.fish-target { margin: 0; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.fish-target b { font-weight: 800; letter-spacing: -0.02em; }
.fish-context { margin: 0; font-size: 0.95rem; color: var(--muted); }
.line-bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.line-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--ice), var(--volt)); transition: width 0.25s linear; }
.water {
  --water-a: #3fb6c9;
  --water-b: #1d6f9e;
  display: grid;
  gap: 4px;
  padding: 10px 8px 14px;
  border-radius: var(--r);
  background: linear-gradient(180deg, var(--water-a), var(--water-b));
  box-shadow: inset 0 8px 20px -12px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}
.spot-lake .water { --water-a: #9fb4c4; --water-b: #4d6a85; }
.spot-reef .water { --water-a: #36d1c4; --water-b: #0f8fa8; }
.spot-bay .water { --water-a: #2b3b78; --water-b: #0b1230; }
.lane-water { padding-block: 2px; }
/* Fish bob back and forth inside their lane, so the definition stays readable. */
.fish {
  position: relative;
  width: 80%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px 7px 8px;
  border: 2px solid transparent;
  border-radius: 999px 22px 22px 999px;
  background: rgba(255, 255, 255, 0.94);
  color: #16213a;
  text-align: left;
  font-size: 0.82rem;
  line-height: 1.3;
  box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.45);
  animation: swim var(--swim, 8s) ease-in-out var(--delay, 0s) infinite alternate;
  transition: opacity 0.3s ease, border-color 0.2s ease, background 0.2s ease;
}
.fish.rtl { animation-direction: alternate-reverse; border-radius: 22px 999px 999px 22px; }
.fish:hover:not(:disabled), .fish:focus-visible { border-color: #ffd23f; }
.fish-body { flex: none; font-size: 1.5rem; line-height: 1; }
.fish.rtl .fish-body { transform: scaleX(-1); }
.fish-def b { display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; margin-right: 2px; border-radius: 50%; background: #16213a; color: #fff; font-size: 0.72rem; }
@keyframes swim {
  0% { transform: translate(0, 0); }
  50% { transform: translate(12.5%, -2px); }
  100% { transform: translate(25%, 0); }
}
.water.stopped .fish, .water.still .fish { animation-play-state: paused; }
.water.still .fish { animation: none; }
.fish.gone { opacity: 0.25; }
.fish:disabled { cursor: default; }
.fish.caught { border-color: var(--good); background: #dbf4e6; animation: reel 0.7s ease forwards; }
.fish.reveal { border-color: var(--good); background: #dbf4e6; }
.fish.wrong { border-color: var(--bad); background: #fde3e6; }
@keyframes reel { 60% { transform: translateY(-10px) scale(1.04); } 100% { transform: translateY(-4px); } }
.gear-list { display: grid; gap: 8px; }
.gear {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--surface);
  text-align: left;
}
.gear.on { border-color: var(--volt); background: var(--surface-2); }
.gear:disabled { opacity: 0.6; cursor: default; }
.gear-ico { font-size: 1.5rem; text-align: center; }
.gear-info { display: grid; gap: 2px; min-width: 0; }
.gear-info b { font-family: var(--font-display); font-weight: 700; }
.gear-info small { color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: reduce) {
  .fish { animation: none; }
}

/* Derby unit picker */
.unit-pick { display: grid; gap: 4px; }
.derby-unit { margin-block: 4px; }

/* Shop: jump links between sections */
.shop-jump { display: flex; flex-wrap: wrap; gap: 6px; }
.shop-jump a {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 0.8rem;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}
.shop-jump a:hover { outline: 2px solid var(--spark); }
.shop-tier h2 .price-tag { flex: none; }
#view-shop [id^="shop-"] { scroll-margin-top: 8px; }
/* Profile sub-tabs */
.you-tabs button { font-size: 0.85rem; padding: 8px 6px; }
.you-tabs button { white-space: nowrap; }
.you-tabs .lbl-short { display: none; }
@media (max-width: 440px) {
  .you-tabs .lbl-long { display: none; }
  .you-tabs .lbl-short { display: inline; }
}
/* In the Profile pane the "Your rank" bar sits after the list (a sticky bar would cover the sign-in button). */
#you-ranks .rank-bar { position: static; }
.shop-tier h2 { font-size: 1.3rem; }
/* Settings: dedication at the bottom */
.memorial { margin: 12px 0 4px; text-align: center; font-family: var(--font-display); font-style: italic; font-size: 0.95rem; color: var(--muted); }

/* ---------- Dashboard: chapter select ---------- */
.feed-nav { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.feed-nav .chapter-bar { flex: 1; }
.back-dash {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-block: 0 10px;
  padding: 8px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
}
.back-dash:hover { border-color: var(--volt); }
@media (max-width: 400px) { .back-dash .back-lbl { display: none; } }
.dash-hero {
  display: grid;
  gap: 6px;
  padding: 18px;
  border-radius: var(--r);
  background: linear-gradient(135deg, var(--volt), #6a3df0);
  color: #fff;
}
.dash-hero h2 { margin: 0; font-family: var(--font-display); font-size: 1.4rem; }
.dash-hero .label-sm, .dash-hero .muted { color: rgba(255, 255, 255, 0.85); }
.dash-hero p { margin: 0; }
.dash-focus { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dash-focus .fmeter { background: rgba(255, 255, 255, 0.92); border-radius: 999px; padding: 2px 8px; color: var(--ink); }
.dash-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.ch-card {
  display: grid;
  gap: 10px;
  align-content: start;
  padding: 16px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--surface);

.ch-card.passed .ch-state { color: var(--good); }

.ch-actions { display: grid; gap: 8px; }
.ch-actions .btn { width: 100%; font-size: 0.95rem; padding: 10px 12px; }
.ch-actions .test-btn { border-color: var(--volt); color: var(--volt); }
.lock-note { margin: 0; font-size: 0.85rem; color: var(--muted); }

/* ---------- Test view: one question at a time ---------- */
.test-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.test-dots { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }

  width: 30px;
  height: 30px;

.test-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.center { text-align: center; }

/* ---------- Diagnostic Feedback screen ---------- */
.diag-banner {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 20px 16px;
  border-radius: var(--r);
  text-align: center;

.diag-head { margin: 6px 0 0; font-family: var(--font-display); font-size: 1.05rem; }

<!-- Curriculum: the framework (plan, stems, registration API), then one file per chapter. -->
<script>
/* ===== js/questions.js ===== */
// SatWizz curriculum framework.
//
// Loaded BEFORE the chapter files. It defines:
//   • CURRICULUM_PLAN: the 7-chapter sequence (plus two bonus chapters)
//   • STEMS: the official Digital SAT question stems
//   • SatWizz.curriculum.addChapter(): how a chapter file registers itself
//   • SatWizz.curriculum.build(): called once by the app after every chapter
//     file has loaded; orders chapters and builds the flat question list
//
// ─── Adding or filling a chapter (Phase 2) ─────────────────────────────────
// Create js/curriculum/chN.js, add a <script> for it in index.html (after this
// file, before js/app.js), and register it:
//
//   SatWizz.curriculum.addChapter({
//     id: 3,                                   // must match CURRICULUM_PLAN
//     short: "Subject-Verb Agreement",         // chapter bar / drawer label
//     title: "Subject-Verb Agreement",         // lesson card heading
//     pause: {                                 // the "Explanation Pause" lesson
//       summary: "One or two plain sentences.",
//       rules: ["Rule 1…", "Rule 2…"],
//       patterns: [{ f: "The box [of pens] is", ok: true }, { f: "…", ok: false }],
//       example: "A worked example with {{NAME_1}}.",
//     },
//     questions: [ /* see QUESTION FORMAT */ ],
//   });
//
// ─── QUESTION FORMAT (Digital SAT / Bluebook style) ─────────────────────────
//   {
//     id: "c3-1",                 // unique
//     skill: "Prepositional traps",
//     stem: "conventions",        // key of STEMS (optional; see defaults below)
//     text: "Passage of 1–3 sentences with ONE target: a blank ______ or an [[underlined segment]].",
//     choices: ["A", "B", "C", "D"],
//     answer: 0,                  // index into choices (shuffled on screen)
//     notes: ["why A works/fails", "…B", "…C", "…D"],
//     shortcut: "3:1" | "2:1",    // optional verb-choice ratio check
//     forms: ["s", "p", "p", "p"],// with shortcut: s/p verb, x non-verb
//   }
//   Stem defaults: "transition" if kind === "transition", otherwise
//   "conventions" for blanks and "conventionsUnderlined" for [[underlines]].
//
// ─── Placeholders (keep passages original; the cast fills them in) ─────────
//   {{NAME_1}} {{NAME_2}} {{NAME_3}}      people
//   {{NAME_1_POSS}} / {{NAME_1_OBJ}}      his/her/their, him/her/them (any NAME_n)
//   {{LOCATION}} {{EVENT}} {{SKILL}}      theme flavor; always mid-sentence
//   Never make a subject pronoun agree with a verb: custom casts can use "they".
//
// Run `node scripts/validate-content.js` after editing.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});

  // The 7-chapter sequence, then two bonus chapters. Chapters unlock in this order.
  // Each core chapter leads with its pop-culture set (clause-derby/src/chN.js,
  // registered by js/curriculum/clause.js), then the extra practice in
  // js/curriculum/chN.js.
  SW.CURRICULUM_PLAN = [
    { id: 1, short: "Clause Connectors", title: "Independent Clause Connectors & Sentence Boundaries" },
    { id: 2, short: "Subject-Verb Agreement", title: "Subject-Verb Agreement" },
    { id: 3, short: "Verb vs. Non-Verb", title: "Verb vs. Non-Verb Identification (Appositives)" },
    { id: 4, short: "Verb Tenses", title: "Verb Tenses & Aspect" },
    { id: 5, short: "Logical Transitions", title: "Logical Transitions" },
    { id: 6, short: "Semicolons, Dashes, Colons", title: "Punctuation Fundamentals (Semicolon, Dash, Colon)" },
    { id: 7, short: "Appositives", title: "Appositives & Non-Essential Clauses" },
    { id: 8, short: "Modifiers & Parallelism", title: "Bonus: Modifiers & Parallelism", bonus: true },
    { id: 9, short: "Pronouns & Possessives", title: "Bonus: Pronouns & Possessives", bonus: true },
  ];

  // Saves from before the 7-chapter curriculum (SAVE_VERSION < 3) used ids 1-10:
  // old → new chapter id. Old chapter 1 (complete sentences) was retired.
  SW.LEGACY_CHAPTER_MAP = { 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 7, 9: 8, 10: 9 };

  // Share of a chapter's questions you need right to unlock the next one.
  SW.UNLOCK_SHARE = 0.6;

  // Official Digital SAT question stems. {word} is filled for vocab "meaning" items.
  SW.STEMS = {
    conventions: "Which choice completes the text so that it conforms to the conventions of Standard English?",
    conventionsUnderlined: "Which choice conforms to the conventions of Standard English?",
    transition: "Which choice completes the text with the most logical transition?",
    wordChoice: "Which choice completes the text with the most logical and precise word or phrase?",
    meaning: "As used in the text, what does the word “{word}” most nearly mean?",
  };

  // [[underlined segment]] marker used in passages.
  SW.UNDERLINE_RE = /\[\[([^\]]+)\]\]/;

  // Which stem a question shows.
  SW.stemFor = function stemFor(q) {
    if (q.stem && SW.STEMS[q.stem]) return SW.STEMS[q.stem];
    if (q.kind === "transition") return SW.STEMS.transition;
    return SW.UNDERLINE_RE.test(q.text) ? SW.STEMS.conventionsUnderlined : SW.STEMS.conventions;
  };

  // Seeded randomness (stable per user): question casts and the no-repeat
  // order of generated questions.
  SW.rng = {
    hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
      return h >>> 0;
    },
    // mulberry32
    make(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    shuffle(arr, seed) {
      const r = SW.rng.make(seed);
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };

  const registered = [];

  SW.curriculum = {
    // A chapter can register more than once (pop-culture set, then extra
    // practice): questions are appended, and the first registration's title
    // and lesson win. Lesson patterns/example missing from it are filled in.
    addChapter(def) {
      const plan = SW.CURRICULUM_PLAN.find((p) => p.id === def.id);
      if (!plan) console.warn(`SatWizz: chapter ${def.id} isn't in CURRICULUM_PLAN`);
      const prev = registered.find((c) => c.id === def.id);
      if (!prev) {
        registered.push({ ...def, ...plan, questions: (def.questions || []).slice() });
        return;
      }
      prev.questions.push(...(def.questions || []));
      if (!prev.pause) prev.pause = def.pause;
      else if (def.pause) {
        if (!prev.pause.patterns || !prev.pause.patterns.length) prev.pause.patterns = def.pause.patterns || [];
        if (!prev.pause.example) prev.pause.example = def.pause.example || "";
      }
    },

    // Orders chapters and exposes SatWizz.chapters / SatWizz.questions.
    // Planned chapters without a file yet show up with no questions.
    build() {
      const byId = new Map(registered.map((c) => [c.id, c]));
      SW.chapters = SW.CURRICULUM_PLAN
        .map((p) => byId.get(p.id) || { ...p, pause: null, questions: [] })
        .concat(registered.filter((c) => !SW.CURRICULUM_PLAN.some((p) => p.id === c.id)))
        .sort((a, b) => a.id - b.id);
      // Generated pools (js/curriculum/gen/): thousands of extra questions per
      // chapter, served after the core set and never repeated (see app.js).
      for (const ch of SW.chapters) ch.pool = SW.gen ? SW.gen.pool(ch.id).map((q) => Object.assign(q, { chapterId: ch.id })) : [];
      SW.questions = SW.chapters.flatMap((ch) => [...ch.questions.map((q) => Object.assign(q, { chapterId: ch.id })), ...ch.pool]);
      SW.chapterById = (id) => SW.chapters.find((c) => c.id === id);
      SW.CORE_CHAPTERS = SW.chapters.filter((c) => !c.bonus).length;
      return SW.chapters;
    },
  };
})();

<script>
/* ===== clause-derby/src/bank.js ===== */
// SAT Wizz: Clause Derby question bank core.
// Chapter files call ClauseBank.add({ id, title, short, focus, rules, questions }).
// Each question: { id, skill, kind?, text (one "______" blank), choices[4],
// answer (index), rule (the principle it tests), notes[4] (why each choice
// is right or wrong, same order as choices) }. Choices are shuffled on screen.
(function () {
  "use strict";
  const STEMS = {
    conventions: "Which choice completes the text so that it conforms to the conventions of Standard English?",
    transition: "Which choice completes the text with the most logical transition?",
  };
  const chapters = [];
  window.ClauseBank = {
    STEMS,
    chapters,
    add(ch) {
      ch.questions.forEach((q) => { q.chapter = ch.id; q.kind = q.kind || ch.kind || "conventions"; });
      chapters.push(ch);
      chapters.sort((a, b) => a.id - b.id);
    },
    // Q(id, skill, text, choices, answer, rule, notes)
    Q: (id, skill, text, choices, answer, rule, notes) => ({ id, skill, text, choices, answer, rule, notes }),
    // B(ruleName, q): marks q as its chapter's benchmark for the
    // Review for Understanding test, with the rule name the diagnostic shows.
    B: (ruleName, q) => Object.assign(q, { benchmark: true, ruleName }),
    stemFor: (q) => STEMS[q.kind] || STEMS.conventions,
  };
})();

// Registers the pop-culture question sets (clause-derby/src/ch1.js … ch7.js,
// shared with the standalone Clause Derby game) as the first part of
// chapters 1–7. Load after the ClauseBank files and before js/curriculum/chN.js,

// Each question keeps its `rule` line (shown in the explanation drawer) and
// its `kind` ("transition" questions get the transition stem).
(function () {
  "use strict";
  const SW = window.SatWizz;
  const bank = window.ClauseBank;
  if (!bank) return;
  for (const ch of bank.chapters) {
    SW.curriculum.addChapter({
      id: ch.id,
      pause: { summary: ch.focus, rules: ch.rules.slice(), patterns: [], example: "" },
      questions: ch.questions.map((q) => ({
        id: `pop-${q.id}`, // "pop-c1-01": the bare ids clash with the extra practice ids (c6-17…)
        skill: q.skill,
        kind: q.kind,
        text: q.text,
        choices: q.choices,
        answer: q.answer,
        notes: q.notes,
        rule: q.rule,
        benchmark: q.benchmark || undefined,
        ruleName: q.ruleName,
      })),
    });
  }
})();
