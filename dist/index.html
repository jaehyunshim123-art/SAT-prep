    const q = normalizeUsername(query).replace(/[^a-z0-9_]/g, "");
    if (q.length < 2) return [];
    const { data, error } = await client.from("user_public").select(PUBLIC_COLS)
      .ilike("username", `${q}%`).neq("user_id", u.id).order("username").limit(8);
    if (error) throw friendly(error);
    return data || [];
  }

  async function sendFriendRequest(username) {
    me();
    const { data, error } = await client.rpc("send_friend_request", { target_username: normalizeUsername(username) });
    if (error) throw friendly(error);
    return data; // friendships row; status "accepted" if they had already asked you
  }

  async function respondFriendRequest(id, accept) {
    me();
    const { error } = await client.rpc("respond_friend_request", { request_id: id, accept });
    if (error) throw friendly(error);
  }

  const utcDay = (d = new Date()) => d.toISOString().slice(0, 10);
  const utcYesterday = () => utcDay(new Date(Date.now() - 864e5));

  // Friends with their public cards and the shared streak.
  async function listFriends() {
    const u = me();
    const { data: rows, error } = await client.from("friendships").select("*");
    if (error) throw friendly(error);
    const otherId = (f) => (f.user_low === u.id ? f.user_high : f.user_low);
    const ids = [...new Set((rows || []).map(otherId))];
    let cards = [];
    if (ids.length) {
      const res = await client.from("user_public").select(PUBLIC_COLS).in("user_id", ids);
      if (res.error) throw friendly(res.error);
      cards = res.data || [];
    }
    const byId = Object.fromEntries(cards.map((c) => [c.user_id, c]));
    const alive = (f) => f.streak_date && f.streak_date >= utcYesterday();
    const out = { friends: [], incoming: [], outgoing: [] };
    for (const f of rows || []) {
      const profile = byId[otherId(f)] || { user_id: otherId(f), display_name: "Friend", avatar: "fox" };
      const lastAt = profile.last_practice_at ? Date.parse(profile.last_practice_at) : 0;
      const entry = {
        id: f.id,
        profile,
        streak: alive(f) ? f.streak : 0,
        practicedRecently: Date.now() - lastAt < 20 * 3600e3, // "active" for Lock In purposes
        lastPracticeAt: lastAt || null,
      };
      if (f.status === "accepted") out.friends.push(entry);
      else if (f.requested_by === u.id) out.outgoing.push(entry);
      else out.incoming.push(entry);
    }
    out.friends.sort((a, b) => b.streak - a.streak || (b.profile.total_xp || 0) - (a.profile.total_xp || 0));
    return out;
  }

  // scope: "global" (top 50) or "friends"; metric: "xp" or "sparks".
  async function leaderboard(scope, metric, mine) {
    const u = me();
    const col = metric === "sparks" ? "sparks" : "total_xp";
    let rows;
    if (scope === "friends") {
      const { data: fr, error } = await client.from("friendships").select("user_low, user_high").eq("status", "accepted");
      if (error) throw friendly(error);
      const ids = [u.id, ...(fr || []).map((f) => (f.user_low === u.id ? f.user_high : f.user_low))];
      const res = await client.from("user_public").select(PUBLIC_COLS).in("user_id", ids).order(col, { ascending: false });
      if (res.error) throw friendly(res.error);
      rows = res.data || [];
    } else {
      const res = await client.from("user_public").select(PUBLIC_COLS).order(col, { ascending: false }).limit(50);
      if (res.error) throw friendly(res.error);
      rows = res.data || [];
    }
    // Your rank = 1 + number of people strictly ahead of you.
    let myRank = rows.findIndex((r) => r.user_id === u.id) + 1 || null;
    if (!myRank && scope === "global" && mine != null) {
      const { count, error } = await client.from("user_public").select("user_id", { count: "exact", head: true }).gt(col, mine);
      if (!error && typeof count === "number") myRank = count + 1;
    }
    return { rows, myRank, column: col };
  }

  // Marks you active and grows friend streaks. Cheap; the app throttles it.
  async function recordPractice() {
    if (!client || !user()) return;
    const { error } = await client.rpc("record_practice");
    if (error) console.warn("SatWizz: record_practice failed", error);
  }

  // Lock In a friend: the Edge Function stores the alert and pushes it. If the
  // function isn't deployed, fall back to storing it (in-app alert only).
  async function sendLockIn(friendId) {
    me();
    const { data, error } = await client.functions.invoke("lock-in", { body: { friendId } });
    if (!error) return { pushed: (data && data.sent) > 0, message: data && data.message };
    let status = 0;
    let body = null;
    try {
      status = error.context && error.context.status;
      body = error.context && typeof error.context.json === "function" ? await error.context.json() : null;
    } catch (e) { /* not JSON */ }
    if (body && body.error && status >= 400 && status < 500 && status !== 404) throw friendly(body);
    // Not deployed (404) or unreachable: store it directly so it still shows in-app.
    const res = await client.rpc("send_lock_in", { target: friendId });
    if (res.error) throw friendly(res.error);
    return { pushed: false, message: res.data && res.data.message };
  }

  async function unreadLockIns() {
    const u = me();
    const { data, error } = await client.from("lock_ins").select("*")
      .eq("to_user", u.id).is("read_at", null).order("created_at", { ascending: false }).limit(5);
    if (error) throw friendly(error);
    return data || [];
  }

  async function markLockInsRead(ids) {
    if (!ids.length) return;
    me();
    const { error } = await client.from("lock_ins").update({ read_at: new Date().toISOString() }).in("id", ids);
    if (error) console.warn("SatWizz: couldn't mark Lock In read", error);
  }

  // Live in-app alerts while the app is open. Returns an unsubscribe function.
  function subscribeLockIns(onAlert) {
    const u = user();
    if (!client || !u || typeof client.channel !== "function") return () => {};
    const channel = client
      .channel(`lock-ins-${u.id}`)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "lock_ins", filter: `to_user=eq.${u.id}` },
        (payload) => onAlert(payload.new))
      .subscribe();
    return () => client.removeChannel(channel);
  }

  // ---------- Web Push ----------
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

  // unsupported | not-configured | needs-install | default | denied | enabled
  async function pushState() {
    if (!cfg.vapidPublicKey) return "not-configured";
    if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
      return isIOS() && !isStandalone() ? "needs-install" : "unsupported";
    }
    if (Notification.permission === "denied") return "denied";
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && (await reg.pushManager.getSubscription());
      if (sub && Notification.permission === "granted") return "enabled";
    } catch (e) { /* treat as not enabled */ }
    return "default";
  }

  function urlBase64ToUint8Array(base64) {
    const padded = (base64 + "=".repeat((4 - (base64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(padded);
    return Uint8Array.from(raw, (c) => c.charCodeAt(0));
  }

  // Must be called from a tap (browsers require a user gesture for the prompt).
  async function enablePush() {
    me();
    const state = await pushState();
    if (state === "needs-install") throw new Error("On iPhone, add SatWizz to your Home Screen first (Share → Add to Home Screen), then turn alerts on there.");
    if (state === "unsupported") throw new Error("This browser doesn't support notifications.");
    if (state === "not-configured") throw new Error("Push alerts aren't set up on this copy of SatWizz yet.");
    const permission = await Notification.requestPermission();
    if (permission !== "granted") throw new Error("Notifications are blocked. Allow them in your browser settings to get Lock In alerts.");
    let reg;
    try {
      reg = await navigator.serviceWorker.register("sw.js");
    } catch (e) {
      // The single-file build (dist/index.html) has no sw.js beside it.
      throw new Error("Push alerts need the sw.js file next to this page. Upload sw.js alongside index.html to turn them on.");
    }
    await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(cfg.vapidPublicKey) }));
    const { endpoint, keys } = sub.toJSON();
    const { error } = await client.from("push_subscriptions")
      .upsert({ user_id: user().id, endpoint, p256dh: keys.p256dh, auth: keys.auth }, { onConflict: "endpoint" });
    if (error) throw friendly(error);
    return "enabled";
  }

  async function disablePush() {
    const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration() : null;
    const sub = reg && (await reg.pushManager.getSubscription());
    if (!sub) return;
    if (client && user()) await client.from("push_subscriptions").delete().eq("endpoint", sub.endpoint);
    await sub.unsubscribe();
  }

  SW.auth = {
    init,
    available,
    reason,
    user,
    onChange,
    signUp,
    signIn,
    signInWithGoogle,
    signOut,
    pull,
    push,
    schedulePush,
    merge,
    status: getStatus,
    onStatus,
    defaultDisplayName,
    // social
    claimUsername,
    ensureUsername,
    searchUsers,
    sendFriendRequest,
    respondFriendRequest,
    listFriends,
    leaderboard,
    recordPractice,
    sendLockIn,
    unreadLockIns,
    markLockInsRead,
    subscribeLockIns,
    pushState,
    enablePush,
    disablePush,
  };
})();

</script>
<script>
/* ===== js/onboarding.js ===== */
// SatWizz sign-up / log-in modal. Exposes window.SatWizz.onboarding.
// open({ reason, onGuest }) shows the overlay; reason is "save", "combo" or "invite".
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  const auth = () => SW.auth;

  const COPY = {
    save: {
      title: "Save your progress",
      body: "Create a free account to keep your streak, XP and cast on every device.",
    },
    combo: {
      title: "3 in a row! Don't lose that streak",
      body: "Make a free account so your streak and XP follow you to any phone or laptop.",
    },
    invite: {
      title: "A friend invited you 🔥",
      body: "Sign in to accept their friend request, start a friend streak and see where you rank.",
    },
  };

  const GOOGLE_G =
    '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">' +
    '<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>' +
    '<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>' +
    '<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>' +
    '<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>' +
    "</svg>";

  let root = null;
  let opts = {};
  let mode = "signup";
  let returnFocus = null;

  const isOpen = () => root !== null;

  function open(options = {}) {
    if (root) return;
    opts = options;
    mode = options.mode || "signup";
    returnFocus = document.activeElement;
    render();
    document.addEventListener("keydown", onKey, true);
    root.querySelector("#auth-google").focus();
  }

  function close() {
    if (!root) return;
    document.removeEventListener("keydown", onKey, true);
    root.remove();
    root = null;
    if (returnFocus && typeof returnFocus.focus === "function") returnFocus.focus({ preventScroll: true });
  }

  function continueAsGuest() {
    close();
    if (typeof opts.onGuest === "function") opts.onGuest();
  }

  function render() {
    const copy = COPY[opts.reason] || COPY.save;
    const ready = auth() && auth().available();
    root = document.createElement("div");
    root.className = "modal-backdrop";
    root.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title" aria-describedby="auth-body">
        <div class="modal-brand">Sat<span>Wizz</span></div>
        <h2 id="auth-title">${copy.title}</h2>
        <p id="auth-body" class="muted">${copy.body}</p>
        ${ready ? "" : `<p class="notice">${
          auth() && auth().reason() === "sdk-missing"
            ? "The sign-in service didn't load. Check your connection and reload, or keep playing as a guest."
            : "Cloud accounts aren't set up on this copy of SatWizz yet. You can keep playing as a guest."
        }</p>`}
        <button class="btn google wide" type="button" id="auth-google">${GOOGLE_G}<span>Continue with Google</span></button>
        <div class="divider" role="separator"><span>or use email</span></div>
        <div class="seg auth-tabs" role="tablist" aria-label="Account">
          <button type="button" role="tab" id="tab-signup" aria-controls="auth-form">Sign Up</button>
          <button type="button" role="tab" id="tab-login" aria-controls="auth-form">Log In</button>
        </div>
        <form id="auth-form" class="stack" novalidate>
          <div class="field">
            <label for="auth-email">Email</label>
            <input class="input" id="auth-email" type="email" autocomplete="email" inputmode="email" required>
          </div>
          <div class="field">
            <label for="auth-pass">Password</label>
            <input class="input" id="auth-pass" type="password" minlength="6" required>
          </div>
          <p class="form-msg" id="auth-msg" role="alert"></p>
          <button class="btn wide" type="submit" id="auth-submit"></button>
        </form>
        <button class="linkbtn" type="button" id="auth-guest">Continue as Guest</button>
        <p class="fine">As a guest, progress is saved in this browser only.</p>
      </div>`;
    document.body.append(root);

    root.addEventListener("mousedown", (e) => { if (e.target === root) continueAsGuest(); });
    root.querySelector("#tab-signup").addEventListener("click", () => setMode("signup"));
    root.querySelector("#tab-login").addEventListener("click", () => setMode("login"));
    root.querySelector("#auth-guest").addEventListener("click", continueAsGuest);
    root.querySelector("#auth-google").addEventListener("click", google);
    root.querySelector("#auth-form").addEventListener("submit", submit);
    setMode(mode);
  }

  function setMode(next) {
    mode = next;
    const signup = mode === "signup";
    root.querySelector("#tab-signup").setAttribute("aria-selected", String(signup));
    root.querySelector("#tab-login").setAttribute("aria-selected", String(!signup));
    root.querySelector("#tab-signup").setAttribute("aria-pressed", String(signup));
    root.querySelector("#tab-login").setAttribute("aria-pressed", String(!signup));
    root.querySelector("#auth-pass").setAttribute("autocomplete", signup ? "new-password" : "current-password");
    root.querySelector("#auth-submit").textContent = signup ? "Sign Up" : "Log In";
    message("");
  }

  function message(text, kind = "error") {
    const el = root && root.querySelector("#auth-msg");
    if (!el) return;
    el.textContent = text;
    el.dataset.kind = kind;
  }

  function busy(on, label) {
    const btn = root.querySelector("#auth-submit");
    btn.disabled = on;
    root.querySelector("#auth-google").disabled = on;
    if (label) btn.textContent = label;
  }

  function friendly(err) {
    const m = (err && err.message) || "Something went wrong. Try again.";
    if (/invalid login credentials/i.test(m)) return "That email and password don't match. Check them or switch to Sign Up.";
    if (/already registered|already exists/i.test(m)) return "There's already an account with that email. Switch to Log In.";
    if (/email not confirmed/i.test(m)) return "Confirm your email first. Check your inbox for the link.";
    if (/failed to fetch|network/i.test(m)) return "Couldn't reach the server. Check your connection and try again.";
    return m;
  }

  async function google() {
    message("");
    try {
      busy(true);
      await auth().signInWithGoogle();
    } catch (e) {
      message(friendly(e));
      busy(false);
    }
  }

  async function submit(e) {
    e.preventDefault();
    const email = root.querySelector("#auth-email").value.trim();
    const password = root.querySelector("#auth-pass").value;
    if (!/^\S+@\S+\.\S+$/.test(email)) return message("Enter a valid email address.");
    if (password.length < 6) return message("Use a password with at least 6 characters.");

    const signup = mode === "signup";
    busy(true, signup ? "Creating account…" : "Logging in…");
    try {
      if (signup) {
        const { needsConfirmation } = await auth().signUp(email, password);
        if (needsConfirmation) {
          setMode("login");
          busy(false);
          message(`Check ${email} for a confirmation link, then log in here.`, "info");
          return;
        }
      } else {
        await auth().signIn(email, password);
      }
      close(); // the app's auth listener pulls and merges cloud data
    } catch (err) {
      busy(false);
      setMode(mode);
      message(friendly(err));
    }
  }

  function onKey(e) {
    if (!root) return;
    if (e.key === "Escape") {
      e.preventDefault();
      continueAsGuest();
      return;
    }
    if (e.key === "Tab") {
      const items = [...root.querySelectorAll("button:not(:disabled), input")];
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    // Capture-phase stop: the app's feed shortcuts never see keys typed here.
    e.stopPropagation();
  }

  SW.onboarding = { open, close, isOpen };
})();

</script>
<script>
/* ===== js/social-view.js ===== */
// SatWizz "Leaderboard" tab: live leaderboards (Global Top 50 / Friends League),
// friend streaks with Lock In nudges, friend requests, search and invites.
//
// The app mounts it with a context of shared helpers:
//   SatWizz.socialView.mount({ container, getState, save, esc, toast, openSignup,
//                              avatarEmoji, sfx, inviteUrl })
// and gets back { render, invalidate }.
(function () {
  "use strict";

  const SW = (window.SatWizz = window.SatWizz || {});
  const CACHE_MS = 20 * 1000;

  function mount(ctx) {
    const auth = SW.auth;
    const { container, esc, toast } = ctx;
    const cache = new Map(); // key -> { at, data }
    let searchResults = null;
    let renderSeq = 0;

    const S = () => ctx.getState();
    const fmt = (n) => Number(n || 0).toLocaleString();
    const medal = (rank) => ["🥇", "🥈", "🥉"][rank - 1] || `#${rank}`;
    const signedIn = () => auth.available() && auth.user();

    async function cached(key, load, force) {
      const hit = cache.get(key);
      if (!force && hit && Date.now() - hit.at < CACHE_MS) return hit.data;
      const data = await load();
      cache.set(key, { at: Date.now(), data });
      return data;
    }
    const invalidate = () => cache.clear();

    // ---------- shell ----------
    function render(force) {
      const st = S();
      const scope = st.lbScope === "friends" ? "friends" : "global";
      const metric = st.lbMetric === "sparks" ? "sparks" : "xp";
      container.innerHTML = `
        <div class="stack ranks">
          <div class="seg subtabs" role="tablist" aria-label="Leaderboard">
            <button type="button" role="tab" data-scope="global" aria-selected="${scope === "global"}">🌍 Global Top 50</button>
            <button type="button" role="tab" data-scope="friends" aria-selected="${scope === "friends"}">🤝 Friends League</button>
          </div>
          <div class="metric-row">
            <span class="label-sm">Rank by</span>
            <div class="seg small" role="group" aria-label="Rank by">
              <button type="button" data-metric="xp" aria-pressed="${metric === "xp"}">XP</button>
              <button type="button" data-metric="sparks" aria-pressed="${metric === "sparks"}">⚡ Sparks</button>
            </div>
          </div>
          <div id="ranks-body" class="stack"><div class="panel skeleton" aria-busy="true"><p class="muted">Loading the leaderboard…</p></div></div>
        </div>
        <div class="rank-bar" id="rank-bar" aria-live="polite"></div>`;
      container.querySelectorAll("[data-scope]").forEach((b) => b.addEventListener("click", () => {
        S().lbScope = b.dataset.scope;
        ctx.save();
        render();
      }));
      container.querySelectorAll("[data-metric]").forEach((b) => b.addEventListener("click", () => {
        S().lbMetric = b.dataset.metric;
        ctx.save();
        render();
      }));
      load(scope, metric, force);
    }

    function rankBar({ rank, value, metric }) {
      const st = S();
      const bar = container.querySelector("#rank-bar");
      if (!bar) return;
      const unit = metric === "sparks" ? "⚡" : "XP";
      bar.innerHTML = `
        <span class="lb-rank">${rank ? medal(rank) : "—"}</span>
        <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(st.avatar)}</span>
        <span class="lb-name"><b>Your rank</b><small>${rank ? `${st.username ? "@" + esc(st.username) + " · " : ""}🔥 ${st.streak}` : "Unranked · sign in to compete"}</small></span>
        <span class="lb-value">${fmt(value)} <small>${unit}</small></span>`;
    }

    // ---------- data ----------
    async function load(scope, metric, force) {
      const seq = ++renderSeq;
      const body = container.querySelector("#ranks-body");
      const st = S();
      const myValue = metric === "sparks" ? st.sparks : st.xp;

      if (st.demo) {
        body.innerHTML = `<section class="panel"><h2>Demo Mode is on</h2><p class="muted">Leaderboards are paused while Demo Mode is on, so demo numbers never reach the real rankings. Tap the SatWizz logo 5 times to turn it off.</p></section>`;
        rankBar({ rank: null, value: myValue, metric });
        return;
      }
      if (!signedIn()) {
        body.innerHTML = `
          <section class="panel ranks-cta">
            <span class="cta-emoji" aria-hidden="true">🏆</span>
            <h2>Climb the leaderboard</h2>
            <p class="muted">Sign in to see where you rank worldwide, add friends by @username, and keep friend streaks alive.</p>
            <button class="btn wide" type="button" id="ranks-signin">Save Progress &amp; join</button>
          </section>`;
        body.querySelector("#ranks-signin").addEventListener("click", () => ctx.openSignup("save"));
        rankBar({ rank: null, value: myValue, metric });
        return;
      }

      try {
        const [board, social] = await Promise.all([
          cached(`${scope}:${metric}`, () => auth.leaderboard(scope, metric, myValue), force),
          scope === "friends" ? cached("friends", () => auth.listFriends(), force) : Promise.resolve(null),
        ]);
        if (seq !== renderSeq) return; // a newer render started
        body.innerHTML = "";
        if (social) body.append(...friendsSections(social));
        body.append(boardSection(board, scope, metric));
        rankBar({ rank: board.myRank, value: myValue, metric });
        wire(body);
      } catch (e) {
        if (seq !== renderSeq) return;
        body.innerHTML = `<section class="panel"><h2>Couldn't load rankings</h2><p class="muted">${esc(e.message)}</p><button class="btn ghost" type="button" id="ranks-retry">Try again</button></section>`;
        body.querySelector("#ranks-retry").addEventListener("click", () => render(true));
        rankBar({ rank: null, value: myValue, metric });
      }
    }

    // ---------- sections ----------
    function boardSection(board, scope, metric) {
      const me = auth.user().id;
      const col = board.column;
      const unit = metric === "sparks" ? "⚡" : "XP";
      const sec = document.createElement("section");
      sec.className = "panel";
      const rows = board.rows.map((r, i) => `
        <li class="lb-row${r.user_id === me ? " me" : ""}${i < 3 ? " top" : ""}">
          <span class="lb-rank">${medal(i + 1)}</span>
          <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(r.avatar)}</span>
          <span class="lb-name"><b>${esc(r.display_name)}${r.user_id === me ? " (you)" : ""}</b><small>${r.username ? "@" + esc(r.username) + " · " : ""}🔥 ${fmt(r.current_streak)}</small></span>
          <span class="lb-value">${fmt(r[col])} <small>${unit}</small></span>
        </li>`).join("");
      sec.innerHTML = `
        <h2>${scope === "friends" ? "Friends League" : "Global Top 50"}</h2>
        ${board.rows.length
          ? `<ol class="lb-list">${rows}</ol>`
          : `<p class="muted">${scope === "friends" ? "Add friends to start a league." : "No one's on the board yet. Answer a question to be first."}</p>`}`;
      return sec;
    }

    function friendsSections(social) {
      const out = [];
      const st = S();

      // Friend streaks + Lock In
      const streaks = document.createElement("section");
      streaks.className = "panel";
      streaks.innerHTML = `
        <h2>Friend streaks</h2>
        <p class="muted">A friend streak grows each day you and a friend both practice within 24 hours.</p>
        ${social.friends.length ? `<ul class="friend-list">${social.friends.map((f) => `
          <li class="friend-row${f.practicedRecently ? "" : " idle"}">
            <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(f.profile.avatar)}</span>
            <span class="lb-name"><b>${esc(f.profile.display_name)}</b><small>${f.profile.username ? "@" + esc(f.profile.username) + " · " : ""}${f.practicedRecently ? "practiced today ✓" : lastSeen(f.lastPracticeAt)}</small></span>
            <span class="fstreak${f.streak ? "" : " cold"}" title="Friend streak">🔥 ${f.streak}</span>
            ${f.practicedRecently ? "" : `<button class="lock-btn" type="button" data-lock="${esc(f.profile.user_id)}" data-name="${esc(f.profile.display_name)}">Lock In 🔒</button>`}
          </li>`).join("")}</ul>` : '<p class="muted">No friends yet. Search by @username or share your invite link below.</p>'}`;
      out.push(streaks);

      // Requests
      if (social.incoming.length || social.outgoing.length) {
        const req = document.createElement("section");
        req.className = "panel";
        req.innerHTML = `
          <h2>Requests</h2>
          <ul class="friend-list">
            ${social.incoming.map((f) => `
              <li class="friend-row">
                <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(f.profile.avatar)}</span>
                <span class="lb-name"><b>${esc(f.profile.display_name)}</b><small>${f.profile.username ? "@" + esc(f.profile.username) : ""} wants to be friends</small></span>
                <button class="mini-btn on" type="button" data-accept="${f.id}">Accept</button>
                <button class="mini-btn" type="button" data-decline="${f.id}">Decline</button>
              </li>`).join("")}
            ${social.outgoing.map((f) => `
              <li class="friend-row">
                <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(f.profile.avatar)}</span>
                <span class="lb-name"><b>${esc(f.profile.display_name)}</b><small>Request sent · waiting</small></span>
                <button class="mini-btn" type="button" data-decline="${f.id}">Cancel</button>
              </li>`).join("")}
          </ul>`;
        out.push(req);
      }

      // Add friends
      const add = document.createElement("section");
      add.className = "panel";
      const link = ctx.inviteUrl();
      add.innerHTML = `
        <h2>Add friends</h2>
        <form class="search-row" id="friend-search" role="search">
          <label class="sr-only" for="friend-q">Search by username</label>
          <input class="input" id="friend-q" placeholder="@username" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="search">
          <button class="btn" type="submit">Search</button>
        </form>
        <ul class="friend-list" id="search-results">${renderResults()}</ul>
        <div class="invite">
          <span class="label-sm">Your invite link${st.username ? ` · you're @${esc(st.username)}` : ""}</span>
          ${link ? `<code class="invite-link" id="invite-link">${esc(link)}</code>
          <div class="row">
            <button class="btn ghost" type="button" id="copy-invite">Copy link</button>
            ${navigator.share ? '<button class="btn ghost" type="button" id="share-invite">Share</button>' : ""}
          </div>` : '<p class="muted">Your username is being set up…</p>'}
        </div>
        <div class="push-card" id="push-card"></div>`;
      out.push(add);
      return out;
    }

    function renderResults() {
      if (searchResults === null) return "";
      if (!searchResults.length) return '<li class="muted">No one found with that username.</li>';
      return searchResults.map((r) => `
        <li class="friend-row">
          <span class="avatar md" aria-hidden="true">${ctx.avatarEmoji(r.avatar)}</span>
          <span class="lb-name"><b>${esc(r.display_name)}</b><small>@${esc(r.username)} · ${fmt(r.total_xp)} XP</small></span>
          <button class="mini-btn on" type="button" data-add="${esc(r.username)}">Add</button>
        </li>`).join("");
    }

    function lastSeen(ts) {
      if (!ts) return "hasn't practiced yet";
      const days = Math.floor((Date.now() - ts) / 864e5);
      return days < 1 ? "not practiced today" : `last practiced ${days}d ago`;
    }

    // ---------- actions ----------
    function wire(body) {
      body.querySelectorAll("[data-lock]").forEach((b) => b.addEventListener("click", async () => {
        ctx.sfx.play("tap");
        b.disabled = true;
        b.textContent = "Sending…";
        try {
          const res = await auth.sendLockIn(b.dataset.lock);
          b.textContent = "Sent ✓";
          toast(`Lock In sent to ${b.dataset.name} 🔒${res.pushed ? "" : " They'll see it next time they open SatWizz."}`);
        } catch (e) {
          b.textContent = "Lock In 🔒";
          b.disabled = /again in a few hours/.test(e.message);
          toast(e.message);
        }
      }));
      body.querySelectorAll("[data-accept]").forEach((b) => b.addEventListener("click", () => respond(b, Number(b.dataset.accept), true)));
      body.querySelectorAll("[data-decline]").forEach((b) => b.addEventListener("click", () => respond(b, Number(b.dataset.decline), false)));
      wireAdd(body);
      wireInvite(body);
      renderPushCard(body.querySelector("#push-card"));
    }

    async function respond(btn, id, accept) {
      btn.disabled = true;
      try {
        await auth.respondFriendRequest(id, accept);
        toast(accept ? "Friend added 🎉 Your friend streak starts when you both practice." : "Request removed.");
        invalidate();
        render(true);
      } catch (e) {
        btn.disabled = false;
        toast(e.message);
      }
    }

    function wireAdd(body) {
      const form = body.querySelector("#friend-search");
      if (!form) return;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const q = body.querySelector("#friend-q").value;
        try {
          searchResults = await auth.searchUsers(q);
        } catch (err) {
          toast(err.message);
          searchResults = [];
        }
        body.querySelector("#search-results").innerHTML = renderResults();
        wireAddButtons(body);
      });
      wireAddButtons(body);
    }

    function wireAddButtons(body) {
      body.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          const row = await auth.sendFriendRequest(b.dataset.add);
          toast(row && row.status === "accepted" ? `You and @${b.dataset.add} are now friends 🎉` : `Friend request sent to @${b.dataset.add}`);
          searchResults = null;
          invalidate();
          render(true);
        } catch (e) {
          b.disabled = false;
          toast(e.message);
        }
      }));
    }

    function wireInvite(body) {
      const link = body.querySelector("#invite-link");
      body.querySelector("#copy-invite")?.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(link.textContent);
          toast("Invite link copied");
        } catch (e) {
          const range = document.createRange();
          range.selectNodeContents(link);
          const sel = getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          toast("Press and hold (or Ctrl+C) to copy the link");
        }
      });
      body.querySelector("#share-invite")?.addEventListener("click", () => {
        navigator.share({
          title: "Join me on SatWizz",
          text: "Practice SAT grammar with me and let's keep a streak going 🔥",
          url: link.textContent,
        }).catch(() => {});
      });
    }

    async function renderPushCard(el) {
      if (!el) return;
      const state = await auth.pushState();
      if (state === "enabled" || state === "not-configured" || state === "unsupported") {
        el.hidden = state !== "enabled";
        el.innerHTML = state === "enabled" ? '<p class="muted">🔔 Lock In alerts are on for this device.</p>' : "";
        return;
      }
      const copy = {
        default: "Get a notification when a friend tells you to Lock In.",
        denied: "Notifications are blocked for SatWizz. Allow them in your browser's site settings to get Lock In alerts.",
        "needs-install": "On iPhone, add SatWizz to your Home Screen (Share → Add to Home Screen) to get Lock In alerts.",
      }[state];
      el.innerHTML = `<p class="muted">🔔 ${copy}</p>${state === "default" ? '<button class="btn ghost" type="button" id="push-on">Turn on alerts</button>' : ""}`;
      el.querySelector("#push-on")?.addEventListener("click", async () => {
        try {
          await auth.enablePush();
          toast("Lock In alerts are on 🔔");
        } catch (e) {
          toast(e.message);
        }
        renderPushCard(el);
      });
    }

    return { render, invalidate };
  }

  SW.socialView = { mount };
})();

</script>
<script>
/* ===== js/app.js ===== */
(function () {
  "use strict";

  const SW = window.SatWizz;
  SW.curriculum.build(); // every chapter file has registered by now
  const QUESTIONS = SW.questions;
  const THEMES = SW.themes;
  const PRONOUNS = SW.pronouns;
  const CHAPTERS = SW.chapters;
  const chapterById = SW.chapterById;
  const CORE_CHAPTERS = SW.CORE_CHAPTERS;
  const REVIEW_ID = "review"; // mixed review of completed chapters
  const SAVE_VERSION = 3; // 3: 7-chapter curriculum, Focus 0-100%
  const auth = SW.auth;
  const onboarding = SW.onboarding;
  const sfx = SW.sfx;
  const rewards = SW.rewards;
  const RULES = rewards.RULES;
  const BY_ID = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));
  const STORE_KEY = "satwizz.v1";
  const LEGACY_STORE_KEY = "brainblast-sat.v1"; // pre-rebrand saves
  const SIGNUP_PROMPT_COMBO = 3;
  const GOALS = [5, 10, 20];
  const FOCUS = SW.focus; // the 0-100% Focus Meter (js/focus.js)
  const REVIEW_LENGTH = FOCUS.RULES.restoreStreak; // Focus Break: this many right in a row

  // ---------- State ----------
  const DEFAULTS = {
    name: "",
    themeId: SW.defaultThemeId,
    castChosen: false,
    custom: {
      people: [
        { name: "", pro: "he" },
        { name: "", pro: "she" },
        { name: "", pro: "they" },
      ],
      place: "",
      craft: "",
      event: "",
    },
    goal: 5,
    xp: 0,
    combo: 0,
    bestCombo: 0,
    streak: 0,
    bestStreak: 0,
    lastDone: null, // date key of the last day the goal was met
    freezes: 0, // Aura Shields (synced as streak_freezes)
    days: {}, // dateKey -> { n, c, done, frozen }
    skills: {}, // skill -> { seen, right }
    missed: [], // question ids answered wrong and not yet fixed
    guest: false, // chose "Continue as Guest", so don't prompt again on a combo
    // curriculum
    chapterId: 1, // current chapter (1-10) or "review"
    unlockedChapters: [1],
    completedChapters: [],
    chapterCorrect: {}, // chapterId -> question ids answered correctly
    // gamification
    sparks: RULES.startSparks, // new players start with 2,500 ⚡
    focus: FOCUS.RULES.max, // Focus Meter 0-100%, kept between sessions (js/focus.js)
    focusStreak: 0, // right answers in a row toward the next +25%
    unlockedThemes: [],
    badges: [],
    title: null, // equipped badge id
    wager: null,
    totalCorrect: 0,
    comboSavers: 0,
    avatar: SW.defaultAvatarId,
    unlockedAvatars: [],
    // Vocab Vault spaced-repetition progress (see js/vocab.js)
    vocab: SW.vocab.emptyProgress(),
    // social
    username: "", // @handle, claimed on first sign-in
    displayName: "",
    lbScope: "global", // leaderboard tab: "global" | "friends"
    lbMetric: "xp", // rank by "xp" | "sparks"
    derbyChapter: null, // unit the Derby races on (defaults to the current chapter)
    genSeed: 0, // per-player seed: question casts and the no-repeat order of generated questions
    genCursor: {}, // chapterId -> how many generated questions you've been served
    // Review for Understanding tests (8/10 unlocks the next chapter) and
    // practice sets: chapterId -> { best, last, n, passed, attempts, at }
    tests: {},
    practiceSets: {},
    focusResetAt: 0, // ms of the last hourly Focus recharge
    // settings
    muted: false,
    haptics: true,
    demo: false, // Demo Mode: everything unlocked, nothing synced
    // sync bookkeeping
    updatedAt: 0, // ms of the last change made on this device
    syncedUserId: null, // account this device last merged with
    v: SAVE_VERSION,
  };

  let S = load();
  if (!S.genSeed) S.genSeed = (Math.floor(Math.random() * 2 ** 31) || 1);

  function normalize(saved) {
    const s = { ...structuredClone(DEFAULTS), ...saved, custom: { ...DEFAULTS.custom, ...(saved.custom || {}) } };
    if (!Array.isArray(s.unlockedThemes)) s.unlockedThemes = [];
    if (!Array.isArray(s.badges)) s.badges = [];
    if (!Array.isArray(s.missed)) s.missed = [];
    if (!Array.isArray(s.unlockedAvatars)) s.unlockedAvatars = [];
    s.vocab = SW.vocab.mergeProgress(s.vocab, null); // fills defaults, drops unknown words
    if (!SW.avatars.some((a) => a.id === s.avatar)) s.avatar = SW.defaultAvatarId;
    // Saves from before Sparks existed: count correct answers from skill stats.
    if (typeof saved.totalCorrect !== "number") {
      s.totalCorrect = Object.values(s.skills || {}).reduce((n, k) => n + (k.right || 0), 0);
    }
    // Saves from before the 7-chapter curriculum: renumber chapters
    // (old 2-10 → 1-9; old chapter 1 was retired) and turn the 3 Focus
    // Shields into a full 0-100% Focus Meter.
    if ((saved.v || 1) < 3) {
      const map = (id) => SW.LEGACY_CHAPTER_MAP[id];
      const ids = (list) => (Array.isArray(list) ? list.map(map).filter(Boolean) : []);
      s.unlockedChapters = ids(saved.unlockedChapters);
      s.completedChapters = ids(saved.completedChapters);
      const cc = {};
      for (const [k, v] of Object.entries(saved.chapterCorrect || {})) if (map(Number(k))) cc[map(Number(k))] = v;
      s.chapterCorrect = cc;
      s.chapterId = saved.chapterId === REVIEW_ID ? REVIEW_ID : map(saved.chapterId) || 1;
      s.focus = FOCUS.RULES.max;
      s.focusStreak = 0;
    }
    s.focus = FOCUS.clamp(s.focus);
    // Drop question ids that no longer exist and old filters.
    s.missed = s.missed.filter((id) => BY_ID[id]);
    delete s.filter;
    delete s.focusDay;
    const validChapter = (id) => Number.isInteger(id) && chapterById(id);
    s.unlockedChapters = [...new Set([1, ...(s.unlockedChapters || []).filter(validChapter)])];
    s.completedChapters = [...new Set((s.completedChapters || []).filter(validChapter))];
    if (!s.chapterCorrect || typeof s.chapterCorrect !== "object") s.chapterCorrect = {};
    if (!s.tests || typeof s.tests !== "object") s.tests = {};
    if (!s.practiceSets || typeof s.practiceSets !== "object") s.practiceSets = {};
    if (s.chapterId !== REVIEW_ID && !s.unlockedChapters.includes(s.chapterId)) s.chapterId = 1;
    // Packs that used to be free stay free for anyone who played before v2,
    // and anyone already using a cast that became paid keeps it.
    if ((saved.v || 1) < 2) {
      const played = (saved.xp || 0) > 0 || (saved.totalCorrect || 0) > 0 || Object.keys(saved.days || {}).length > 0;
      if (played) SW.legacyFreeThemes.forEach((id) => { if (!s.unlockedThemes.includes(id)) s.unlockedThemes.push(id); });
    }
    s.v = SAVE_VERSION;
    const current = THEMES.find((t) => t.id === s.themeId);
    if (current && current.price && !s.unlockedThemes.includes(current.id)) s.unlockedThemes.push(current.id);
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_STORE_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) { /* storage unavailable: start fresh */ }
    return structuredClone(DEFAULTS);
  }

  // touch=false for bookkeeping (day rollover) so a stale device doesn't look
  // newer than the cloud when merging. Demo Mode never reaches the cloud.
  function save(touch = true) {
    if (touch) S.updatedAt = Date.now();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
    if (!S.demo) auth.schedulePush(() => S);
  }

  // ---------- Dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayKey = () => keyOf(new Date());
  const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const dayDiff = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
  const today = () => (S.days[todayKey()] ||= { n: 0, c: 0 });

  // Missed days: spend Aura Shields if there are enough, otherwise the streak
  // (and any wager) is lost.
  function rollover() {
    const t = todayKey();
    let changed = false;
    if (S.lastDone && S.streak > 0) {
      const gap = dayDiff(S.lastDone, t);
      if (gap > 1) {
        const missedDays = gap - 1;
        if (S.freezes >= missedDays) {
          for (let i = 1; i <= missedDays; i++) {
            const k = addDays(S.lastDone, i);
            S.days[k] = { ...(S.days[k] || { n: 0, c: 0 }), frozen: true };
          }
          S.freezes -= missedDays;
          S.lastDone = addDays(t, -1);
          toast(`💠 ${missedDays === 1 ? "An Aura Shield" : missedDays + " Aura Shields"} saved your ${S.streak}-day streak`);
        } else {
          const lost = rewards.loseWager(S);
          toast(`Your ${S.streak}-day streak ended${lost ? ` and your ${lost.stake} ⚡ wager was lost` : ""}. Start a new one today.`);
          S.streak = 0;
        }
        changed = true;
      }
    }
    if (changed) save(false);
  }

  const doneToday = () => S.lastDone === todayKey();
  const atRisk = () => S.streak > 0 && !doneToday();

  // ---------- Personalization ----------
  function castOf(themeId = S.themeId) {
    if (themeId === "custom") {
      const fallback = THEMES[0];
      const c = S.custom;
      return {
        people: c.people.map((p, i) => ({ name: p.name.trim() || fallback.people[i].name, pro: p.pro })),
        place: c.place.trim() || fallback.place,
        craft: c.craft.trim() || fallback.craft,
        event: c.event.trim() || fallback.event,
      };
    }
    const t = THEMES.find((x) => x.id === themeId);
    return t && rewards.isThemeUnlocked(S, t.id) ? t : THEMES[0];
  }

  // Casts have 8 people; each question uses 3 of them for its NAME_1..3 slots,
  // picked by a seeded shuffle so the same question always shows the same 3.
  function castFor(key) {
    const base = castOf();
    if (!key || base.people.length <= 3) return base;
    const people = SW.rng.shuffle(base.people, SW.rng.hash(String(key)) ^ (S.genSeed >>> 0)).slice(0, 3);
    return { ...base, people };
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

  // Swaps {{NAME_1}}, {{NAME_2_POSS}}, {{LOCATION}} etc. for the chosen cast.
  // Returns HTML; names are highlighted unless mark=false.
  const PLACEHOLDER = /\{\{(?:NAME_([123])(?:_(POSS|OBJ))?|(LOCATION|EVENT|SKILL))\}\}/g;
  function fill(template, cast = castOf(), mark = true) {
    return esc(template).replace(PLACEHOLDER, (m, n, form, flavorKey) => {
      if (n) {
        const p = cast.people[Number(n) - 1];
        if (form) return esc(PRONOUNS[p.pro][form === "POSS" ? "his" : "him"]);
        return mark ? `<span class="cast">${esc(p.name)}</span>` : esc(p.name);
      }
      const flavor = { LOCATION: cast.place, SKILL: cast.craft, EVENT: cast.event }[flavorKey];
      return flavor != null ? esc(flavor) : m;
    });
  }

  const castNames = (t) => `${t.people.slice(0, 3).map((p) => p.name).join(", ")} + ${t.people.length - 3} more`;

  // Free casts first, then packs by price.
  const themesForPicker = () => THEMES.slice().sort((a, b) => (a.price || 0) - (b.price || 0));

  // A cast button for the welcome card and the Personalize view.
  function castButton(t, onPick) {
    const locked = !rewards.isThemeUnlocked(S, t.id);
    const sub = t.id === "custom" ? "Type any names you like" : castNames(t);
    const b = h("button", {
      class: `cast-btn${locked ? " locked" : ""}`,
      type: "button",
      "data-id": t.id,
      "aria-pressed": String(t.id === S.themeId),
    }, `<b>${esc(t.label)}</b><span>${locked ? `🔒 ${fmt(t.price)} ⚡ in the Shop` : esc(sub)}</span>`);
    b.addEventListener("click", () => {
      if (locked) {
        show("shop");
        toast(`Unlock ${t.label} in the Shop for ${fmt(t.price)} ⚡`);
        return;
      }
      onPick(t);
    });
    return b;
  }

  const currentAvatar = () => rewards.avatarById(S.avatar) || rewards.avatarById(SW.defaultAvatarId);

  // ---------- Question queue ----------
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // A chapter runs through a queue of its questions. Wrong answers go back
  // into the queue, so the chapter is complete once every question has been
  // answered correctly. Mixed review never runs out.
  let queue = []; // { id, isRetry }
  // After the core set (or when you reopen a finished chapter), the feed keeps
  // going with generated questions (js/curriculum/gen/) in a per-player
  // shuffled order. S.genCursor counts what's been served, so nothing repeats
  // until the chapter's whole pool has been seen; then a new lap starts in a
  // fresh order.
  let streaming = false;
  const genOrders = {};
  function nextGenId(chId) {
    const ch = chapterById(chId);
    if (!ch || !ch.pool || !ch.pool.length) return null;
    const n = S.genCursor[chId] || 0;
    const lap = Math.floor(n / ch.pool.length);
    const key = `${chId}:${lap}`;
    const order = (genOrders[key] ||= SW.rng.shuffle(ch.pool.map((q) => q.id), ((S.genSeed >>> 0) ^ Math.imul(chId + 1, 2654435761) ^ lap) >>> 0));
    S.genCursor[chId] = n + 1;
    return order[n % order.length];
  }
  let served = 0;
  let lastId = null;
  let completeShown = false;

  const inReview = () => S.chapterId === REVIEW_ID;
  const currentChapter = () => (inReview() ? null : chapterById(S.chapterId));
  const correctIn = (chId) => (S.chapterCorrect[chId] ||= []);
  const isUnlocked = (chId) => S.unlockedChapters.includes(chId);
  const isComplete = (chId) => S.completedChapters.includes(chId);
  // Mixed review opens once any core chapter is complete.
  const reviewOpen = () => S.completedChapters.some((id) => !chapterById(id).bonus);

  function buildQueue() {
    const ch = currentChapter();
    if (ch) {
      const done = new Set(correctIn(ch.id));
      // In progress: only what's left. Replay of a finished chapter: everything.
      // The pop-culture set (questions with a rule line) comes first, then the
      // extra practice, each shuffled.
      // A finished chapter skips straight to fresh generated questions.
      // (Bonus chapters have no generated pool, so they replay their core set.)
      const stream = isComplete(ch.id) && ch.pool.length > 0;
      const left = stream ? [] : ch.questions.filter((q) => isComplete(ch.id) || !done.has(q.id));
      queue = [...shuffle(left.filter((q) => q.rule)), ...shuffle(left.filter((q) => !q.rule))]
        .map((q) => ({ id: q.id, isRetry: false }));
    } else {
      queue = [];
    }
  }

  // Mixed review: missed questions first, then a shuffle of completed chapters.
  function refillReview() {
    const pool = QUESTIONS.filter((q) => isComplete(q.chapterId)).map((q) => q.id);
    const missed = shuffle(S.missed.filter((id) => pool.includes(id)));
    const rest = shuffle(pool.filter((id) => !missed.includes(id)));
    queue.push(...[...missed, ...rest].map((id) => ({ id, isRetry: false })));
    if (queue.length > 1 && queue[0].id === lastId) queue.push(queue.shift());
  }

  function nextQuestion() {
    if (inReview() && !queue.length) refillReview();
    let next = queue.shift();
    if (!next && streaming && currentChapter()) {
      const id = nextGenId(S.chapterId);
      if (id) next = { id, isRetry: false };
    }
    if (!next) return null;
    served++;
    lastId = next.id;
    return { q: BY_ID[next.id], isRetry: next.isRetry };
  }

  // Wrong answer: see it again two cards later (or at the end of a short queue).
  function requeue(id) {
    queue.splice(Math.min(2, queue.length), 0, { id, isRetry: true });
  }

  // ---------- Derby question source: grammar from your unit ----------
  function derbyChapter() {
    const pick = [S.derbyChapter, S.chapterId].find((id) => Number.isInteger(id) && isUnlocked(id));
    return chapterById(pick || 1);
  }
  function grammarSource() {
    return {
      title: "SatWizz Grammar Derby",
      banner: "=== 🐎 SATWIZZ GRAMMAR DERBY 🐎 ===",
      tagline: "Where clean sentences win photo finishes.",
      intro: "Answer Digital SAT grammar questions from your unit as fast and as accurately as you can.",
      // CPU reading time per question, tuned by simulation so that breaking
      // even at ×1.5 takes about 11.5s per question at 85% (see README).
      read: [13, 17],
      // Questions you missed come first, then core ones you haven't got right
      // yet, then fresh generated questions (never repeated; see nextGenId).
      draw() {
        const ch = derbyChapter();
        const got = new Set(correctIn(ch.id));
        const missed = shuffle(S.missed.filter((id) => BY_ID[id] && BY_ID[id].chapterId === ch.id));
        const fresh = shuffle(ch.questions.map((q) => q.id).filter((id) => !got.has(id) && !missed.includes(id)));
        return [...missed, ...fresh, ...this.more()];
      },
      more() {
        const ch = derbyChapter();
        const ids = [];
        for (let i = 0; i < 20; i++) {
          const id = nextGenId(ch.id);
          if (id) ids.push(id);
        }
        // Chapters without a generated pool (the bonus ones) reuse their core set.
        return ids.length ? ids : shuffle(ch.questions.map((q) => q.id));
      },
      question(id) {
        const q = BY_ID[id];
        const order = shuffle([0, 1, 2, 3]);
        const ch = chapterById(q.chapterId);
        return {
          id,
          cast: castFor(id),
          meta: `${ch.bonus ? "Bonus" : `Ch ${ch.id}`} · ${ch.short}`,
          passage: q.text,
          stem: SW.stemFor(q),
          choices: order.map((i) => q.choices[i]),
          answer: order.indexOf(q.answer),
          notes: order.map((i) => q.notes[i]),
          rule: q.rule || "",
          explain: q.notes[q.answer],
        };
      },
      // Derby answers count toward the unit like Practice answers do.
      onAnswer(dq, correct) {
        const q = BY_ID[dq.id];
        const sk = (S.skills[q.skill] ||= { seen: 0, right: 0 });
        sk.chapterId = q.chapterId;
        sk.seen++;
        if (correct) {
          sk.right++;
          S.totalCorrect++;
          S.missed = S.missed.filter((id) => id !== q.id);
          if (!q.gen) {
            const got = correctIn(q.chapterId);
            if (!got.includes(q.id)) got.push(q.id);
          }
        } else if (!S.missed.includes(q.id)) S.missed.push(q.id);
        renderChapterBar();
      },
      missNote: () => "↺ Saved to your missed questions: it comes back first next race and in mixed review.",
      lateNote: (dq) => `Answer: ${renderPassage(BY_ID[dq.id].text, dq.cast, fill(BY_ID[dq.id].choices[BY_ID[dq.id].answer], dq.cast, false))}`,
      review: {

            q.rule ? fill(q.rule, cast, false) : fill(q.notes[q.answer], cast, false),
          ];
        },
        note: "Missed questions come back first in your next race and in mixed review.",
      },
      unitHtml() {
        const cur = derbyChapter();
        const opts = CHAPTERS.filter((c) => isUnlocked(c.id))
          .map((c) => `<option value="${c.id}" ${c.id === cur.id ? "selected" : ""}>${c.bonus ? "Bonus" : `Ch ${c.id}`} · ${esc(c.short)}</option>`).join("");
        return `<label class="unit-pick"><span class="label-sm">Racing on</span><select class="select" id="derby-unit">${opts}</select></label>`;
      },
      wireUnit(el, rerender) {
        el.querySelector("#derby-unit")?.addEventListener("change", (e) => {
          S.derbyChapter = Number(e.target.value);
          save();
          rerender();

    };
  }

  // ---------- Feed ----------

  const visObs = new IntersectionObserver((entries) => {

  // Opens a chapter (or mixed review): Explanation Pause, then its questions.
  function startChapter(id) {
    if (id !== REVIEW_ID && !isUnlocked(id)) return;
