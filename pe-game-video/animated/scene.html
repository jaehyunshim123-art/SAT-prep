<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W = 1280, H = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = 'Inter, "Noto Color Emoji", sans-serif';
const EMO = '"Noto Color Emoji"';

// ---------- BOARD ----------
const COLS = 12, ROWS = 4, SQ = 52, GAPX = 8, ROWSTEP = 96;
const BX = 1280 / 2 - (COLS * (SQ + GAPX) - GAPX) / 2, BY = 118;
function sqPos(i) {
  const r = Math.floor(i / COLS), k = i % COLS;
  const col = r % 2 === 0 ? k : COLS - 1 - k;
  const row = ROWS - 1 - r; // row 0 at bottom
  return { x: BX + col * (SQ + GAPX) + SQ / 2, y: BY + row * ROWSTEP + SQ / 2 + 20 };
}
const T = {}; // square types
function S(i, kind, top, bot) { T[i] = { kind, top, bot }; }
S(0, 'start', '🚩', 'START');
S(2, 'minus', '−1', '💰 FIN');
S(3, 'plus', '+1', '💪 PHYS');
S(4, 'gambleM', '🎰', 'MUST');
S(5, 'plus', '+1', '📚 INTEL');
S(7, 'minus', '−1', '🤝 SOC');
S(8, 'plus', '+1', '😊 EMO');
S(9, 'gambleC', '🎰', 'CHOICE');
S(11, 'check', '⭐', 'GR 9');
S(13, 'plus', '+1', '🙏 SPIR');
S(14, 'minus', '−1', '💪 PHYS');
S(16, 'addict', '🥚', 'TEST');
S(18, 'plus', '+1', '🤝 SOC');
S(19, 'refusal', '✋', 'REFUSE');
S(21, 'minus', '−1', '😊 EMO');
S(23, 'check', '⭐', 'GR 10');
S(25, 'gambleC', '🎰', 'CHOICE');
S(26, 'plus', '+1', '📚 INTEL');
S(28, 'refusal', '✋', 'REFUSE');
S(30, 'minus', '−1', '💰 FIN');
S(31, 'plus', '+1', '💪 PHYS');
S(33, 'gambleM', '🎰', 'MUST');
S(35, 'check', '⭐', 'GR 11');
S(37, 'plus', '+1', '🤝 SOC');
S(38, 'addict', '🥚', 'TEST');
S(40, 'minus', '−1', '🤝 SOC');
S(41, 'plus', '+1', '😊 EMO');
S(43, 'gambleC', '🎰', 'CHOICE');
S(44, 'plus', '+1', '📚 INTEL');
S(47, 'grad', '🎓', 'GRAD!');
const KIND = {
  plus: ['#d9f5e4', '#2f9e62'], minus: ['#fde0db', '#d24a35'], gambleM: ['#efe0ff', '#7b2ff7'],
  gambleC: ['#f3eaff', '#9a5cff'], check: ['#ffe8a8', '#e09a00'], refusal: ['#dbeaff', '#2e6fd8'],
  addict: ['#ffe4cc', '#e07a1f'], start: ['#ffffff', '#2a1550'], grad: ['#ffd76a', '#b07800'], none: ['#fffdf7', '#d8cfe8']
};
const BRIDGES = [[11, 15, 'short way'], [16, 20, '2nd semester'], [19, 23, 'short way'], [23, 27, 'short way'],
  [25, 30, 'short way'], [28, 32, 'short way'], [35, 39, 'short way'], [38, 42, '2nd semester']];
function bridgeCurve(a, b) {
  const p = sqPos(a), q = sqPos(b);
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
  const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
  let nx = -dy / len, ny = dx / len; if (ny > 0) { nx = -nx; ny = -ny; }
  const bulge = Math.min(70, 30 + len * 0.18);
  return { p, q, c: { x: mx + nx * bulge, y: my + ny * bulge } };
}
function onCurve(cu, u) {
  const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
  return { x: a * cu.p.x + b * cu.c.x + c * cu.q.x, y: a * cu.p.y + b * cu.c.y + c * cu.q.y };
}

// ---------- PLAYERS ----------
const P = [
  { name: 'Maya', value: 'Athlete', icon: '🏀', color: '#e5483b', skin: '#8d5a3b', hair: '#1d1410', x: 92, y: 146, side: 1, style: 'athlete' },
  { name: 'Leo', value: 'Education', icon: '📚', color: '#2f74e0', skin: '#f1c9a5', hair: '#6b3f1d', x: 1188, y: 146, side: -1, style: 'glasses' },
  { name: 'Sam', value: 'Future', icon: '💰', color: '#e9a514', skin: '#c68a5e', hair: '#2b1b12', x: 92, y: 405, side: 1, style: 'cap' },
  { name: 'Ava', value: 'Friendship', icon: '🤝', color: '#2fa865', skin: '#f6d2b8', hair: '#c2552b', x: 1188, y: 405, side: -1, style: 'pony' },
];
const PAWN_OFF = [[-9, -9], [9, -9], [-9, 9], [9, 9]];

// ---------- TIMELINE ----------
let t0 = 0; const tl = { pawn: [[], [], [], []], flowers: [[], [], [], []], bubbles: [], captions: [], dice: [], pops: [],
  active: [], cheer: [], bridgesHi: [], deltas: [], sfx: [], cards: [], timer: [], confetti: [], titles: [], highlightSq: [] };
const pos = [0, 0, 0, 0], fl = [5, 5, 5, 5];
function at(t) { t0 = t; }
function wait(d) { t0 += d; }
function sfx(name, t = t0) { tl.sfx.push({ t, name }); }
function caption(text, dur, sub) { tl.captions.push({ t: t0, d: dur, text, sub }); }
function bubble(p, text, dur) { tl.bubbles.push({ t: t0, d: dur, p, text }); }
function activeP(p, dur) { tl.active.push({ t: t0, d: dur, p }); }
function roll(p, v) { tl.dice.push({ t: t0, d: 2.0, p, v }); sfx('dice'); tl.active.push({ t: t0, d: 1.2, p, arm: 1 }); wait(2.0); }
function hopTo(p, target, step = 0.3) {
  while (pos[p] !== target) {
    const from = pos[p], to = from + (target > from ? 1 : -1);
    tl.pawn[p].push({ t: t0, d: step, from, to, mode: 'hop' }); sfx('hop', t0 + step * 0.9);
    pos[p] = to; wait(step);
  }
}
function slideBack(p, target) { tl.pawn[p].push({ t: t0, d: 1.0, from: pos[p], to: target, mode: 'slide' }); sfx('whoosh'); pos[p] = target; wait(1.0); }
function bridge(p, a, b) {
  tl.bridgesHi.push({ t: t0, d: 1.8, a, b });
  tl.pawn[p].push({ t: t0, d: 1.2, from: a, to: b, mode: 'bridge' }); sfx('whoosh'); pos[p] = b; wait(1.4);
}
function flowers(p, delta, label) {
  fl[p] += delta; tl.flowers[p].push({ t: t0, v: fl[p] });
  tl.deltas.push({ t: t0, p, delta, label }); sfx(delta > 0 ? 'ding' : 'bonk');
}
function pop(kind, data, dur) { tl.pops.push({ t: t0, d: dur, kind, data }); }
function cheer(p, dur = 1.2) { tl.cheer.push({ t: t0, d: dur, p }); }
function hiSq(i, dur) { tl.highlightSq.push({ t: t0, d: dur, i }); }
function sqPop(i, dur = 2.2) { const s = T[i]; pop('square', { i }, dur); hiSq(i, dur); }

// ===== SCRIPT =====
for (let p = 0; p < 4; p++) tl.flowers[p].push({ t: 0, v: 5 });
tl.titles.push({ t: 0, d: 5.2 });
at(0.2); sfx('chime');
at(5.0);
caption('Meet the players! Each one picks a Value Card.', 6.2, 'Everyone starts with 5 flowers 🌸 from the DOW box.');
for (let p = 0; p < 4; p++) { tl.cards.push({ t: t0 + p * 0.5, p }); sfx('card', t0 + p * 0.5); }
wait(2.6);
for (let p = 0; p < 4; p++) { bubble(p, ['I\'m the Athlete! 🏀', 'Education for me! 📚', 'I value my Future 💰', 'Friendship! 🤝'][p], 2.2); }
wait(3.6);
caption('Set a 20-minute timer ⏱️', 2.2, 'When time runs out, the player furthest along wins.');
tl.timer.push({ t: t0, mode: 'start' }); sfx('chime'); wait(2.6);

// --- Round 1
caption('Roll the die and move. Do what the square says!', 6.8, 'Maya lands on +1 Physical: take a flower. Athlete power: roll again!');
activeP(0, 6.8); roll(0, 3); hopTo(0, 3); sqPop(3); flowers(0, 1, '+1'); cheer(0); bubble(0, 'Athlete power: roll again! 🏀', 2.2); wait(2.2);
roll(0, 2); hopTo(0, 5); sqPop(5, 1.6); flowers(0, 1, '+1'); wait(1.6);

caption('Leo lands on +1 Intellectual.', 4.6, 'Education power: take 2 flowers instead of 1!');
activeP(1, 4.6); roll(1, 5); hopTo(1, 5, 0.22); sqPop(5); flowers(1, 2, '+2'); cheer(1); bubble(1, 'Double flowers! 📚', 2.0); wait(2.3);

caption('Sam lands on −1 Financial.', 4.4, 'Future power: on a −1 Financial square, you keep your flower!');
activeP(2, 4.4); roll(2, 2); hopTo(2, 2); sqPop(2); bubble(2, 'Future power! I keep my flower 💰', 2.4); sfx('shield'); wait(2.4);

caption('Ava lands on Gamble: Mandatory. She MUST bet on the website.', 6.8, 'Win = short way + 4 flowers. Lose = lose 1 flower.');
activeP(3, 6.8); roll(3, 4); hopTo(3, 4); sqPop(4, 1.4); wait(1.2);
pop('laptop', { result: 'LOSE' }, 3.0); wait(2.2); flowers(3, -1, '−1'); bubble(3, 'Aww, I lost a flower 😩', 1.6); wait(1.6);

// --- Round 2
caption('Maya lands on +1 Emotional.', 3.8, 'Take 1 flower from the DOW box.');
activeP(0, 3.8); roll(0, 3); hopTo(0, 8); sqPop(8, 1.4); flowers(0, 1, '+1'); wait(1.4);

caption('Every grade ends at a checkpoint ⭐. Everyone stops there!', 9.2, 'You need at least 2 flowers to pass. Fewer than 2? Repeat the grade!');
activeP(1, 9.2); roll(1, 6); hopTo(1, 11, 0.24); sqPop(11, 1.2); wait(1.2);
pop('check', { p: 1, n: fl[1] }, 2.4); sfx('ding'); wait(2.4);
pop('card', { text: 'SHORT WAY', good: true }, 2.0); sfx('card'); wait(1.6); bubble(1, 'Short way! 🙌', 1.6); bridge(1, 11, 15);

caption('Sam lands on −1 Social.', 3.6, 'Put 1 flower back in the DOW box.');
activeP(2, 3.6); roll(2, 5); hopTo(2, 7, 0.24); sqPop(7, 1.4); flowers(2, -1, '−1'); wait(1.5);

caption('Ava lands on Gamble: Choice. She can bet or skip.', 5.4, 'Decision making: Ava chooses NOT to gamble.');
activeP(3, 5.4); roll(3, 5); hopTo(3, 9, 0.24); sqPop(9, 1.2); wait(1.0); bubble(3, 'I already lost once… I\'ll skip it! 🙅‍♀️', 2.4); wait(2.4);

// --- Round 3
caption('Maya rolls past the checkpoint ⭐…', 8.6, 'If you roll past a checkpoint, go back to the ⭐ and draw a Refusal Skills card.');
activeP(0, 8.6); roll(0, 5); hopTo(0, 13, 0.24); bubble(0, 'Oops! Back to the star ⭐', 1.6); wait(0.6); slideBack(0, 11); wait(0.2);
pop('card', { text: 'LONG WAY', good: false }, 2.2); sfx('card'); wait(2.0); bubble(0, 'Long way this time 😅', 1.4); wait(1.4);

caption('Leo lands on an Addiction Test 🥚', 7.2, 'Draw a slip from the egg. Not addicted? Advance to Second Semester!');
activeP(1, 7.2); roll(1, 1); hopTo(1, 16); sqPop(16, 1.2); wait(1.0);
pop('egg', { text: 'NOT ADDICTED ✓' }, 2.6); sfx('crack'); wait(2.2); bridge(1, 16, 20);

caption('Sam lands on a blank square.', 2.6, 'Nothing happens. Next player!');
activeP(2, 2.6); roll(2, 3); hopTo(2, 10, 0.24); wait(0.0);

caption('Ava reaches the checkpoint ⭐ with 4 flowers.', 8.2, 'Friendship power: say a refusal skill out loud and take the short way!');
activeP(3, 8.2); roll(3, 2); hopTo(3, 11); pop('check', { p: 3, n: fl[3] }, 1.8); sfx('ding'); wait(1.8);
bubble(3, '"No thanks! Let\'s go shoot hoops instead." 🏀', 2.8); wait(2.8); cheer(3); bridge(3, 11, 15);

// --- Round 4: Leo wins a gamble
caption('Leo lands on Gamble: Choice and decides to bet.', 7.4, 'He wins: short way + 4 flowers! (Gambling is risky. Most people lose.)');
activeP(1, 7.4); roll(1, 5); hopTo(1, 25, 0.24); sqPop(25, 1.2); wait(1.0);
pop('laptop', { result: 'WIN' }, 3.0); wait(2.2); flowers(1, 4, '+4'); sfx('win'); cheer(1); wait(0.8); bridge(1, 25, 30);

// --- Montage
const mStart = t0;
caption('…and the game keeps going!', 6.0, 'Collect flowers, make good choices and race to Graduation 🎓');
tl.timer.push({ t: t0, mode: 'fast', d: 6.0 });
const runs = [[0, 22], [2, 18], [3, 26]];
for (const [p, tg] of runs) { const save = t0; tl.pawn[p].push({ t: t0, d: 5.0, from: pos[p], to: tg, mode: 'run' }); pos[p] = tg; t0 = save; }
tl.pawn[1].push({ t: t0, d: 2.2, from: 30, to: 35, mode: 'run' }); wait(2.4); pos[1] = 35;
bridge(1, 35, 39);
tl.pawn[1].push({ t: t0, d: 2.2, from: 39, to: 47, mode: 'run' }); pos[1] = 47; wait(2.4);
t0 = Math.max(t0, mStart + 6.0);

caption('Leo reaches Graduation first. Leo wins! 🎓', 5.2, 'If the timer runs out first, the player furthest along wins.');
tl.confetti.push({ t: t0, d: 5 }); sfx('win'); for (let p = 0; p < 4; p++) cheer(p, 2.5);
bubble(1, 'I graduated! 🎓', 2.6); hiSq(47, 4.5); wait(2.6); bubble(3, 'Congrats Leo! 🎉', 2.2); bubble(0, 'GG! 👏', 2.2); wait(2.8);
tl.titles.push({ t: t0, d: 5.5, end: true }); sfx('chime'); wait(5.5);
const DURATION = t0;
// flowers timeline sanity - sort
for (const a of tl.flowers) a.sort((x, y) => x.t - y.t);

// ---------- STATE HELPERS ----------
const ease = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function pawnAt(p, t) {
  let cur = { ...sqPos(0) }, lift = 0, sqi = 0;
  for (const m of tl.pawn[p]) {
    if (t < m.t) break;
    const u = clamp((t - m.t) / m.d, 0, 1);
    if (m.mode === 'hop') {
      const a = sqPos(m.from), b = sqPos(m.to), e = ease(u);
      cur = { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e }; lift = Math.sin(Math.PI * u) * 16; sqi = u < 1 ? -1 : m.to;
    } else if (m.mode === 'slide') {
      const k = m.from + (m.to - m.from) * ease(u), lo = Math.floor(k), hi = Math.ceil(k), f = k - lo;
      const a = sqPos(lo), b = sqPos(hi); cur = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }; lift = 6; sqi = u < 1 ? -1 : m.to;
    } else if (m.mode === 'bridge') {
      const cu = bridgeCurve(m.from, m.to); cur = onCurve(cu, ease(u)); lift = Math.sin(Math.PI * u) * 26; sqi = u < 1 ? -1 : m.to;
    } else if (m.mode === 'run') {
      const n = m.to - m.from, k = m.from + n * u, lo = Math.floor(k), f = k - lo;
      const a = sqPos(lo), b = sqPos(Math.min(lo + 1, 47)); cur = { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
      lift = u < 1 ? Math.abs(Math.sin(Math.PI * f)) * 12 : 0; sqi = u < 1 ? -1 : m.to;
    }
  }
  return { ...cur, lift, sqi };
}
function flowersAt(p, t) { let v = 5, tt = -9; for (const f of tl.flowers[p]) if (f.t <= t) { v = f.v; tt = f.t; } return { v, since: t - tt }; }
function within(e, t) { return t >= e.t && t < e.t + e.d; }

// ---------- DRAWING ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, color, weight = 700, align = 'center', font = FONT) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size, weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`; const words = s.split(' '); const lines = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}

function drawBackground(t) {
  // room
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#3a1f6e'); g.addColorStop(1, '#22113f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // subtle wallpaper dots
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (let y = 20; y < H; y += 40) for (let x = (y / 40 % 2) * 20; x < W; x += 40) { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
  // table
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  rr(180, 62, 920, 540, 40); ctx.fillStyle = '#9b6a3f'; ctx.fill(); ctx.restore();
  rr(192, 74, 896, 516, 32); const tg = ctx.createLinearGradient(0, 74, 0, 590); tg.addColorStop(0, '#b9844f'); tg.addColorStop(1, '#a3703f'); ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = 'rgba(80,45,15,0.18)'; ctx.lineWidth = 2;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(200, 100 + i * 58); ctx.bezierCurveTo(500, 90 + i * 58, 800, 115 + i * 58, 1080, 100 + i * 58); ctx.stroke(); }
}

function drawBoard(t) {
  // board base
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
  rr(BX - 22, BY - 16, COLS * (SQ + GAPX) - GAPX + 44, ROWS * ROWSTEP + 4, 22); ctx.fillStyle = '#fff6e6'; ctx.fill(); ctx.restore();
  rr(BX - 22, BY - 16, COLS * (SQ + GAPX) - GAPX + 44, ROWS * ROWSTEP + 4, 22); ctx.lineWidth = 6; ctx.strokeStyle = '#f39c1f'; ctx.stroke();
  // grade labels
  for (let r = 0; r < 4; r++) {
    const p = sqPos(r * 12 + (r % 2 === 0 ? 0 : 11));
    txt(['GRADE 9', 'GRADE 10', 'GRADE 11', 'GRADE 12'][r], BX - 4, p.y - 36, 11, '#7b2ff7', 800, 'left');
  }
  // path connectors
  ctx.strokeStyle = '#e8dcc8'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i < 48; i++) { const p = sqPos(i); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.stroke();
  // bridges
  for (const [a, b, lab] of BRIDGES) {
    const cu = bridgeCurve(a, b); const hi = tl.bridgesHi.some(e => within(e, t) && e.a === a && e.b === b);
    ctx.save(); ctx.setLineDash(hi ? [] : [7, 7]); ctx.lineWidth = hi ? 7 : 4; ctx.strokeStyle = hi ? '#7b2ff7' : 'rgba(123,47,247,0.45)';
    ctx.beginPath(); ctx.moveTo(cu.p.x, cu.p.y); ctx.quadraticCurveTo(cu.c.x, cu.c.y, cu.q.x, cu.q.y); ctx.stroke(); ctx.restore();
  }
  // squares
  for (let i = 0; i < 48; i++) {
    const p = sqPos(i), s = T[i], k = KIND[s ? s.kind : 'none'];
    const hi = tl.highlightSq.find(e => within(e, t) && e.i === i);
    const sc = hi ? 1 + 0.12 * Math.sin(clamp((t - hi.t) / 0.35, 0, 1) * Math.PI) + 0.05 : 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(sc, sc);
    rr(-SQ / 2, -SQ / 2, SQ, SQ, 10); ctx.fillStyle = k[0]; ctx.fill(); ctx.lineWidth = hi ? 4 : 2.5; ctx.strokeStyle = hi ? '#ff9f1c' : k[1]; ctx.stroke();
    if (s) {
      const isEmoji = /[^\x00-\x7F−]/.test(s.top) && !s.top.startsWith('+') && !s.top.startsWith('−');
      if (isEmoji) txt(s.top, 0, -8, 20, '#000', 400, 'center', EMO); else txt(s.top, 0, -8, 19, k[1], 900);
      txt(s.bot, 0, 14, 9.5, k[1], 800);
    } else txt(String(i), 0, 0, 11, '#cbbfdf', 700);
    ctx.restore();
  }
  for (const [a, b, lab] of BRIDGES) {
    const cu = bridgeCurve(a, b); const hi = tl.bridgesHi.some(e => within(e, t) && e.a === a && e.b === b);
    const m = onCurve(cu, 0.5); rr(m.x - 38, m.y - 9, 76, 18, 9); ctx.fillStyle = hi ? '#7b2ff7' : 'rgba(255,255,255,0.95)'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#7b2ff7'; ctx.stroke(); txt(lab, m.x, m.y + 1, 10, hi ? '#fff' : '#7b2ff7', 800);
  }
}

function drawPawns(t) {
  const st = P.map((_, p) => pawnAt(p, t));
  const order = [0, 1, 2, 3].sort((a, b) => st[a].y - st[b].y);
  for (const p of order) {
    const s = st[p]; let ox = 0, oy = 0;
    if (s.sqi >= 0) { const same = [0, 1, 2, 3].filter(q => st[q].sqi === s.sqi); if (same.length > 1) { const k = same.indexOf(p); ox = PAWN_OFF[k][0]; oy = PAWN_OFF[k][1]; } }
    const x = s.x + ox, y = s.y + oy;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x, y + 10, 11, 5, 0, 0, 7); ctx.fill();
    const yy = y - s.lift;
    ctx.fillStyle = P[p].color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x - 11, yy + 10); ctx.quadraticCurveTo(x, yy - 14, x + 11, yy + 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, yy - 10, 8, 0, 7); ctx.fill(); ctx.stroke();

function drawPerson(p, t) {

function drawCards(t) {

function drawDice(t) {

    const face = rollU < 1 ? 1 + Math.floor((t * 20) % 6) : d.v;
    const rot = rollU < 1 ? t * 14 : 0; const fade = u > 0.85 ? 1 - (u - 0.85) / 0.15 : 1;

    ctx.save(); ctx.globalAlpha = fade; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(settle, settle);

    rr(-34, -34, 68, 68, 14); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 3; ctx.strokeStyle = '#2a1550'; ctx.stroke();

}

function popFrame(cx, cy, w, h, e, border = '#7b2ff7') {

      rr(-158, -98, 316, 186, 8); ctx.fillStyle = '#12101c'; ctx.fill();

}

function drawBubbles(t) {
  for (const b of tl.bubbles) {
    if (!within(b, t)) continue;
    const pl = P[b.p]; const u = t - b.t, out = b.t + b.d - t; const e = Math.min(ease(u / 0.2), ease(out / 0.2));
    const lines = wrap(b.text, 230, 17, 800); const w = Math.min(260, Math.max(...lines.map(l => ctx.measureText(l).width)) + 34), h = lines.length * 22 + 22;
    const bx = pl.side > 0 ? pl.x + 48 : pl.x - 48 - w, by = pl.y - 34 - h;

function drawTimer(t) {

  if (fast && t > fast.t) { const before = 20 * 60 - (fast.t - st.t) * 6; const u = clamp((t - fast.t) / fast.d, 0, 1); secs = before - u * (before - 47); }

  const a = clamp((t - st.t) / 0.4, 0, 1); ctx.globalAlpha = a;
  rr(1060, 14, 200, 44, 22); ctx.fillStyle = '#fffaf2'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#f39c1f'; ctx.stroke();
  txt(`⏱️ ${s}`, 1160, 37, 22, '#2a1550', 900); ctx.globalAlpha = 1;
}

function drawTopBar(t) { txt('🎓 The Road to Graduation', 26, 37, 22, '#fff', 900, 'left'); }

function drawTitle(t) {

function drawConfetti(t) {
